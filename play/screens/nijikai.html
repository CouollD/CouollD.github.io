<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>二人で抜け出す</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#1a1410;}

.phone{
  max-width:390px; min-height:100dvh; margin:0 auto;
  background:#141009;
  display:flex; flex-direction:column; overflow:hidden;
  position:relative; user-select:none;
}

/* STATUS BAR */
.status-bar{
  background:#000; color:#888;
  padding:10px 20px 6px;
  display:flex; justify-content:space-between; align-items:center;
  font-family:'IBM Plex Mono',monospace; font-size:11px;
  flex-shrink:0;
}

/* ── タイトルカード ── */
.title-card{
  position:absolute; inset:0; z-index:30;
  background:#0d0b08;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; cursor:pointer;
  transition:opacity .8s ease;
}
.title-card.hide{ opacity:0; pointer-events:none; }
.title-label{
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  font-size:13px; letter-spacing:.5em; text-indent:.5em;
  color:#c8841a;
}
.title-main{
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  font-size:26px; letter-spacing:.25em; text-indent:.25em;
  color:#f5f0e6;
}
.title-name{
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  font-size:13px; letter-spacing:.2em;
  color:#a89878;
}
.title-tap{
  margin-top:26px;
  font-family:'IBM Plex Mono',monospace; font-size:10px;
  color:#6a6050; animation:blink 1.6s infinite;
}
@keyframes blink{ 0%,100%{opacity:.25} 50%{opacity:1} }

/* ── 本文 ── */
.scene-area{
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:30px 26px 120px; cursor:pointer;
}
.scene-area p{
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  font-size:14px; line-height:2.1;
  color:#f5f0e6;
  margin-bottom:1.9em;
  opacity:0; transform:translateY(8px);
  transition:opacity 1.1s ease, transform 1.1s ease;
}
.scene-area p.show{ opacity:1; transform:none; }

/* 送りガイド */
.tap-guide{
  position:absolute; bottom:18px; left:0; right:0;
  text-align:center; pointer-events:none;
  font-family:'IBM Plex Mono',monospace; font-size:10px;
  color:#6a6050; animation:blink 1.6s infinite;
  transition:opacity .3s;
}
.tap-guide.hide{ opacity:0; animation:none; }

/* 幕引き */
.scene-end{
  text-align:center; margin:34px 0 10px;
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  font-size:12px; letter-spacing:.6em; text-indent:.6em;
  color:#c8841a;
  opacity:0; transition:opacity 1.4s ease;
}
.scene-end.show{ opacity:1; }

/* ── 終了後アクション ── */
.bottom-actions{
  position:absolute; bottom:0; left:0; right:0;
  padding:14px 20px 22px;
  background:linear-gradient(to top, #0d0b08 60%, transparent);
  display:flex; flex-direction:column; gap:9px;
  opacity:0; pointer-events:none; transition:opacity 1s ease .6s;
}
.bottom-actions.show{ opacity:1; pointer-events:auto; }
.action-btn{
  width:100%; padding:13px;
  border:1px solid #4a3c28; border-radius:4px;
  background:rgba(20,16,9,.9); color:#f5f0e6;
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  font-size:13px; letter-spacing:.15em;
  cursor:pointer; transition:opacity .15s;
}
.action-btn:active{ opacity:.7; }
.action-btn.primary{ border-color:#c8841a; color:#c8841a; }
</style>
</head>
<body>
<div class="phone" id="phone">

  <div class="status-bar">
    <span id="status-time">21:12</span>
    <div style="display:flex;gap:6px;"><span>●●●</span><span>WiFi</span><span>🔋</span></div>
  </div>

  <div class="title-card" id="title-card">
    <div class="title-label">— 二人で、抜け出した —</div>
    <div class="title-main" id="title-main"></div>
    <div class="title-name" id="title-name"></div>
    <div class="title-tap">TAP TO BEGIN</div>
  </div>

  <div class="scene-area" id="scene-area"></div>
  <div class="tap-guide" id="tap-guide">▼ TAP</div>

  <div class="bottom-actions" id="bottom-actions">
    <!-- JSで挿入 -->
  </div>

</div>

<script src="../data/gamedata.js"></script>
<script src="../data/gamestate.js"></script>
<script src="../data/scenes.js"></script>
<script>
// 時計（深夜帯に固定気味の演出でもよいが実時刻を使う）
(function(){
  const d=new Date();
  document.getElementById('status-time').textContent =
    d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
})();

// ── パラメータ解決 ──────────────────────────────────
const q = new URLSearchParams(location.search);
const savedResult = JSON.parse(localStorage.getItem('goukon_result') || '{}');
const heroineId = q.get('h') || String(savedResult.contactId || '');
const fromStatus = q.get('from') === 'status';
const sceneType = q.get('type') || 'nijikai';
const scene = (SCENES[heroineId] || {})[sceneType];

const SCENE_TITLES = { nijikai:'— 二人で、抜け出した —', miss:'— 心残り —' };
document.querySelector('.title-label').textContent = SCENE_TITLES[sceneType] || SCENE_TITLES.nijikai;

const heroine = (typeof HEROINES !== 'undefined')
  ? HEROINES.find(h => String(h.id) === String(heroineId)) : null;

// シーンが無ければ静かに結果へ戻す
if(!scene){ location.replace('result.html'); }

// ── タイトルカード ──────────────────────────────────
document.getElementById('title-main').textContent = scene ? scene.heroineName : '';
document.getElementById('title-name').textContent = heroine ? (heroine.type || '') : '';

// ── 段落送り ────────────────────────────────────────
const area   = document.getElementById('scene-area');
const guide  = document.getElementById('tap-guide');
const titleCard = document.getElementById('title-card');
const actions = document.getElementById('bottom-actions');

const paras = (scene ? scene.paragraphs : []).map(text => {
  const p = document.createElement('p');
  // ブロック内改行は意図的な行替え
  text.split('\n').forEach((line, i) => {
    if(i) p.appendChild(document.createElement('br'));
    p.appendChild(document.createTextNode(line));
  });
  area.appendChild(p);
  return p;
});

let idx = 0;          // 次に見せる段落
let started = false;
let finished = false;

function showNext(){
  if(idx >= paras.length){ finish(); return; }
  const p = paras[idx++];
  p.classList.add('show');
  // 新しい段落の頭が見えるようスクロール
  setTimeout(() => p.scrollIntoView({behavior:'smooth', block:'start'}), 80);
  if(idx >= paras.length) setTimeout(finish, 1200);
}

function finish(){
  if(finished) return;
  finished = true;
  guide.classList.add('hide');

  const end = document.createElement('div');
  end.className = 'scene-end';
  end.textContent = '＊';
  area.appendChild(end);
  requestAnimationFrame(() => end.classList.add('show'));

  if(fromStatus){
    actions.innerHTML = `<button class="action-btn" onclick="location.href='status.html'">ノートに戻る</button>`;
  } else {
    actions.innerHTML = `
      <button class="action-btn primary" onclick="advanceFromNijikai()">次の月へ進む</button>
      <button class="action-btn" onclick="location.href='../index.html'">タイトルに戻る</button>`;
  }
  actions.classList.add('show');
  setTimeout(() => end.scrollIntoView({behavior:'smooth', block:'center'}), 200);
}

// 月を進めるのは result.html と month.html と同じ規則に揃える
function advanceFromNijikai(){
  if(typeof GameState !== 'undefined' && GameState.load && GameState.load()){
    GameState.advanceMonth(1);
    location.href = (GameState.month === 3) ? 'year_ending.html' : 'month.html';
  } else {
    location.href = 'month.html';
  }
}

document.getElementById('phone').addEventListener('click', () => {
  if(finished) return;
  if(!started){
    started = true;
    titleCard.classList.add('hide');
    setTimeout(showNext, 500);
    return;
  }
  showNext();
});
</script>
</body>
</html>
