<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>合コン本番</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/goukon_day.css">
</head>
<body>
<div class="phone">

  <!-- ステータスバー -->
  <div class="vn-status">
    <div class="night-meter calm" id="night-meter" title="夜の残り時間">
      <span class="night-clock" id="night-clock">🕕 18:00</span>
      <span class="night-word" id="night-word">宵の口</span>
    </div>
    <div class="air-wrap">
      <div class="air-label">空気</div>
      <div class="air-track"><div class="air-fill" id="air-fill" style="width:50%"></div></div>
      <div class="air-num" id="air-num">50</div>
    </div>
    <div class="target-chip">狙い: <span id="target-name">—</span></div>
  </div>

  <!-- ステージ（夜の居酒屋・奥行きカード） -->
  <div class="vn-stage" id="vn-stage">
    <div class="obs-hint" id="obs-hint"></div>

    <!-- ヒロインカード×3（位置=席順、距離=自席との席差） -->
    <div class="h-card" id="h-card-0">
      <div class="talk-dots"><span></span><span></span><span></span></div>
      <div class="h-portrait"><img class="vn-img" id="vn-img-0" src="" alt=""></div>
      <div class="h-name"><b id="h-name-0"></b><small id="h-sub-0"></small></div>
    </div>
    <div class="h-card" id="h-card-1">
      <div class="talk-dots"><span></span><span></span><span></span></div>
      <div class="h-portrait"><img class="vn-img" id="vn-img-1" src="" alt=""></div>
      <div class="h-name"><b id="h-name-1"></b><small id="h-sub-1"></small></div>
    </div>
    <div class="h-card" id="h-card-2">
      <div class="talk-dots"><span></span><span></span><span></span></div>
      <div class="h-portrait"><img class="vn-img" id="vn-img-2" src="" alt=""></div>
      <div class="h-name"><b id="h-name-2"></b><small id="h-sub-2"></small></div>
    </div>

    <!-- 卓（台形・夜の木目） -->
    <div class="table-band"><div class="table-face"></div><div class="table-edge"></div></div>

    <!-- 視線レイヤー -->
    <svg class="gaze-svg" id="gaze-svg">
      <defs>
        <marker id="gz-arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#27c0dd"/>
        </marker>
      </defs>
    </svg>

    <!-- 友達（影絵+状態チップ） -->
    <div class="f-sil" id="f-sil-0"><div class="f-head"></div><div class="f-body"></div></div>
    <div class="f-chip" id="f-chip-0"><b></b><small></small></div>
    <div class="f-sil" id="f-sil-1"><div class="f-head"></div><div class="f-body"></div></div>
    <div class="f-chip" id="f-chip-1"><b></b><small></small></div>

    <div class="friend-indicator" id="friend-indicator"></div>
  </div>

  <!-- ターンログ（2026-09-24）。第三者視点の要約はここにだけ出す。
       会話ウィンドウは「その場で起きたこと」だけを喋る -->
  <div class="turn-log" id="turn-log"></div>

  <!-- テキストボックス -->
  <div class="vn-textbox-area" id="vn-textbox-area">
    <div class="vn-namebox" id="vn-name"></div>
    <div class="vn-text" id="vn-text">…</div>
    <div class="tap-indicator" id="tap-indicator">▼ TAP</div>
  </div>

  <!-- 手札パネル（企画書§17 A＝手札制。旧7ボタンは *.bak7btn / archive/ に保存） -->
  <div class="kotodama-panel" id="kotodama-panel">
    <div class="timing-bar" id="timing-bar"></div>
    <div class="kdm-status" id="kdm-status"></div>

    <!-- 「この流れ」メーター（繋がっているほど点が灯る。数値は出さない・§16） -->
    <div class="meter-row">
      <div class="chain-meter" id="chain-meter"></div>
      <div class="deck-stack" id="deck-stack"></div>
    </div>

    <!-- 手札3枚（中身は KotodamaPanel.setHand が描く） -->
    <div class="hand locked" id="hand"></div>

    <!-- 山札に入らない常時手 -->
    <div class="kdm-primary">
      <button class="kdm-main kanshi" id="kdm-kanshi">
        <span class="kdm-main-icon">👁</span><span class="kdm-main-name">静観</span>
      </button>
      <button class="kdm-main pass" id="kdm-pass">
        <span class="kdm-main-icon">🔄</span><span class="kdm-main-name">パス</span>
      </button>
      <button class="kdm-main furu" id="kdm-furu">
        <span class="kdm-main-icon mk-yoso">↗</span><span class="kdm-main-name">話を振る</span><span class="kdm-main-sub"></span>
      </button>
      <!-- 連絡先は札になったので、この枠は「狙いを変える」に使う（2026-09-24）。
           手番は消費しない自由行動。押すたびに次の子へ回る -->
      <button class="kdm-main aim" id="kdm-aim">
        <span class="kdm-main-icon">🎯</span><span class="kdm-main-name">狙い</span><span class="kdm-main-sub"></span>
      </button>
      <button class="kdm-main renraku" id="kdm-renraku" hidden>
        <span class="kdm-main-icon">📱</span><span class="kdm-main-name">連絡先</span>
      </button>
    </div>

    <!-- 「友達に向く」入口ストリップ（中身は FriendPanel が描画） -->
    <div class="friend-strip" id="friend-strip"></div>
  </div>

  <!-- 山場(junction)の型カード（一時オーバーレイ。中身は JunctionUI が描画） -->
  <div class="junction-cards" id="junction-cards"></div>


  <!-- 「友達に向く」オーバーレイ（中身は FriendPanel が描画） -->
  <div class="friend-overlay" id="friend-overlay"></div>

  <!-- ゲームオーバーオーバーレイ -->
  <div class="game-over" id="game-over">
    <div class="go-icon" id="go-icon">🎉</div>
    <div class="go-title" id="go-title">—</div>
    <div class="go-sub"   id="go-sub">—</div>
    <button class="go-btn" id="go-result-btn">結果を見る →</button>
  </div>

</div><!-- /.phone -->

<!-- データ -->
<script src="../data/gamedata.js"></script>
<script src="../data/gamestate.js"></script>
<script src="../data/flags.js"></script>

<!-- コアロジック（DOM不使用） -->
<!-- 演出CSS（2026-09-23）。並列で作るため役割ごとにファイルを分けてある。
     fly=出した札が飛ぶ / deal=配り / chain=流れの点 / fan=扇のゆらぎ -->
<link rel="stylesheet" href="../css/fx-fly.css">
<link rel="stylesheet" href="../css/fx-deal.css">
<link rel="stylesheet" href="../css/fx-chain.css">
<link rel="stylesheet" href="../css/fx-fan.css">
<link rel="stylesheet" href="../css/turn-log.css">
<script src="../js/core/balance.js"></script>
<script src="../js/core/phase.js"></script>
<script src="../js/core/friend-ai.js"></script>
<script src="../js/core/heroine-ai.js"></script>
<script src="../js/core/chain.js"></script>
<script src="../js/core/kotodama.js"></script>
<script src="../js/core/kotodama-vocab.js"></script>
<script src="../js/core/speak-previews.js"></script>
<script src="../js/core/situations.js"></script>
<script src="../js/core/card-topics.js"></script>
<script src="../js/core/thread.js"></script>
<script src="../js/core/deck.js"></script>

<!-- UIモジュール（DOM操作） -->
<script src="../js/ui/stage.js"></script>
<script src="../js/ui/vn-engine.js"></script>
<script src="../js/ui/junction.js"></script>
<script src="../js/ui/kotodama-panel.js"></script>
<script src="../js/ui/friend-panel.js"></script>
<script src="../js/ui/hud.js"></script>

<!-- 司令塔 -->
<script src="../js/goukon-game.js"></script>

<!-- 起動 -->
<script>
  GoukonGame.start();
</script>
</body>
</html>
