<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>1年の終わり — 大学生活攻略録</title>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Shippori+Mincho+B1:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<style>
.ending-hd {
  padding: 40px 24px 0;
  position: relative;
}
.ending-hd::before {
  content: '';
  position: absolute;
  left: 58px; top: 0; bottom: -20px;
  width: 1.5px;
  background: rgba(192,57,43,0.3);
}
.ending-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  color: var(--pencil);
  margin-left: 48px;
  margin-bottom: 8px;
  letter-spacing: .12em;
}
.ending-title {
  font-size: 36px;
  font-weight: 800;
  line-height: 1.1;
  margin-left: 48px;
  letter-spacing: -.02em;
  position: relative;
  display: inline-block;
}
.ending-title::after {
  content: '';
  position: absolute;
  left: -2px; right: -4px; bottom: -5px;
  height: 4px; background: var(--ink); border-radius: 1px;
}

/* ── ENDING TYPE CARD ── */
.ending-card {
  margin: 28px 24px 0;
  border: 2.5px solid var(--ink2);
  border-radius: 14px 10px 14px 10px / 10px 14px 10px 14px;
  padding: 20px 20px 18px;
  background: var(--paper2);
  position: relative;
  box-shadow: 3px 4px 0 rgba(28,26,20,0.12);
}
.ending-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px;
  letter-spacing: .14em;
  color: var(--pencil);
  margin-bottom: 6px;
}
.ending-type-name {
  font-size: 28px;
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 8px;
}
.ending-type-name.type-perfect  { color: var(--ok); }
.ending-type-name.type-allinlove { color: var(--red); }
.ending-type-name.type-friendship { color: var(--blue); }
.ending-type-name.type-bestfriend { color: #6a4a00; }
.ending-type-name.type-solo      { color: var(--pencil); }
.ending-type-name.type-lonely    { color: var(--muted); }
.ending-type-name.type-normal    { color: var(--ink); }

.ending-desc {
  font-family: 'Yomogi', cursive;
  font-size: 13px;
  line-height: 1.8;
  color: var(--ink2);
}

/* ── SCORE TABLE ── */
.score-table {
  margin: 16px 24px 0;
  border: 1.5px solid var(--rule2);
  border-radius: 8px;
  overflow: hidden;
}
.score-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  border-bottom: 1px solid var(--rule);
}
.score-row:last-child { border-bottom: none; }
.score-row:nth-child(even) { background: var(--paper2); }
.score-label {
  font-family: 'Yomogi', cursive;
  font-size: 12px;
  color: var(--pencil);
}
.score-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 500;
}
.score-val.hi { color: var(--ok); }
.score-val.lo { color: var(--red); }

/* ── ACTIONS ── */
.ending-actions {
  padding: 24px 24px 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.end-btn {
  width: 100%;
  padding: 14px 18px;
  border: 2px solid var(--ink2);
  border-radius: 10px 14px 10px 14px / 12px 10px 12px 10px;
  background: var(--paper);
  font-family: 'Shippori Mincho B1', serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 2px 3px 0 rgba(28,26,20,0.1);
  text-align: left;
}
.end-btn:hover { transform: translateY(-1px); box-shadow: 3px 4px 0 rgba(28,26,20,0.16); }
.end-btn:active { transform: scale(.98); }
.end-btn.primary { background: var(--ink); color: var(--paper); }
.end-btn-icon { font-size: 22px; flex-shrink: 0; }
.end-btn-body { flex: 1; }
.end-btn-sub {
  font-family: 'Yomogi', cursive;
  font-size: 10px;
  color: var(--pencil);
  margin-top: 2px;
}
.end-btn.primary .end-btn-sub { color: #9a9080; }

.review-note {
  margin: 16px 24px 0;
  padding: 12px 14px;
  border-left: 3px solid var(--blue);
  background: rgba(44,74,138,0.06);
  border-radius: 0 8px 8px 0;
  font-family: 'Yomogi', cursive;
  font-size: 11px;
  color: var(--ink2);
  line-height: 1.7;
}
</style>
</head>
<body>
<div id="root">
  <div class="ending-hd">
    <div class="ending-eyebrow">2026.03 — 大学2年生 終了</div>
    <div class="ending-title">1年、<br>終わった。</div>
  </div>

  <div class="ending-card" id="ending-card">
    <!-- JSで挿入 -->
  </div>

  <div class="score-table" id="score-table">
    <!-- JSで挿入 -->
  </div>

  <div class="review-note" id="review-note">
    <!-- JSで挿入 -->
  </div>

  <div class="ending-actions">
    <button class="end-btn primary" onclick="newYear()">
      <div class="end-btn-icon">📓</div>
      <div class="end-btn-body">
        <div>もう1年やり直す</div>
        <div class="end-btn-sub">同じキャラで新学期から</div>
      </div>
    </button>
    <button class="end-btn" onclick="location.href='../index.html'">
      <div class="end-btn-icon">🏠</div>
      <div class="end-btn-body">
        <div>タイトルに戻る</div>
        <div class="end-btn-sub">はじめから作り直す</div>
      </div>
    </button>
  </div>
</div>

<script src="../data/gamedata.js"></script>
<script src="../data/gamestate.js"></script>
<script>
// ── エンディング定義 ─────────────────────────────
const ENDINGS = {
  perfect: {
    cssClass: 'type-perfect',
    name: '充実した1年',
    desc: '合コンも友達関係も、全部うまく回った。\n来年の自分がちょっと楽しみになってきた。\nこういう1年、また作れるといいな。',
    review: '連絡先も複数ゲット、友達ともしっかり絆を深めた。\n戦略が機能した1年だった。',
  },
  allInLove: {
    cssClass: 'type-allinlove',
    name: '読み切った1年',
    desc: '狙った相手にすべてを賭けた。\n他は目に入らなかった。\nそれだけ本気だったということだ。',
    review: '一人に集中して高い恋愛値を積み上げた。\n目標が明確だった1年。',
  },
  friendship: {
    cssClass: 'type-friendship',
    name: '仲間との1年',
    desc: '恋愛はうまくいかなかったけど、\n友達とはすごく深い話ができた気がする。\nそれはそれで青春だよな。',
    review: '友達との絆は深まった。恋愛面は次の課題。\nこういう1年もあっていい。',
  },
  bestFriend: {
    cssClass: 'type-bestfriend',
    name: '仲間との1年',
    desc: '気づいたら男同士でやたらと仲良くなってた。\n友達の家に転がり込んで朝まで話した夜もあった。\nこれはこれで大事なものだ。',
    review: '親密な友達が複数できた充実した1年。\n恋愛は後回しにしても後悔していない。',
  },
  solo: {
    cssClass: 'type-solo',
    name: '空回りした1年',
    desc: '何回行っても連絡先が取れなかった。\n戦略が間違ってたのか、運が悪かっただけなのか。\nまた来年やり直せる。',
    review: '合コンには積極的だったが結果が出なかった。\n次は何を変える？',
  },
  lonely: {
    cssClass: 'type-lonely',
    name: 'やらかした1年',
    desc: '気づいたら何もかも中途半端になってた。\nまあ、こういう年もある。\n来年の教訓にしよう。',
    review: '恋愛も友達関係も積み上がらなかった。\n今年の経験が来年の糧になる。',
  },
  normal: {
    cssClass: 'type-normal',
    name: 'ふつうの1年',
    desc: '良くも悪くもない1年だった。\n何かが突き抜けることもなく、\n大きな失敗もなかった。',
    review: 'バランスよく、でも特筆すべきことはなかった。\n何かに賭けてみる1年があってもいい。',
  },
};

// ── 処理 ─────────────────────────────────────
GameState.load();

const endingKey = GameState.getEnding();
const ending    = ENDINGS[endingKey] || ENDINGS.normal;
const score     = GameState.calcEndingScore();

// エンディングカード
const card = document.getElementById('ending-card');
card.innerHTML = `
  <div class="ending-badge">YEAR ENDING — ${endingKey.toUpperCase()}</div>
  <div class="ending-type-name ${ending.cssClass}">${ending.name}</div>
  <div class="ending-desc">${ending.desc.replace(/\n/g, '<br>')}</div>`;

// スコアテーブル
const table = document.getElementById('score-table');
const contactCt = Object.values(GameState._data?.heroineRelation || {}).filter(r => r.contact).length;
const friendAvg  = Math.round(score.friendAvg || 0);
const rows = [
  { label: '合コン参加回数',   val: `${score.goukonCount}回`,  cls: score.goukonCount >= 3 ? 'hi' : '' },
  { label: '連絡先獲得',       val: `${contactCt}人`,           cls: contactCt >= 2 ? 'hi' : contactCt === 0 ? 'lo' : '' },
  { label: '最高恋愛値',       val: `${score.topRomance}pt`,   cls: score.topRomance >= 60 ? 'hi' : score.topRomance < 20 ? 'lo' : '' },
  { label: '友達との絆（平均）', val: `${friendAvg}pt`,          cls: friendAvg >= 50 ? 'hi' : friendAvg < 20 ? 'lo' : '' },
  { label: '最終残高',         val: `¥${GameState.money.toLocaleString()}`, cls: GameState.money < 3000 ? 'lo' : '' },
];
rows.forEach(r => {
  const div = document.createElement('div');
  div.className = 'score-row';
  div.innerHTML = `<div class="score-label">${r.label}</div><div class="score-val ${r.cls}">${r.val}</div>`;
  table.appendChild(div);
});

// レビューノート
document.getElementById('review-note').textContent = ending.review;

// ── 翌年スタート ─────────────────────────────────
function newYear() {
  // 月を4月に戻す（年は+1）、友達関係はリセットしない
  if(GameState._data) {
    GameState._data.month = 4;
    GameState._data.year  = (GameState._data.year || 1) + 1;
    GameState._data.goukonCount = 0;
    // advanceMonth を通らないので学期リセット(gamestate.js)が走らない。
    // used を戻さないと2年目に「学期2回」制限の友達が呼べず、候補2人時に編成不能になる
    Object.values(GameState._data.friendRelation || {}).forEach(r => { r.used = 0; });
    // 恋愛値はリセット（連絡先は維持）
    Object.keys(GameState._data.heroineRelation || {}).forEach(id => {
      GameState._data.heroineRelation[id].romance  = 0;
      GameState._data.heroineRelation[id].intimacy = Math.floor((GameState._data.heroineRelation[id].intimacy || 0) / 2);
    });
    GameState.save();
  }
  location.href = 'month.html';
}
</script>
</body>
</html>
