<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>月初め — 大学生活攻略録</title>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Shippori+Mincho+B1:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<style>
.month-hd {
  padding: 32px 24px 0;
  position: relative;
}
.month-hd::before {
  content: '';
  position: absolute;
  left: 58px; top: 0; bottom: -20px;
  width: 1.5px;
  background: rgba(192,57,43,0.3);
}
.month-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  color: var(--pencil);
  margin-left: 48px;
  margin-bottom: 6px;
  letter-spacing: .12em;
}
.month-title {
  font-size: 44px;
  font-weight: 800;
  line-height: 1;
  margin-left: 48px;
  letter-spacing: -.02em;
  position: relative;
  display: inline-block;
}
.month-title::after {
  content: '';
  position: absolute;
  left: -2px; right: -4px; bottom: -5px;
  height: 4px; background: var(--ink); border-radius: 1px;
}
.month-sub {
  font-family: 'Yomogi', cursive;
  font-size: 11px;
  color: var(--pencil);
  margin: 18px 0 0 48px;
}

/* ── STATUS BOARD ── */
.status-board {
  margin: 24px 24px 0 24px;
  border: 2px solid var(--ink2);
  border-radius: 10px 14px 10px 14px / 12px 10px 12px 10px;
  padding: 14px 16px;
  background: var(--paper2);
  position: relative;
}
.status-board::before {
  content: 'STATUS';
  position: absolute;
  top: -8px; left: 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px;
  color: var(--pencil);
  background: var(--paper2);
  padding: 0 4px;
  letter-spacing: .1em;
}
.stat-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 4px 0;
  border-bottom: 1px solid var(--rule);
}
.stat-row:last-child { border-bottom: none; }
.stat-label {
  font-family: 'Yomogi', cursive;
  font-size: 12px;
  color: var(--pencil);
  min-width: 60px;
}
.stat-val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}
.stat-val.money { color: var(--ok); }
.stat-val.warn  { color: var(--red); }

/* ── EVENT NOTICE ── */
.event-notice {
  margin: 16px 24px 0;
  padding: 12px 14px;
  border-left: 3px solid var(--red);
  background: var(--red-t);
  border-radius: 0 8px 8px 0;
}
.event-notice-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px;
  color: var(--red);
  letter-spacing: .12em;
  margin-bottom: 4px;
}
.event-notice-text {
  font-family: 'Yomogi', cursive;
  font-size: 13px;
  color: var(--ink);
  line-height: 1.6;
}
.event-notice.daily {
  border-left-color: var(--blue);
  background: rgba(44,74,138,0.06);
}
.event-notice.daily .event-notice-label { color: var(--blue); }

/* ── ACTION SECTION ── */
.actions-wrap {
  padding: 20px 24px 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.action-sec-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px;
  color: var(--pencil);
  letter-spacing: .12em;
  margin-bottom: 4px;
}
.action-btn {
  background: var(--paper);
  border: 2px solid var(--ink2);
  border-radius: 10px 14px 10px 14px / 12px 10px 12px 10px;
  padding: 14px 18px;
  cursor: pointer;
  transition: all .15s;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 2px 3px 0 rgba(28,26,20,0.1);
}
.action-btn:hover { transform: translateY(-1px); box-shadow: 3px 4px 0 rgba(28,26,20,0.16); }
.action-btn:active { transform: scale(.98); }
.action-btn.primary { background: var(--ink); }
.action-btn.primary .btn-title { color: var(--paper); }
.action-btn.primary .btn-desc  { color: #9a9080; }
.action-btn.primary .btn-arrow { color: var(--paper); opacity: .6; }
.action-btn:disabled { opacity: .4; cursor: default; pointer-events: none; }
.btn-icon  { font-size: 22px; flex-shrink: 0; }
.btn-body  { flex: 1; }
.btn-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.btn-desc  {
  font-family: 'Yomogi', cursive;
  font-size: 10px;
  color: var(--pencil);
  line-height: 1.4;
}
.btn-arrow { font-size: 16px; color: var(--muted); }

/* ── DAILY ACTIONS ── */
.daily-actions {
  margin: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.daily-action-btn {
  background: var(--paper2);
  border: 1.5px solid var(--rule2);
  border-radius: 8px;
  padding: 12px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all .15s;
}
.daily-action-btn:hover { background: var(--paper3); }
.daily-action-btn:active { transform: scale(.98); }
.da-icon  { font-size: 18px; flex-shrink: 0; }
.da-body  { flex: 1; }
.da-title { font-size: 13px; font-weight: 700; }
.da-desc  { font-family: 'Yomogi', cursive; font-size: 9px; color: var(--pencil); }
.da-result { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ok); margin-top: 2px; display: none; }
.da-result.show { display: block; }

.skip-btn {
  margin: 16px 24px;
  width: calc(100% - 48px);
  padding: 11px;
  background: none;
  border: 1.5px solid var(--rule2);
  border-radius: 8px;
  font-family: 'Yomogi', cursive;
  font-size: 12px;
  color: var(--pencil);
  cursor: pointer;
  transition: all .12s;
}
.skip-btn:hover { background: var(--paper2); color: var(--ink); }
</style>
</head>
<body>
<div id="root">
  <div class="month-hd">
    <div class="month-eyebrow" id="month-eyebrow">2026.04 — 大学2年生スタート</div>
    <div class="month-title" id="month-title">4月</div>
    <div class="month-sub" id="month-sub">新学期。新しい出会いの季節。</div>
  </div>

  <div class="status-board">
    <div class="stat-row">
      <div class="stat-label">手持ち</div>
      <div class="stat-val money" id="stat-money">¥30,000</div>
    </div>
    <div class="stat-row">
      <div class="stat-label">合コン</div>
      <div class="stat-val" id="stat-goukon">今年 0回</div>
    </div>
    <div class="stat-row">
      <div class="stat-label">連絡先</div>
      <div class="stat-val" id="stat-contacts">0人</div>
    </div>
  </div>

  <div id="event-area">
    <!-- イベント告知（JSで挿入） -->
  </div>

  <div class="actions-wrap" id="actions-wrap">
    <!-- ボタン群（JSで構築） -->
  </div>
</div>

<script src="../data/gamedata.js"></script>
<script src="../data/gamestate.js"></script>
<script>
// ── 月別テキスト ──────────────────────────────────
const MONTH_FLAVOR = {
  4:  { sub:'新学期。新しい出会いの季節。', eyebrow:'新歓シーズン — 春の始まり' },
  5:  { sub:'GW明け。そろそろ動き出す時期。', eyebrow:'5月 — 合コンの季節①' },
  6:  { sub:'梅雨。じっとりと長い6月。', eyebrow:'6月 — 梅雨' },
  7:  { sub:'前期テスト直前。息抜きが必要。', eyebrow:'7月 — テスト直前 / 合コン②' },
  8:  { sub:'夏休み。一番長い自由な時間。', eyebrow:'8月 — 夏休み' },
  9:  { sub:'後期始まり。夏を経て少し変わった。', eyebrow:'9月 — 後期スタート' },
  10: { sub:'中間ごろ。夏を経て関係値が変わる。', eyebrow:'10月 — 合コンの季節③' },
  11: { sub:'学祭シーズン。キャンパスが騒がしい。', eyebrow:'11月 — 学祭' },
  12: { sub:'年末。忙しい季節。', eyebrow:'12月 — 年末' },
  1:  { sub:'新年。後期テスト目前。', eyebrow:'1月 — 後期テスト' },
  2:  { sub:'テスト明け。春休みが見えてきた。', eyebrow:'2月 — 合コンの季節④' },
  3:  { sub:'春休み。この1年の締め括り。', eyebrow:'3月 — 追いコン / 1年の締め' },
};

// 合コン月
const GOUKON_MONTHS = [5, 7, 10, 2];

// ── 日常アクション定義 ─────────────────────────────
const DAILY_ACTIONS = [
  {
    id: 'study',
    icon: '📚',
    title: '勉強する',
    desc: '図書館で課題を片付ける。「単位の話」を覚える。',
    learns: '単位の話',
    effect: (gs) => { gs.addMoney(0); return '+メンタル'; },  // 簡略: テキスト結果のみ
    resultText: 'メンタルが少し上がった',
  },
  {
    id: 'gym',
    icon: '🏃',
    title: 'ジムに行く',
    desc: 'ランニング・筋トレ。「体づくりの話」を覚える。',
    learns: '体づくりの話',
    resultText: '体を動かしてすっきりした',
  },
  {
    id: 'friend_hangout',
    icon: '🍺',
    title: '友達と飲む',
    desc: '気の合う仲間と近況報告。「飲みの失敗談」を覚える。¥2,000くらい。',
    learns: '飲みの失敗談',
    cost: 2000,
    resultText: '友達との時間を過ごした',
  },
];

// ── イベント告知テキスト ──────────────────────────
const MONTH_EVENTS = {
  5:  { label: '今月の予定', text: '今月は合コンがある。\n5月は新歓が落ち着いて最初の機会だ。', type: 'goukon' },
  7:  { label: '今月の予定', text: '今月は合コンがある。\n前期テスト直前の息抜き合コン。', type: 'goukon' },
  10: { label: '今月の予定', text: '今月は合コンがある。\n夏を経て関係値が変化した後期最初の機会。', type: 'goukon' },
  2:  { label: '今月の予定', text: '今月は合コンがある。\nテスト明け・春休み前。1年の締めくくり。', type: 'goukon' },
  1:  { label: '注意', text: '後期テスト期間。\n気を抜かないように。', type: 'warn' },
  7:  { label: '注意/予定', text: '前期テスト直前 + 合コンがある月。\n時間を上手く使おう。', type: 'goukon' },
  8:  { label: '今月', text: '夏休み。バイトのシフトが多い。お金は稼げるが疲れる。', type: 'daily' },
  11: { label: '学祭', text: 'キャンパスが賑やかになる。学祭ライブや屋台で盛り上がる。', type: 'daily' },
  12: { label: '年末', text: '忘年会シーズン。居酒屋バイトが激務になる。', type: 'daily' },
  3:  { label: '3月', text: '追いコンシーズン。1年間の締め括り。', type: 'daily' },
};

// ── メイン処理 ──────────────────────────────────
GameState.load();

const month  = GameState.month;
const year   = GameState.year;
const money  = GameState.money;
const flavor = MONTH_FLAVOR[month] || { sub: '', eyebrow: '' };

// ヘッダー
document.getElementById('month-eyebrow').textContent = flavor.eyebrow;
document.getElementById('month-title').textContent   = `${month}月`;
document.getElementById('month-sub').textContent     = flavor.sub;

// ステータスボード
document.getElementById('stat-money').textContent   = `¥${money.toLocaleString()}`;
document.getElementById('stat-goukon').textContent  = `今年 ${GameState.goukonCount}回`;
const contactCount = Object.values(GameState._data?.heroineRelation || {}).filter(r => r.contact).length;
document.getElementById('stat-contacts').textContent = `${contactCount}人`;
if(money < 5000) document.getElementById('stat-money').classList.add('warn');

// イベント告知
const evArea = document.getElementById('event-area');
const isGoukonMonth = GOUKON_MONTHS.includes(month);
if(isGoukonMonth) {
  const div = document.createElement('div');
  div.className = 'event-notice';
  div.innerHTML = `<div class="event-notice-label">今月の予定</div>
    <div class="event-notice-text">今月は合コンがある。<br>${getGoukonDesc(month)}</div>`;
  evArea.appendChild(div);
} else {
  const ev = MONTH_EVENTS[month];
  if(ev && ev.type === 'daily') {
    const div = document.createElement('div');
    div.className = 'event-notice daily';
    div.innerHTML = `<div class="event-notice-label">${ev.label}</div>
      <div class="event-notice-text">${ev.text}</div>`;
    evArea.appendChild(div);
  }
}

function getGoukonDesc(m) {
  if(m===5)  return '新歓が落ち着いて最初の機会だ。';
  if(m===7)  return '前期テスト直前の息抜き合コン。';
  if(m===10) return '夏を経て関係値が変化した後期最初の機会。';
  if(m===2)  return 'テスト明け・春休み前。1年の締めくくり。';
  return '';
}

// ── アクション構築 ──────────────────────────────
const wrap = document.getElementById('actions-wrap');

if(isGoukonMonth) {
  // 合コン月: メインアクション = 合コン参加
  const label = document.createElement('div');
  label.className = 'action-sec-label';
  label.textContent = 'MAIN EVENT';
  wrap.appendChild(label);

  const btn = document.createElement('button');
  btn.className = 'action-btn primary';
  btn.innerHTML = `
    <div class="btn-icon">🍻</div>
    <div class="btn-body">
      <div class="btn-title">合コンに参加する</div>
      <div class="btn-desc">今月の合コンへ。布陣を選んで挑め。</div>
    </div>
    <div class="btn-arrow">→</div>`;
  btn.onclick = () => { location.href = 'formation.html'; };
  wrap.appendChild(btn);
}

// 自分の持ちネタ（合コンで出せる札）を確認する
{
  const dk = document.createElement('button');
  dk.className = 'action-btn';
  dk.innerHTML = `
    <div class="btn-icon">🃏</div>
    <div class="btn-body">
      <div class="btn-title">持ちネタを見る</div>
      <div class="btn-desc">合コンで出せる札。住まい・サークル・バイトで決まる。</div>
    </div>
    <div class="btn-arrow">→</div>`;
  dk.onclick = () => { location.href = 'deck.html'; };
  wrap.appendChild(dk);
}

// 日常アクション（3月以外の全月で1〜2アクション実行できる）
if(month !== 3) {
  const dailyLabel = document.createElement('div');
  dailyLabel.className = 'action-sec-label';
  dailyLabel.style.marginTop = isGoukonMonth ? '12px' : '0';
  dailyLabel.textContent = '日常アクション（1つ選ぶ）';
  wrap.appendChild(dailyLabel);

  const dailyWrap = document.createElement('div');
  dailyWrap.className = 'daily-actions';
  wrap.appendChild(dailyWrap);

  let actionDone = false;
  DAILY_ACTIONS.forEach(act => {
    const btn = document.createElement('button');
    btn.className = 'daily-action-btn';
    btn.dataset.id = act.id;
    btn.innerHTML = `
      <div class="da-icon">${act.icon}</div>
      <div class="da-body">
        <div class="da-title">${act.title}</div>
        <div class="da-desc">${act.desc}</div>
        <div class="da-result" id="da-result-${act.id}"></div>
      </div>`;
    btn.onclick = () => {
      if(actionDone) return;
      actionDone = true;
      // 金銭消費
      if(act.cost) GameState.addMoney(-act.cost);
      // 覚えた札をデッキに恒久追加（合コンで出せるネタが増える）
      let learnedNow = false;
      if (act.learns) {
        const key = 'goukon_learned';
        const have = JSON.parse(localStorage.getItem(key) || '[]');
        if (have.indexOf(act.id) < 0) {
          have.push(act.id);
          localStorage.setItem(key, JSON.stringify(have));
          learnedNow = true;
        }
      }
      // 結果表示
      const res = document.getElementById(`da-result-${act.id}`);
      res.textContent = learnedNow
        ? `${act.resultText}　🃏 話題「${act.learns}」を取得`
        : act.resultText;
      res.classList.add('show');
      btn.style.background = 'var(--paper3)';
      // 他ボタンを薄く
      dailyWrap.querySelectorAll('.daily-action-btn').forEach(b => {
        if(b !== btn) { b.style.opacity = '.4'; b.style.pointerEvents = 'none'; }
      });
      // 「次の月へ」ボタンを有効化
      document.getElementById('next-month-btn').disabled = false;
    };
    dailyWrap.appendChild(btn);
  });
}

// ── 次の月へ ボタン ─────────────────────────────
const skipBtn = document.createElement('button');
skipBtn.className = 'skip-btn';
skipBtn.id = 'next-month-btn';
if(month === 3) {
  // 3月: エンディングへのボタンは常に有効
  skipBtn.textContent = '→ 1年の締め括りへ';
  skipBtn.disabled = false;
} else if(isGoukonMonth) {
  // 合コン月: 合コンせずにスキップもOK（常に有効）
  skipBtn.textContent = '→ 合コンせずに次の月へ';
  skipBtn.disabled = false;
} else {
  // 日常月: 日常アクション完了後に有効化
  skipBtn.textContent = '→ 次の月へ進む';
  skipBtn.disabled = true;
}
skipBtn.onclick = advanceToNextMonth;
wrap.appendChild(skipBtn);

function advanceToNextMonth() {
  if(month === 3) {
    // 3月 = 年エンディングへ
    location.href = 'year_ending.html';
    return;
  }
  GameState.advanceMonth(1);
  location.href = 'month.html';
}
</script>
</body>
</html>
