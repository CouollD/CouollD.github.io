<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>合コン結果</title>
<link rel="stylesheet" href="../css/app.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#e6e5ea;}

.phone{
  max-width:390px; min-height:100dvh; margin:0 auto;
  background:var(--page);
  display:flex; flex-direction:column; overflow:hidden;
}

/* STATUS BAR */
.status-bar{
  background:var(--board); color:var(--ink); border-bottom:1px solid var(--line);
  padding:10px 20px 6px;
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--font); font-size:11px;
  flex-shrink:0;
}

/* CHAT HEADER */
.chat-header{
  background:var(--board); color:var(--ink);
  padding:10px 16px 10px;
  display:flex; align-items:center; gap:10px;
  flex-shrink:0; border-bottom:1px solid rgba(255,255,255,.08);
}
.chat-header-back{
  font-size:18px; color:var(--pink); background:none; border:none; cursor:pointer;
  padding:2px 4px; flex-shrink:0;
}
.chat-header-icon{
  width:36px; height:36px; border-radius:50%;
  background:var(--cyan-soft); border:2px solid var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
}
.chat-header-info{ flex:1; min-width:0; }
.chat-header-name{
  font-family:var(--font); font-size:14px; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.chat-header-sub{
  font-family:var(--font); font-size:9px; color:var(--ink2);
}

/* CHAT SCROLL */
.chat-area{
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:12px 12px 8px;
  display:flex; flex-direction:column; gap:4px;
}

/* DATE DIVIDER */
.date-divider{
  text-align:center; margin:8px 0;
  font-family:var(--font); font-size:9px;
  color:#8a8070; position:relative;
}
.date-divider::before,.date-divider::after{
  content:''; position:absolute; top:50%;
  width:30%; height:1px; background:rgba(0,0,0,.12);
}
.date-divider::before{ left:4%; }
.date-divider::after{ right:4%; }

/* SECTION LABEL (1:1 chat switch) */
.section-switch{
  background:rgba(0,0,0,.08); border-radius:12px;
  text-align:center; padding:6px 14px; margin:10px auto;
  font-family:var(--font); font-size:10px; color:#6a6050;
  max-width:200px;
}

/* CHAT BUBBLE ROW */
.bubble-row{
  display:flex; gap:8px; align-items:flex-end;
  max-width:82%; margin-bottom:2px;
}
.bubble-row.self{
  flex-direction:row-reverse; margin-left:auto;
}

.avatar{
  width:34px; height:34px; border-radius:50%;
  background:var(--pink-soft);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; flex-shrink:0;
  border:2px solid var(--ink);
  overflow:hidden;
}
.avatar img, .chat-header-icon img{
  width:100%; height:100%; object-fit:cover; border-radius:50%;
}

/* 退出通知（Eエンディング） */
.leave-notice{
  text-align:center; margin:5px 0;
  font-family:var(--font); font-size:10px;
  color:#b0483a; opacity:.85;
}

.bubble-wrap{ display:flex; flex-direction:column; gap:2px; }
.bubble-name{
  font-family:var(--font); font-size:9px; color:#6a6050;
  padding-left:2px;
}

.bubble{
  background:#fff;
  border-radius:4px 14px 14px 14px;
  padding:9px 12px;
  font-family:var(--font); font-size:13px;
  color:#1c1a14; line-height:1.65;
  border:2px solid var(--ink); box-shadow:var(--shadow);
  position:relative; max-width:240px;
  word-break:break-all;
}
.bubble-row.self .bubble{
  background:var(--pink); color:#fff;
  border-radius:14px 4px 14px 14px;
}

.bubble-time{
  font-family:var(--font); font-size:8px;
  color:#8a8070; align-self:flex-end; flex-shrink:0;
  padding-bottom:2px;
}

/* スタンプ/リアクション */
.stamp-bubble{
  font-size:32px; padding:4px 6px;
  background:transparent; box-shadow:none; border:none;
}

/* 長文メッセ（連絡先交換後） */
.bubble.long{
  font-size:12px; line-height:1.8;
  max-width:260px;
}

/* BOTTOM ACTIONS */
.bottom-actions{
  flex-shrink:0;
  padding:12px 16px 20px;
  background:var(--board);
  border-top:1px solid rgba(0,0,0,.1);
  display:flex; flex-direction:column; gap:8px;
}
.action-btn{
  width:100%; padding:13px;
  border:none; border-radius:10px;
  font-family:var(--font); font-size:14px; font-weight:700;
  cursor:pointer; transition:opacity .15s;
}
.action-btn:active{ opacity:.8; }
.action-btn.primary{ background:var(--ink); color:#fff; }
.action-btn.secondary{ background:#fff; color:#2a2418; border:1.5px solid rgba(0,0,0,.15); }
</style>
</head>
<body>
<div class="phone">

  <div class="status-bar">
    <span id="status-time">9:41</span>
    <div style="display:flex;gap:6px;"><span>●●●</span><span>WiFi</span><span>🔋</span></div>
  </div>

  <div class="chat-header" id="chat-header">
    <button class="chat-header-back" onclick="history.back()">‹</button>
    <div class="chat-header-icon" id="header-icon">🍻</div>
    <div class="chat-header-info">
      <div class="chat-header-name" id="header-name">今夜の合コン</div>
      <div class="chat-header-sub" id="header-sub">グループ</div>
    </div>
  </div>

  <div class="chat-area" id="chat-area">
    <!-- JS で挿入 -->
  </div>

  <div class="bottom-actions">
    <button class="action-btn primary" id="next-btn">📅 次の月へ</button>
    <button class="action-btn secondary" onclick="location.href='../index.html'">📓 タイトルに戻る</button>
  </div>

</div>

<script src="../data/gamedata.js"></script>
<script src="../data/gamestate.js"></script>
<script src="../data/flags.js"></script>
<script src="../data/scenes.js"></script>
<script>
// 時計
(function(){
  const d=new Date();
  document.getElementById('status-time').textContent =
    d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
})();

// データ読み込み
GameState.load();
const savedResult    = JSON.parse(localStorage.getItem('goukon_result') || '{}');
const heroineStatus  = savedResult.heroineStatus  || {};
const contactId      = savedResult.contactId      || null;
const ending         = savedResult.ending         || 'D';
const finalAir       = savedResult.finalAir       || 0;
const heroineIds     = JSON.parse(localStorage.getItem('goukon_heroines') || '[]');
const partyIds       = JSON.parse(localStorage.getItem('goukon_party')    || '[]');

const heroines = heroineIds.map(id => HEROINES.find(h=>h.id===id)).filter(Boolean);
const friends  = partyIds.map(id => CHARACTERS.find(c=>c.id===id)).filter(Boolean);

function sn(name){ const p=name.split(' '); return p[1]||p[0]||name; }
function fmt(h){ const m=Math.floor(Math.random()*3+22); return `22:${String(m).padStart(2,'0')}`; }

// ── チャット構築 ──────────────────────────────────────────
const area = document.getElementById('chat-area');

// GameState 更新
const heroineResults = {};
heroineIds.forEach(id=>{
  const s=heroineStatus[id];
  heroineResults[id]={ heartGained:(s?.heart||0)-(s?.heartPrev||0), contact:id===contactId };
});
// 同じ結果は一度だけ適用（リロード/ブラウザ戻るでの二重加算ガード）
if(!savedResult.consumed){
  GameState.finishGoukon(heroineResults, partyIds);
  savedResult.consumed = true;
  localStorage.setItem('goukon_result', JSON.stringify(savedResult));
}

// ── シーン解錠判定（reward-structure.md）──
// nijikai: 勝った相手 かつ heart>=50 / miss: 勝てなかったが heart>=60 の心残り
const unlockedScenes = JSON.parse(localStorage.getItem('goukon_scenes') || '{}');
let nijikaiUnlocked = false;
const newMissIds = [];
heroineIds.forEach(id=>{
  const heart = heroineStatus[id]?.heart || 0;
  const list = unlockedScenes[id] || (unlockedScenes[id] = []);
  if(id===contactId && heart>=50 && !list.includes('nijikai')){
    list.push('nijikai');
  }
  if(id!==contactId && heart>=60 && !list.includes('miss')){
    list.push('miss');
    newMissIds.push(id);
  }
});
// 本気モード: 獲られた狙いの子（エンディングF）も心残り＝miss を解錠する
// （既存の miss 解錠ルールに「獲られ」を含める。目の前で連れて行かれた＝最大の心残り）
const stolenHeroineId = savedResult.stolenHeroineId ?? null;
if(stolenHeroineId!=null){
  const list = unlockedScenes[stolenHeroineId] || (unlockedScenes[stolenHeroineId]=[]);
  if(!list.includes('miss')){
    list.push('miss');
    if(!newMissIds.includes(stolenHeroineId)) newMissIds.push(stolenHeroineId);
  }
}

nijikaiUnlocked = contactId && (unlockedScenes[contactId]||[]).includes('nijikai')
  && SCENES[String(contactId)]?.nijikai;
localStorage.setItem('goukon_scenes', JSON.stringify(unlockedScenes));

// 解錠時は主導線を抜け出しへ切り替える（体験の弧: 渦→抽出→報酬）
if(nijikaiUnlocked){
  const bar = document.querySelector('.bottom-actions');
  const oldPrimary = bar.querySelector('.action-btn.primary');
  if(oldPrimary){ oldPrimary.classList.remove('primary'); oldPrimary.classList.add('secondary'); }
  const btn = document.createElement('button');
  btn.className = 'action-btn primary';
  btn.textContent = '🌙 二人で抜け出す…';
  btn.onclick = () => location.href = 'nijikai.html?h=' + contactId;
  bar.prepend(btn);
}

// ── バブル作成ヘルパー ──
function addDivider(text){
  const el=document.createElement('div');
  el.className='date-divider';
  el.textContent=text;
  area.appendChild(el);
}
function addSection(text){
  const el=document.createElement('div');
  el.className='section-switch';
  el.textContent=text;
  area.appendChild(el);
}

// アイコン画像: assets/avatars/<キャラid>.png を置けば差し替わる（無ければ絵文字のまま）
function avatarHTML(id, emoji='👤'){
  if(!id) return emoji;
  return `<img src="../assets/avatars/${id}.png" alt="" onerror="this.replaceWith('${emoji}')">`;
}

function addBubble({id=null, name, emoji='👤', text, time='', stamp=false, long=false}){
  const row=document.createElement('div');
  row.className='bubble-row';
  row.innerHTML=`
    <div class="avatar">${avatarHTML(id, emoji)}</div>
    <div class="bubble-wrap">
      <div class="bubble-name">${name}</div>
      <div class="bubble${stamp?' stamp-bubble':''}${long?' long':''}">${text}</div>
    </div>
    <div class="bubble-time">${time}</div>`;
  area.appendChild(row);
}

// ── グループチャットメッセージ ──
addDivider('今夜の合コン・グループ');

// 本気モード: 獲られた狙いの子の退場を1行で示す（Fエンディング）
if(ending==='F' && stolenHeroineId!=null){
  const sh = HEROINES.find(x=>x.id===stolenHeroineId);
  if(sh){
    const el=document.createElement('div');
    el.className='leave-notice';
    el.textContent=`💔 ${sn(sh.name)} は先に抜けた（ライバルに連れて行かれた）`;
    area.appendChild(el);
  }
}

const ENDING_MSGS = {
  A:[
    { who:'h0', text:'今夜ほんとに楽しかった！！また絶対行きたい😭', stamp:false },
    { who:'h1', text:'……たのしかったです（小声）', stamp:false },
    { who:'h2', text:'えーーー！もっといたかったーー！', stamp:false },
    { who:'f0', text:'俺もめちゃ楽しかった！布陣完璧だったな', stamp:false },
    { who:'f1', text:'お疲れ〜！最高の夜だったわ', stamp:false },
    { who:'h0', text:'❤️', stamp:true },
  ],
  B:[
    { who:'h0', text:'今日楽しかったです〜また機会あれば！', stamp:false },
    { who:'f0', text:'お疲れ！いい感じだったな', stamp:false },
    { who:'h1', text:'楽しかった！今日のメンバー好きだな', stamp:false },
    { who:'f1', text:'次もこのメンツで行こうぜ', stamp:false },
    { who:'h2', text:'😊', stamp:true },
  ],
  C:[
    { who:'h0', text:'今日はお疲れ様でした！楽しかったです', stamp:false },
    { who:'f0', text:'お疲れ〜！どうだった？', stamp:false },
    { who:'f1', text:'まあまあよかったんじゃない？', stamp:false },
    { who:'h1', text:'楽しかったですよ〜', stamp:false },
    { who:'h2', text:'👋', stamp:true },
  ],
  D:[
    { who:'h0', text:'今日はお疲れさまでした', stamp:false },
    { who:'f0', text:'お疲れ〜', stamp:false },
    { who:'h1', text:'ありがとうございました', stamp:false },
    { who:'h2', text:'🙏', stamp:true },
    { who:'f1', text:'次頑張ろ', stamp:false },
  ],
  E:[
    { who:'h0', leave:true },
    { who:'h1', leave:true },
    { who:'h2', leave:true },
    { who:'f0', text:'……まあ、飲み直すか', stamp:false },
    { who:'f1', text:'おつ…', stamp:false },
  ],
  // 本気モード: 狙いの子をライバルに獲られた
  F:[
    { who:'f0', text:'あーあ…目の前で持ってかれたな', stamp:false },
    { who:'f1', text:'切り替えてこ。次があるって', stamp:false },
    { who:'h1', text:'今日はありがとうございました〜', stamp:false },
    { who:'h2', text:'🙏', stamp:true },
  ],
};

function resolve(who){
  if(who.startsWith('h')){
    const idx=parseInt(who[1]);
    return heroines[idx] ? { id:heroines[idx].id, name:sn(heroines[idx].name), emoji:heroines[idx].emoji||'👩' } : null;
  } else {
    const idx=parseInt(who[1]);
    return friends[idx] ? { id:friends[idx].id, name:sn(friends[idx].name), emoji:friends[idx].emoji||'👦' } : null;
  }
}

let baseMin=22;
const msgs=ENDING_MSGS[ending]||ENDING_MSGS['D'];
msgs.forEach((m,i)=>{
  const src=resolve(m.who);
  if(!src) return;
  if(m.leave){
    const el=document.createElement('div');
    el.className='leave-notice';
    el.textContent=`⚠ ${src.name} が退出しました`;
    area.appendChild(el);
    return;
  }
  const min=baseMin+i;
  addBubble({ id:src.id, name:src.name, emoji:src.emoji, text:m.text, time:`${Math.floor(min/60)||22}:${String(min%60).padStart(2,'0')}`, stamp:m.stamp });
});

// 友達解放チェック
const newFriends = GameState.checkFriendDiscovery?.() || [];
if(newFriends.length){
  newFriends.forEach(({introduced, introducedBy, reason})=>{
    const el=document.createElement('div');
    el.className='section-switch';
    el.style.maxWidth='280px';
    el.textContent=`🤝 ${introduced.name} が友達になった（${introducedBy.name} の紹介）`;
    area.appendChild(el);
  });
}

// 心残り通知（連絡先は取れなかったが好感度の高かった子）
newMissIds.forEach(id=>{
  const h = HEROINES.find(x=>x.id===id);
  if(!h) return;
  const el=document.createElement('div');
  el.className='section-switch';
  el.style.maxWidth='280px';
  el.style.cursor='pointer';
  el.textContent=`📮 ${sn(h.name)} との心残りが残った（タップで記録を見る）`;
  el.onclick=()=>{ location.href='status.html'; };
  area.appendChild(el);
});

// ── 個別チャット（連絡先交換時）──
if(contactId){
  const ch = HEROINES.find(h=>h.id===contactId);
  if(ch){
    addSection(`📱 ${sn(ch.name)} との個別トーク`);
    document.getElementById('header-icon').innerHTML = avatarHTML(ch.id, ch.emoji||'👩');
    document.getElementById('header-name').textContent = sn(ch.name);
    document.getElementById('header-sub').textContent  = ch.type||'';

    const longMsg = ch.result_lines?.contact ||
      `「今日楽しかったです！また誘ってください😊」`;
    addBubble({
      id:ch.id, name:sn(ch.name), emoji:ch.emoji||'👩',
      text:longMsg, time:'21:05', long:true
    });
  }
}

// スクロール
setTimeout(()=>{ area.scrollTop=area.scrollHeight; }, 100);

// ── L2: 次の行き先を決定 ──────────────────────────
// L2ループ中（goukon_saveがある）かどうかで挙動を切り替える
const isL2Mode = !!localStorage.getItem('goukon_save');

(function setupNextButton() {
  const btn = document.getElementById('next-btn');
  if(!isL2Mode) {
    // 単発プレイ: 従来どおり「次の合コンへ」
    btn.textContent = '🍺 次の合コンへ（単発）';
    btn.onclick = () => { location.href = 'formation.html'; };
    return;
  }
  // L2モード: ボタンラベルを現在月から計算（まだ月進めない）
  const curMonth = GameState.month;
  const nextMonth = curMonth === 12 ? 1 : curMonth + 1;
  if(nextMonth === 3) {
    btn.textContent = '📋 1年を振り返る';
  } else {
    btn.textContent = `📅 ${nextMonth}月へ進む`;
  }
  // ボタンクリック時に月を進める
  btn.onclick = () => {
    GameState.advanceMonth(1);
    const m = GameState.month;
    if(m === 3) {
      location.href = 'year_ending.html';
    } else {
      location.href = 'month.html';
    }
  };
})();
</script>
</body>
</html>
