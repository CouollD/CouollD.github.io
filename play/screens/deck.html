<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>持ちネタ — デッキ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
/* 本番画面と同じ言語で組む: 墨の地／役割は色ひとつ */
*{box-sizing:border-box}
:root{
  --ink-deep:#0E0B14; --panel:#181327; --line:#241C38;
  --paper:#F3EFE6; --card-ink:#17131F;
  --role-link:#35E3F0; --role-burn:#FF3D7F; --role-neta:#FFB43D; --muted:#9A93AD;
  --font:'M PLUS Rounded 1c',sans-serif; --font-pop:'Mochiy Pop One',sans-serif;
}
html,body{margin:0;padding:0;background:var(--ink-deep);color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased}
.phone{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink-deep);z-index:5}
.hd .back{width:40px;height:40px;border:none;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.hd h1{margin:0;font-family:var(--font-pop);font-size:16px;flex:1}
.hd .count{font-family:var(--font-pop);font-size:13px;color:var(--role-neta)}

.lead{padding:12px 16px 4px;font-size:11.5px;font-weight:700;line-height:1.7;color:var(--muted)}
.attr{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 14px}
.attr span{font-size:10px;font-weight:800;padding:4px 9px 5px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:#CFC8DE}

.sect{padding:6px 16px 2px;display:flex;align-items:center;gap:8px}
.sect b{font-family:var(--font-pop);font-size:12.5px;letter-spacing:0;flex:0 0 auto}
.sect em{font-style:normal;font-size:11px;font-weight:800;color:#CFC8DE;flex:1 1 auto;min-width:0}
.sect small{font-size:10px;font-weight:800;color:var(--muted)}
.sect.neta b{color:var(--role-neta)}
.sect.aizuchi b{color:var(--role-link)}
.sect.late b{color:var(--role-burn)}
.sect.miss b{color:var(--muted)}
.c.locked{background:#14101F;border-color:#2E2644;opacity:.72}
.c.locked .bar{background:#2E2644}
.c.locked .line{color:#8F87A6;font-weight:700}
.c.locked .nm{color:#8F87A6}
.c.locked .x{color:#6F6785}
.c.locked .dots{color:#5B5370}

.list{display:flex;flex-direction:column;gap:8px;padding:8px 14px 16px}
.c{border:2px solid var(--card-ink);border-radius:4px;overflow:hidden;display:flex;background:var(--paper)}
.c .bar{flex:0 0 7px;background:var(--card-ink)}
.c .body{flex:1;min-width:0;padding:9px 11px 10px;display:flex;flex-direction:column;gap:5px}
.c .line{font-size:12.5px;font-weight:800;line-height:1.45;color:var(--card-ink)}
.c .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.c .nm{font-family:var(--font-pop);font-size:11px;color:var(--card-ink)}
.c .chip{font-size:9px;font-weight:800;border-radius:3px;padding:2px 6px 3px;color:#fff;background:#4A4160}
.c .dots{font-size:9px;font-weight:800;color:#147F8A;letter-spacing:.06em}
.c.neta .dots{color:#8F87A6}
.c .x{font-size:9.5px;font-weight:800;color:#5B5370;line-height:1.5}

.c.neta{background:var(--panel);border-color:var(--role-neta)}
.c.neta .bar{background:var(--role-neta)}
.c.neta .line{color:#fff}
.c.neta .nm{color:#fff}
.c.neta .x{color:#8F87A6}
.c.link .bar{background:var(--role-link)}
.c.burn{border-color:var(--role-burn)}
.c.burn .bar{background:var(--role-burn)}
.c.late{background:#fff;border-color:var(--role-burn)}
.c.late .bar{background:var(--role-burn)}
.chip.w-wide{background:#3F8F6F}
.chip.w-mid{background:#5B5370}
.chip.w-narrow{background:var(--role-burn)}
.dup{font-size:9px;font-weight:800;color:var(--muted);align-self:center;padding-right:9px;white-space:nowrap}

.note{margin:4px 14px 20px;padding:11px 13px;border-radius:4px;background:var(--panel);border-left:3px solid var(--role-burn);font-size:11px;font-weight:700;line-height:1.75;color:#BDB6CC}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:12px;font-weight:700;line-height:1.8}
</style>
</head>
<body>
<div class="phone">
  <div class="hd">
    <button class="back" id="back" aria-label="戻る">←</button>
    <h1>持ちネタ</h1>
    <span class="count" id="count">—</span>
  </div>

  <div class="lead">合コンで出せる札は、住まい・サークル・バイトで決まる。<br>ネタは「同じ境遇の子にしか通じない話」ほど深く刺さる。<br>その夜に引く順番は毎回変わるが、入っている札は変わらない。</div>
  <div class="attr" id="attr"></div>

  <div id="out"></div>
</div>

<script src="../data/gamedata.js"></script>
<script src="../js/core/card-topics.js"></script>
<script src="../js/core/deck.js"></script>
<script>
(() => {
  const LIVING = { home:'実家暮らし', alone_send:'一人暮らし（仕送りあり）', alone_nosend:'一人暮らし（仕送りなし）' };
  const CIRCLE = { culture:'文化系サークル', sports:'体育会サークル', none:'サークルなし' };
  const PART   = { izakaya:'居酒屋バイト', cafe:'カフェバイト', juku:'塾バイト', none:'バイトなし' };
  const TYPE_JA = { kyokan:'共感', nori:'ノリ', fukagori:'深掘り', change:'話題変え', nomiyo:'飲もうぜ', renraku:'連絡先' };

  const back = document.getElementById('back');
  back.onclick = () => { history.length > 1 ? history.back() : (location.href = 'month.html'); };

  const cfg = JSON.parse(localStorage.getItem('goukon_config') || 'null');
  const out = document.getElementById('out');
  if (!cfg) {
    out.innerHTML = '<div class="empty">まだキャラクターを作っていません。<br>「はじめから」でプロフィールを決めると、<br>持ちネタが決まります。</div>';
    return;
  }

  const living = cfg.living || 'home', circle = cfg.circle || 'none', part = cfg.part || 'none';
  document.getElementById('attr').innerHTML =
    [LIVING[living], CIRCLE[circle], PART[part]].map(t => `<span>${t}</span>`).join('');

  const params = (typeof derivePlayerParams === 'function')
    ? derivePlayerParams(living, circle, part)
    : { comm:50, visu:50, head:50, tact:50, air:50, mental:50, sake:50 };

  const flags = JSON.parse(localStorage.getItem('goukon_learned') || '[]');
  // その夜のランクは引くたびに変わるので、ここでは「入っている札の種類」だけを見せる
  const { cards } = DeckCore.buildDeck({ living, circle, part }, params, () => 0.5, flags);
  const SELF = { living, circle, part, params, flags };

  const uniq = [];
  cards.forEach(c => {
    const hit = uniq.find(u => u.label === c.label);
    if (hit) hit.n++; else uniq.push({ ...c, n: 1 });
  });

  const netas    = uniq.filter(c => c.topic);
  const aizuchis = uniq.filter(c => !c.topic);

  document.getElementById('count').textContent = `${cards.length}枚 ＋ 連絡先`;

  const esc = (t) => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function netaCard(c) {
    const t = CardTopics.get(c.topic) || {};
    const w = CardTopics.widthOf(t, (typeof HEROINES !== 'undefined') ? HEROINES : []);
    const kind = t.kind === 'intro'
      ? '話の入り口。ほとんどの子が拾うが、伸びは小さい。'
      : '同じ境遇の子にだけ通じる話。刺さればその子が食いついて会話が続く。誰も拾わなければ場が冷える。';
    return `<div class="c neta"><div class="bar"></div><div class="body">
      <div class="line">${esc(t.open || '')}</div>
      <div class="foot">
        <span class="nm">${esc(c.label)}</span>
        <span class="chip w-${w.width}">${w.ja}</span>
        <span class="dots">10人中 ${w.n}人</span>
      </div>
      <div class="x">${kind}</div>
    </div>${c.n > 1 ? `<span class="dup">×${c.n}</span>` : ''}</div>`;
  }

  const LIVING_JA = LIVING, CIRCLE_JA = CIRCLE, PART_JA = PART;
  const PARAM_JA = { comm:'コミュ力', head:'頭', visu:'ビジュ', tact:'手際', sake:'酒', air:'空気', mental:'メンタル' };
  const LEARN_JA = { study:'勉強する', gym:'ジムに行く', friend_hangout:'友達と飲む' };

  /** なぜ持っていないのかを、条件から日本語にする */
  function whyLocked(t) {
    const r = t.require || {};
    const out = [];
    if (r.living) out.push(LIVING_JA[r.living] || r.living);
    if (r.circle) out.push(CIRCLE_JA[r.circle] || r.circle);
    if (r.part)   out.push(PART_JA[r.part] || r.part);
    if (r.param) for (const k in r.param) out.push(`${PARAM_JA[k] || k} ${r.param[k]}以上`);
    if (r.flag)  out.push(`月の行動で「${LEARN_JA[r.flag] || r.flag}」を選ぶ`);
    return out.join(' ＋ ');
  }

  function missingCards() {
    const all = Object.keys(CardTopics.TOPICS).map(id => CardTopics.TOPICS[id]);
    const miss = all.filter(t => !CardTopics.canHold(t, SELF));
    if (!miss.length) return '<div class="x" style="padding:6px 4px">すべての札を持っている。</div>';
    // 届きそうなもの（日常で覚える・パラメータ）を先に出す
    const rank = (t) => (t.require && t.require.flag) ? 0 : (t.require && t.require.param) ? 1 : 2;
    miss.sort((a, b) => rank(a) - rank(b));
    return miss.map(t => {
      const w = CardTopics.widthOf(t, (typeof HEROINES !== 'undefined') ? HEROINES : []);
      return `<div class="c locked"><div class="bar"></div><div class="body">
        <div class="line">${esc(t.open || '')}</div>
        <div class="foot">
          <span class="nm">${esc(t.label)}</span>
          <span class="chip w-${w.width}">${w.ja}</span>
          <span class="dots">10人中 ${w.n}人</span>
        </div>
        <div class="x">条件：${esc(whyLocked(t)) || '—'}</div>
      </div></div>`;
    }).join('');
  }

  function plainCard(c) {
    const role = c.link === 0 ? 'burn' : 'link';
    const dots = c.link > 0 ? `<span class="dots">つなぐ ${'●'.repeat(c.link)}</span>` : '';
    const x = c.link === 0
      ? '強いぶん、出した瞬間に流れが切れる。繋いでから出すと伸びる。'
      : '弱いが次の札に乗る。これを挟んでから強い札を出すのが基本。';
    return `<div class="c ${role}"><div class="bar"></div><div class="body">
      <div class="line">${esc(c.line)}</div>
      <div class="foot">
        <span class="nm">${esc(c.label)}</span>
        <span class="chip">${TYPE_JA[c.type] || c.type}</span>
        ${dots}
      </div>
      <div class="x">${x}</div>
    </div>${c.n > 1 ? `<span class="dup">×${c.n}</span>` : ''}</div>`;
  }

  out.innerHTML =
    `<div class="sect neta"><b>ネタ</b><em>自分から話題を振る</em><small>${netas.length}種</small></div>
     <div class="list">${netas.map(netaCard).join('')}</div>

     <div class="sect aizuchi"><b>相槌</b><em>いまの話に乗る</em><small>${aizuchis.length}種</small></div>
     <div class="list">${aizuchis.map(plainCard).join('')}</div>

     <div class="sect late"><b>連絡先</b><em>夜の途中で山に入る</em></div>
     <div class="list">
       <div class="c late"><div class="bar"></div><div class="body">
         <div class="line">「あのさ。……連絡先、聞いてもいい？」</div>
         <div class="foot"><span class="nm">連絡先</span><span class="chip w-narrow">勝負</span></div>
         <div class="x">最初は山に入っていない。夜が序盤に入ると一枚だけ混ざる。引けなければ、その夜は聞けない。</div>
       </div></div>
     </div>

     <div class="sect miss"><b>まだ持っていない</b><em>条件を満たすと増える</em></div>
     <div class="list">${missingCards()}</div>

     <div class="note">札の強さ（並・上・特）は夜ごとに引き直される。コミュ力が高いほど上位の札が出やすく、頭は深掘り札、酒は飲もうぜ札の質に効く。手際が高いとデッキが厚くなる。</div>`;
})();
</script>
<!-- 合コン直前に通ったときだけ出す「この持ちネタで行く」（2026-09-24） -->
<div class="go-bar" id="go-bar" hidden>
  <button class="go-next" id="go-next">🍻 この持ちネタで行く</button>
</div>
<style>
.go-bar{ position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, var(--ink-deep) 72%, transparent); z-index:20; }
.go-next{ width:100%; padding:14px; border-radius:14px; border:2.5px solid #17131F;
  background:#FF3D7F; color:#fff; font-family:var(--font-pop,inherit); font-size:15px; font-weight:800;
  box-shadow:3px 3px 0 rgba(0,0,0,.35); cursor:pointer; }
.go-next:active{ transform:scale(.99); }
body.has-gobar{ padding-bottom:88px; }
</style>
<script>
(function(){
  var next = new URLSearchParams(location.search).get('next');
  if (!next || !/^[a-z_]+\.html$/.test(next)) return;   // 外から任意のURLに飛ばされないようにする
  var bar = document.getElementById('go-bar');
  bar.hidden = false;
  document.body.classList.add('has-gobar');
  document.getElementById('go-next').onclick = function(){ location.href = next; };
})();
</script>
</body>
</html>
