<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>今夜のスタメン 遊べる版（案I）</title>
<!--
  screens/night_i.html — 遊べる版（案I：流れる会話＋気づき）。灰色の画面のまま、合コン1回が最後まで通る（10/18 の節目）
  決定：GDD_v6 §18 ／ 進行と台詞：js/night-i/night-i.js ／ 画面の部品：js/night-i/stage.js
  ?p=A|B|C で自分の設定を選んで、すぐ始まる（&tips=0 でチュートリアルなし、&yomi=30|50|70）
  前の版（グノーシア型）は screens/night_v0.html に残してある
-->
<style>
  :root {
    color-scheme: light;
    --bg: #F4F4F4; --ink: #262626; --ink2: #545454; --ink3: #8C8C8C; --line: #BDBDBD;
    --card: #FFFFFF; --stage: #DCDCDC; --hero: #6E6E6E; --friend: #8A8A8A; --speak: #4E4E4E;
    --board: #4A4A4A; --board2: #7A7A7A; --table: #C8C8C8; --soft: #F7F7F7; --kw: #262626; --kwInk: #FFFFFF;
    --hint: #F2C230; --hintInk: #2A2100;   /* 10/10：ヒントだけの色（仮。本番の配色はデザインの段で決める） */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1B1B1B; --ink: #ECECEC; --ink2: #B5B5B5; --ink3: #858585; --line: #444444;
      --card: #262626; --stage: #333333; --hero: #7A7A7A; --friend: #5E5E5E; --speak: #9A9A9A;
      --board: #202020; --board2: #555555; --table: #4A4A4A; --soft: #2B2B2B; --kw: #ECECEC; --kwInk: #1B1B1B;
      --hint: #F2C230; --hintInk: #2A2100;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1B1B1B; --ink: #ECECEC; --ink2: #B5B5B5; --ink3: #858585; --line: #444444;
    --card: #262626; --stage: #333333; --hero: #7A7A7A; --friend: #5E5E5E; --speak: #9A9A9A;
    --board: #202020; --board2: #555555; --table: #4A4A4A; --soft: #2B2B2B; --kw: #ECECEC; --kwInk: #1B1B1B;
    --hint: #F2C230; --hintInk: #2A2100;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  button { font-family: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* 一覧 */
  .home { max-width: 520px; margin: 0 auto; padding: 18px 16px 40px; }
  .home h1 { font-size: 22px; margin: 4px 0 6px; }
  .home .lead { font-size: 13px; color: var(--ink2); line-height: 1.6; margin: 0 0 14px; }
  .mcard { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .mcard .hd { display: flex; align-items: baseline; gap: 8px; }
  .mcard .badge { font-weight: 800; font-size: 15px; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 1px 7px; }
  .mcard .nm { font-weight: 700; font-size: 16px; }
  .mcard .ref { font-size: 11px; color: var(--ink3); margin-left: auto; text-align: right; }
  .mcard dl { margin: 8px 0 10px; display: grid; grid-template-columns: 4.6em 1fr; gap: 3px 8px; font-size: 12.5px; line-height: 1.5; }
  .mcard dt { color: var(--ink3); }
  .mcard dd { margin: 0; }
  .mcard .go { display: flex; gap: 8px; }
  .mcard .go button { flex: 1; min-height: 42px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; cursor: pointer; }
  .mcard .go button.sub { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 400; }
  .mcard .go button:disabled { opacity: .4; cursor: default; }
  .mcard .go.prof { flex-direction: column; }
  .mcard .go button.pbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 8px 12px; text-align: left; font-weight: 400; }
  .mcard .go button.pbtn b { font-size: 14px; }
  .mcard .go button.pbtn span { font-size: 13px; }
  .mcard .go button.pbtn small { font-size: 11px; opacity: .75; }
  .home .foot { font-size: 11.5px; color: var(--ink3); line-height: 1.6; margin-top: 16px; }

  /* 遊ぶ画面（案6の灰色） */
  .app { max-width: 462px; height: 100%; margin: 0 auto; padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px; }
  .top { display: flex; align-items: center; gap: 8px; height: 34px; flex: none; }
  .top .back { flex: none; white-space: nowrap; height: 32px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 13px; padding: 0 10px; cursor: pointer; }
  .top .ttl { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--ink2); flex: none; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--ink2); }
  .tools { position: relative; flex: none; }
  .tools > button { width: 40px; height: 32px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 16px; cursor: pointer; }
  .menu { position: absolute; right: 0; top: 38px; z-index: 30; display: flex; flex-direction: column; gap: 4px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.18); min-width: 190px; }
  .menu button { min-height: 36px; border: none; background: transparent; border-radius: 6px; font-size: 13px; text-align: left; padding: 0 10px; cursor: pointer; }
  .menu button:hover, .menu button:focus-visible { background: var(--bg); }

  .stage { position: relative; flex: 1 1 auto; min-height: 300px; background: var(--stage); border-radius: 12px; overflow: hidden; cursor: pointer; }
  .shade { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .6s; pointer-events: none; z-index: 8; }
  .board { position: absolute; left: 30px; right: 30px; top: 16px; height: 80px; background: var(--board); border: 5px solid var(--board2); }
  .table { position: absolute; left: 0; right: 0; bottom: 150px; height: 26px; background: var(--table); }
  .fig { position: absolute; top: 86px; bottom: 150px; width: 34%; transition: filter .3s, opacity .3s; }
  .fig .head { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #FFFFFF; }
  .fig .body { position: absolute; left: 0; right: 0; top: 58px; bottom: 0; border-radius: 60px 60px 0 0;
    display: flex; flex-direction: column; align-items: center; padding-top: 30px; gap: 4px; font-size: 11px; color: #FFFFFF; }
  .fig .meter { font-size: 10.5px; opacity: .95; letter-spacing: .5px; }
  .fig.h .head, .fig.h .body { background: var(--hero); }
  .fig.f .head, .fig.f .body { background: var(--friend); }
  .fig.dim { filter: blur(2.5px); opacity: .8; }
  .fig.far { filter: blur(5px); opacity: .6; }
  .fig.speak { filter: none; opacity: 1; z-index: 3; }
  .fig.speak .head, .fig.speak .body { background: var(--speak); }
  .fig.watch { filter: none; opacity: 1; }
  #fig-101 { left: -2%; } #fig-102 { left: 33%; z-index: 2; } #fig-103 { left: 67%; }
  #fig-1 { left: -34%; top: 130px; bottom: 120px; width: 44%; z-index: 4; }
  #fig-4 { left: 90%; top: 130px; bottom: 120px; width: 44%; z-index: 4; }
  .fig.f.far { filter: blur(3.5px); opacity: .75; }
  #fig-1.speak { left: -24%; } #fig-4.speak { left: 80%; }
  .note { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); font-size: 22px; font-weight: 800; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--ink); border-radius: 14px; padding: 0 8px; z-index: 12; pointer-events: none;
    animation: rise 1.8s ease-out forwards; white-space: nowrap; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 8px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -18px); } }

  .win { position: absolute; left: 0; right: 0; bottom: 0; min-height: 138px; background: var(--card); border: 1.5px solid var(--ink);
    border-radius: 12px; padding: 24px 14px 18px; z-index: 9; }
  .win.narr { background: var(--soft); border-style: dashed; border-color: var(--ink3); }
  .plate { position: absolute; left: 12px; top: -14px; display: flex; align-items: center; gap: 6px; }
  .who { background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
  .to { background: var(--card); border: 1.5px solid var(--ink); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
  .act { background: var(--card); border: 1.5px solid var(--ink3); font-size: 11px; padding: 2px 8px; border-radius: 4px; }
  .tag { position: absolute; right: 12px; top: -11px; background: var(--card); border: 1.5px solid var(--ink3); font-size: 11px; padding: 2px 10px; border-radius: 11px; }
  .text { font-size: 15px; line-height: 1.75; }
  .win.narr .text { color: var(--ink2); font-size: 14px; }
  .next { position: absolute; right: 12px; bottom: 6px; font-size: 11px; color: var(--ink3); }
  .tbar { position: absolute; left: 12px; bottom: 6px; height: 3px; width: 0; background: var(--ink3); border-radius: 2px; }
  .kw { font: inherit; font-weight: 700; background: var(--kw); color: var(--kwInk); border: none; border-radius: 4px; padding: 0 4px; margin: 0 1px; cursor: pointer; }
  .kw.used { background: transparent; color: var(--ink3); text-decoration: line-through; cursor: default; }
  .think { display: inline-block; letter-spacing: 3px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .cmds { flex: none; min-height: 112px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; gap: 6px; }
  .cmd { min-height: 50px; border: 1.5px solid var(--ink3); background: var(--card); border-radius: 10px; font-size: 15px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 4px 8px; text-align: center; }
  .cmd small { font-size: 10px; font-weight: 400; color: var(--ink2); }
  .cmd.line { font-size: 14px; font-weight: 400; align-items: flex-start; text-align: left; padding: 8px 12px; min-height: 44px; }
  .cmd.quiet { border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 400; min-height: 42px; }
  .cmd.pill { border-radius: 24px; border-color: var(--ink); }
  .cmd.card { border-style: dashed; }
  .cmd:disabled { opacity: .35; cursor: default; }
  .hint { font-size: 11px; color: var(--ink3); text-align: center; }
  .bar { display: flex; align-items: center; gap: 10px; min-height: 60px; }
  .bar .hint { flex: 1 1 auto; text-align: left; }
  .cut { height: 52px; padding: 0 22px; border: 2px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 26px; font-size: 15px; font-weight: 700; cursor: pointer; flex: none; }
  .panelcmd { display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 1.5px solid var(--ink); border-radius: 14px; padding: 8px 10px 10px; }
  .panelcmd .top2 { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink2); }
  .panelcmd .top2 button { border: none; background: transparent; font-size: 11px; color: var(--ink2); cursor: pointer; }
  .clock { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .clock > i { display: block; height: 100%; background: var(--ink); width: 100%; }
  /* 10/4：長押しで早く進む時間のバー（「黙って聞く」ボタンの代わり） */
  .clock.hold { position: relative; height: 26px; border-radius: 13px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin-top: 2px; }
  .clock.hold > i { position: absolute; inset: 0 auto 0 0; background: var(--ink3); opacity: .45; }
  .clock.hold > span { position: relative; display: flex; align-items: center; justify-content: center; height: 100%; font-size: 11px; color: var(--ink2); pointer-events: none; }
  .clock.hold.on { box-shadow: 0 0 0 2px var(--ink); }
  .clock.hold.on > span::after { content: '…'; }
  /* 10/4：メタの説明で止める（試し）と、目立ちのゲージが光る */
  .metastop { position: absolute; left: 14px; right: 14px; top: 26%; z-index: 14; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.7; animation: vin .3s ease-out; }
  .metastop b { display: inline-block; font-size: 10.5px; border: 1px solid var(--bg); border-radius: 8px; padding: 0 6px; margin-bottom: 4px; }
  .metastop p { margin: 0; }
  .metastop .cmd { margin-top: 10px; width: 100%; background: var(--bg); color: var(--ink); border-color: var(--bg); }
  .metastop { cursor: pointer; }
  .dots.lit .mbar { box-shadow: 0 0 0 3px var(--ink3); animation: litp 1.2s ease-in-out 2; }
  @keyframes litp { 50% { box-shadow: 0 0 0 5px var(--ink2); } }
  @media (prefers-reduced-motion: reduce) { .dots.lit .mbar { animation: none; } }
  .mbar { position: relative; display: inline-block; width: 74px; height: 9px; border: 1px solid var(--ink3); border-radius: 5px; overflow: hidden;
    background: linear-gradient(to right, var(--line) 0 15%, transparent 15% 70%, var(--line) 70% 100%); }
  .mbar > i { display: block; height: 100%; background: var(--ink2); transition: width .4s; }
  .cue { position: absolute; width: max-content; top: 64px; transform: translateX(-50%); z-index: 11; border: 1.5px dashed var(--ink); background: var(--card); color: var(--ink);
    border-radius: 14px; font-size: 12px; font-weight: 700; padding: 5px 12px; cursor: pointer; animation: pulse 1.1s ease-in-out infinite; }
  .cue.table { top: auto; bottom: 156px; z-index: 14; }   /* ヒントの箱より上（10/10） */
  .cue.done { border-style: solid; animation: none; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.08); } }
  .kwq { background: var(--kw); color: var(--kwInk); border-radius: 4px; padding: 0 3px; font-weight: 700; }
  .votes { display: grid; gap: 3px; font-size: 13px; }
  .vrow { display: grid; grid-template-columns: 4.5em 1.2em 1fr; align-items: center; animation: vin .3s ease-out; }
  @keyframes vin { from { opacity: 0; transform: translateY(4px); } }

  #sheet-log { z-index: 25; }
  /* ヒント（10/10）：会話の窓のすぐ上に、黄色で。けんたの顔つき。関係する所を光らせる */
  .tip { position: absolute; left: 8px; right: 8px; z-index: 13; display: flex; gap: 8px; align-items: flex-start; border-radius: 12px; padding: 9px 11px; font-size: 13px; line-height: 1.55;
    background: var(--ink); color: var(--bg); box-shadow: 0 6px 18px rgba(0,0,0,.28); cursor: pointer; animation: tipin .35s ease-out, tipnudge .5s ease-in-out .35s 1; }
  .tip.whisper { background: var(--hint); color: var(--hintInk); }
  .tip .tav { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--hintInk); color: var(--hint); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  .tip .tbody { flex: 1; min-width: 0; }
  .tip .tlab { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; opacity: .8; }
  .tip.meta { flex-wrap: wrap; }
  .tip.meta .tlab { display: inline-block; background: var(--hint); color: var(--hintInk); border-radius: 6px; padding: 0 6px; opacity: 1; margin-right: 2px; }
  .tip .tclose { width: 100%; text-align: right; font-size: 10.5px; opacity: .7; }
  .hl { outline: 3px solid var(--hint); outline-offset: 2px; border-radius: 14px; animation: hlp 1s ease-in-out infinite; }
  @keyframes tipin { from { opacity: 0; transform: translateY(10px) scale(.97); } }
  @keyframes tipnudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes hlp { 50% { outline-color: transparent; } }
  @media (prefers-reduced-motion: reduce) { .tip, .hl { animation: none; } }
  .fig.gone { opacity: 0 !important; filter: none !important; pointer-events: none; transition: opacity .6s; }
  /* 場所：背景と左上の札（店の外・カラオケは夜の色にする） */
  .stage { transition: background .8s; }
  .stage[data-scene="out"], .stage[data-scene="station"] { background: linear-gradient(180deg, #1F2740 0%, #36405E 70%, #4A4F63 100%); }
  .stage[data-scene="street"] { background: linear-gradient(180deg, #E9B98A 0%, #B98A8F 55%, #6E6A86 100%); }
  .stage[data-scene="street"] .fig, .stage[data-scene="street"] .table, .stage[data-scene="street"] .board { opacity: 0; transition: none; }
  .stage[data-scene="karaoke"] { background: radial-gradient(circle at 18% 22%, rgba(255, 110, 190, .35), transparent 38%), radial-gradient(circle at 82% 28%, rgba(110, 170, 255, .35), transparent 40%), #2F2540; }
  .stage[data-place]:not([data-place=""])::after { content: attr(data-place); position: absolute; left: 10px; top: 10px; z-index: 5; font-size: 12px; padding: 2px 10px; border-radius: 10px; background: var(--card); color: var(--ink); border: 1.5px solid var(--ink3); pointer-events: none; }
  .lc-st { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); font-size: 12px; font-weight: 700; padding: 2px 4px; }
  .tip b { display: inline-block; font-size: 10.5px; border: 1px solid var(--bg); border-radius: 8px; padding: 0 6px; margin-right: 6px; }
  .phone { position: absolute; inset: 8px; z-index: 12; background: var(--card); border: 1.5px solid var(--ink); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; cursor: default; }
  .ph-top { padding: 10px 12px; font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--line); background: var(--bg); }
  .ph-body { flex: 1; overflow: auto; padding: 8px 10px; }
  /* ログ：3案 */
  .panel.log { padding-top: 0; }
  .loghead { position: sticky; top: 0; z-index: 2; background: var(--card); display: flex; align-items: center; gap: 8px; padding: 14px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .loghead h2 { margin: 0; font-size: 17px; }
  .logtabs { display: flex; gap: 4px; margin-left: 4px; }
  .ltab { border: 1px solid var(--line); background: transparent; border-radius: 14px; font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .ltab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .lclose { margin-left: auto; border: none; background: transparent; font-size: 12px; color: var(--ink2); cursor: pointer; }
  /* 複合 */
  .lm-card { border: 1px solid var(--line); border-radius: 12px; margin: 0 0 8px; overflow: hidden; }
  .lm-card > summary { list-style: none; cursor: pointer; padding: 9px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--bg); }
  .lm-card > summary::-webkit-details-marker { display: none; }
  .lm-card > summary::after { content: '▸ 開く'; font-size: 10.5px; color: var(--ink3); }
  .lm-card[open] > summary::after { content: '▾ 閉じる'; }
  .lm-h { font-weight: 700; font-size: 14px; }
  .lm-k { font-size: 11.5px; color: var(--ink2); }
  .lm-body { padding: 4px 10px 10px; }
  .logtabs { flex-wrap: wrap; }
  /* A チャット */
  .lc-h { text-align: center; margin: 14px 0 8px; } .lc-h span { font-size: 11px; color: var(--ink2); background: var(--bg); border-radius: 10px; padding: 2px 10px; }
  .lc-row { display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; }
  .lc-row.me { justify-content: flex-end; }
  .lc-av { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--hero); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .lc-col { max-width: 78%; }
  .lc-row.me .lc-col { display: flex; flex-direction: column; align-items: flex-end; }
  .lc-name { font-size: 10.5px; color: var(--ink2); margin: 0 0 2px 2px; } .lc-name i { font-style: normal; color: var(--ink3); }
  .lc-b { font-size: 13.5px; line-height: 1.5; background: var(--bg); border-radius: 4px 12px 12px 12px; padding: 6px 10px; }
  .lc-row.me .lc-b { background: var(--ink); color: var(--bg); border-radius: 12px 4px 12px 12px; }
  .lc-act { font-size: 10px; color: var(--ink3); margin-top: 2px; }
  .lc-n { text-align: center; font-size: 11.5px; color: var(--ink3); margin: 6px 12px; }
  .lc-fx { text-align: center; font-size: 10.5px; color: var(--ink2); margin: 2px 0 8px; }
  /* B 台本 */
  .ls-h { position: sticky; top: 52px; background: var(--card); font-size: 12px; font-weight: 700; color: var(--ink2); padding: 8px 0 4px; border-bottom: 1px dashed var(--line); margin: 6px 0; }
  .ls-row { display: grid; grid-template-columns: 4.6em 1fr; gap: 8px; padding: 4px 4px; font-size: 13.5px; line-height: 1.55; }
  .ls-row.me { background: var(--bg); border-radius: 6px; }
  .ls-name { font-weight: 700; text-align: right; font-size: 12px; padding-top: 1px; }
  .ls-name small { display: block; font-weight: 400; font-size: 10px; color: var(--ink3); }
  .ls-n { font-size: 12px; color: var(--ink3); padding: 3px 4px 3px 5.4em; }
  .ls-fx { font-size: 10.5px; color: var(--ink2); padding: 0 4px 4px 5.4em; }
  /* C 振り返り */
  .lr-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; }
  .lr-h { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .lr-k { font-size: 12px; color: var(--ink2); margin: 2px 0; }
  .lr-acts { margin: 6px 0; padding-left: 18px; font-size: 13px; line-height: 1.5; } .lr-acts li { margin: 4px 0; } .lr-acts span { color: var(--ink2); font-size: 12px; }
  .lr-card details { margin-top: 6px; font-size: 12.5px; } .lr-card summary { cursor: pointer; color: var(--ink2); font-size: 12px; }
  .lr-card details p { margin: 4px 0; } .lr-card details p.n { color: var(--ink3); }
  .acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .panel { width: 100%; max-width: 440px; max-height: 84%; overflow: auto; background: var(--card); border-radius: 16px 16px 0 0; padding: 18px 16px 24px; }
  .panel h2 { margin: 0 0 8px; font-size: 20px; }
  .panel h3 { margin: 14px 0 4px; font-size: 13px; color: var(--ink2); }
  .panel p { margin: 6px 0; line-height: 1.6; font-size: 14px; }
  .panel .small { font-size: 12px; color: var(--ink2); }
  .hearts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .hearts div { border: 1px solid var(--line); border-radius: 8px; padding: 6px; text-align: center; font-size: 12px; }
  .hearts b { display: block; font-size: 16px; }
  .log p { margin: 0 0 8px; font-size: 13px; line-height: 1.55; }
  .log .r { color: var(--ink3); font-size: 11px; margin-top: 12px; }
  .log .n { color: var(--ink3); }
  .dbg { position: absolute; left: 8px; top: 8px; z-index: 10; background: var(--card); opacity: .94; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; font-size: 10.5px; line-height: 1.5; font-variant-numeric: tabular-nums; }
</style>
<style>
  /* 本編：最初の画面 */
  .home h2 { font-size: 14px; margin: 16px 0 8px; color: var(--ink2); }
  .opts { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 13px; margin: 6px 0 4px; }
  .opts label { display: inline-flex; align-items: center; gap: 6px; }
  .opts select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .home .foot { font-size: 12px; color: var(--ink3); line-height: 1.6; margin-top: 16px; }
</style>
</head>
<body>
<div class="home" id="home">
  <h1>今夜のスタメン</h1>
  <p class="lead">遊べる版（案I：流れる会話＋気づき）。灰色の画面のまま、合コン1回を最後まで遊べます。台詞と数値は仮のものです。</p>
  <h2>今日の自分</h2>
  <div class="mcard"><div class="go prof" id="profiles"></div></div>
  <div class="opts">
    <label>チュートリアル <select id="opt-tips"><option value="1" selected>あり（けんたのLINE＋ヒント）</option><option value="0">なし（居酒屋から）</option></select></label>
    <label>空気読み <select id="opt-yomi"><option value="30">30</option><option value="50" selected>50</option><option value="70">70</option></select></label>
  </div>
  <p class="foot">会話は勝手に流れます。口を挟めるのは、下に吹き出しが出ている間だけ。黙っていても話は進みます。<br>自分の設定（バイト・サークル・住まい）で、使える手札と、話が合う子が変わります。</p>
</div>

<div class="app" id="play" hidden>
  <div class="top">
    <button type="button" class="back" id="btn-back">‹ 設定</button>
    <div class="ttl" id="ttl"></div>
    <div class="dots" id="dots"></div>
    <div class="tools">
      <button type="button" id="btn-menu" aria-label="メニュー" aria-expanded="false">…</button>
      <div class="menu" id="menu" hidden></div>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="board"></div>
    <div class="table"></div>
    <div class="fig h dim" id="fig-101"><div class="head">あ</div><div class="body"><span data-expr>真顔</span><span class="meter" data-meter></span></div></div>
    <div class="fig h dim" id="fig-102"><div class="head">ゆ</div><div class="body"><span data-expr>真顔</span><span class="meter" data-meter></span></div></div>
    <div class="fig h dim" id="fig-103"><div class="head">め</div><div class="body"><span data-expr>真顔</span><span class="meter" data-meter></span></div></div>
    <div class="fig f far" id="fig-1"><div class="head">け</div><div class="body"></div></div>
    <div class="fig f far" id="fig-4"><div class="head">い</div><div class="body"></div></div>
    <div class="shade" id="shade"></div>
    <div class="dbg" id="dbg" hidden></div>
    <div class="win narr" id="win">
      <div class="plate" id="plate"></div>
      <div class="tag" id="tag" hidden></div>
      <div class="text" id="text"></div>
      <div class="next" id="next" hidden>タップで続き ▸</div>
      <div class="tbar" id="tbar"></div>
    </div>
  </div>
  <div class="cmds" id="cmds"></div>
</div>

<div class="sheet" id="sheet-log" hidden><div class="panel log" id="log"></div></div>
<div class="sheet" id="sheet-end" hidden><div class="panel" id="end"></div></div>


<script src="../js/night-i/stage.js"></script>
<script src="../js/night-i/night-i.js"></script>
<script>
(() => {
  'use strict';
  const WHO = { A: 'あおいと話が合う', B: 'ゆなと話が合う', C: 'めいと話が合う' };
  const box = document.getElementById('profiles');
  const go = p => NightI.start({ profile: p, tips: document.getElementById('opt-tips').value === '1', yomi: document.getElementById('opt-yomi').value });
  Object.entries(NightI.PROFILES).forEach(([k, pr]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pbtn';
    b.innerHTML = `<b>設定${k}</b><span>${pr.name}</span><small>手札：${pr.cards.map(c => NightI.CARDS[c]).join('　')}　／　${WHO[k] || ''}</small>`;
    b.addEventListener('click', () => go(k));
    box.appendChild(b);
  });
  document.getElementById('btn-back').addEventListener('click', () => Stage.home());
  const q = new URLSearchParams(location.search);
  if (q.get('tips') === '0') document.getElementById('opt-tips').value = '0';
  if (['30', '50', '70'].includes(q.get('yomi'))) document.getElementById('opt-yomi').value = q.get('yomi');
  if (NightI.PROFILES[q.get('p')]) go(q.get('p'));
})();
</script>
</body>
</html>
