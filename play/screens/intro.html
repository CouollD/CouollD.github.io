<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>乾杯・自己紹介</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
/* register: 夜ポップ(縁日調) — goukon_day.css 準拠
   夜のネイビー地+方眼に、白いシールUIと提灯の暖色光(グラデ表現)を浮かべる */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --night:   #232032;   /* 夜のネイビー地 */
  --night2:  #1a1726;   /* 一段深い夜(帯・外側) */
  --ink:     #201d2b;
  --ink2:    #7d788f;
  --muted:   #b6b2c4;
  --pink:    #ff5b8f;
  --pink-soft:#ffe3ed;
  --cyan:    #27c0dd;
  --cyan-soft:#d8f4fa;
  --yellow:  #ffcf3f;
  --white-dim:rgba(255,255,255,.55);
  --font:     "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",-apple-system,system-ui,sans-serif;
  --font-pop: "Mochiy Pop One","M PLUS Rounded 1c",sans-serif;
}
html,body{height:100%;background:var(--night2);}

.phone{
  max-width:390px; min-height:100dvh; margin:0 auto;
  background:var(--night);
  display:flex; flex-direction:column; overflow:hidden;
  position:relative; cursor:pointer; user-select:none;
  font-family:var(--font);
}

/* STATUS BAR */
.status-bar{
  background:rgba(26,23,38,.94); color:var(--white-dim);
  border-bottom:1px solid rgba(255,255,255,.07);
  padding:10px 20px 6px;
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--font); font-weight:700; font-size:11px;
  flex-shrink:0; position:relative; z-index:20;
}

/* VN STAGE — 夜ネイビー+方眼+提灯の暖色光 */
.vn-stage{
  flex:1; position:relative; overflow:hidden;
  background:
    radial-gradient(ellipse 65% 60% at 18% 0%,  rgba(255,190,80,.22), transparent 70%),
    radial-gradient(ellipse 55% 50% at 92% 30%, rgba(255,91,143,.11), transparent 70%),
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
    var(--night);
  background-size:auto,auto,22px 22px,22px 22px,auto;
}
/* 下端は夜の靄に沈む */
.vn-stage::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:110px;
  background:linear-gradient(0deg, rgba(26,23,38,.5), transparent);
  pointer-events:none; z-index:5;
}

/* Heroine image */
.vn-char{
  position:absolute; inset:0;
  display:flex; align-items:flex-end; justify-content:center;
}
.vn-char img{
  width:100%; height:100%;
  object-fit:cover; object-position:top center;
  display:block;
}
.vn-char-fallback{
  font-size:120px; line-height:1;
  opacity:.75; padding-bottom:20px;
  filter:drop-shadow(0 0 24px rgba(255,190,80,.35));
}

/* Phase indicator (top-left) — 白シールチップ */
.vn-phase{
  position:absolute; top:12px; left:12px; z-index:10;
  font-family:var(--font); font-size:9px; font-weight:800;
  letter-spacing:.08em; color:var(--ink);
  background:#fff; border:2px solid var(--ink);
  padding:3px 10px; border-radius:10px;
  box-shadow:2px 2px 0 rgba(0,0,0,.3);
  transform:rotate(-1.5deg);
}

/* Progress dots (top-right) */
.vn-dots{
  position:absolute; top:14px; right:12px; z-index:10;
  display:flex; gap:6px; align-items:center;
}
.vn-dot{
  width:7px; height:7px; border-radius:50%;
  background:rgba(255,255,255,.22);
  transition:background .3s, transform .3s, box-shadow .3s;
}
.vn-dot.done{ background:var(--white-dim); }
.vn-dot.active{
  background:var(--pink); transform:scale(1.25);
  box-shadow:0 0 8px rgba(255,91,143,.7);
}

/* Bottom text area — 白いシール吹き出し */
.vn-textbox{
  flex-shrink:0;
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:14px;
  margin:8px 10px;
  margin-bottom:calc(10px + env(safe-area-inset-bottom));
  padding:12px 14px 24px;
  position:relative; z-index:20;
  box-shadow:4px 4px 0 rgba(0,0,0,.35);
}

/* Speaker name badge */
.vn-namebox{
  display:inline-block;
  background:var(--pink-soft);
  color:var(--pink);
  font-family:var(--font); font-size:12px; font-weight:800;
  padding:2px 14px;
  border-radius:10px;
  margin-bottom:8px;
  letter-spacing:.03em;
  min-width:80px; text-align:center;
}

/* Dialogue text */
.vn-text{
  font-family:var(--font); font-size:15px; font-weight:700;
  color:var(--ink); line-height:1.7;
  min-height:60px;
}

/* TAP hint */
.vn-tap-hint{
  position:absolute; bottom:8px; right:14px;
  font-family:var(--font); font-size:10px; font-weight:800;
  color:var(--pink); letter-spacing:.08em;
  animation:blink 1.4s infinite;
}
@keyframes blink{ 0%,100%{opacity:.4} 50%{opacity:1} }

/* Narration screen (after all intro done) */
.narration-screen{
  display:none;
  position:absolute; inset:0; z-index:30;
  background:rgba(26,23,38,.95);
  flex-direction:column; align-items:flex-start; justify-content:center;
  padding:32px 24px;
  gap:16px;
  overflow-y: auto;
}
.narration-screen.show{ display:flex; }
.narration-text{
  font-family:var(--font); font-size:13.5px; font-weight:700;
  color:var(--ink); line-height:1.9;
  background:#fff;
  border:2.5px solid var(--ink);
  border-left:6px solid var(--pink);
  padding:12px 14px;
  border-radius:14px;
  box-shadow:4px 4px 0 rgba(0,0,0,.35);
  width:100%;
}
/* シナジー情報 */
.narr-synergy-title{
  font-family:var(--font);
  font-size:8px; font-weight:800; letter-spacing:.12em; color:var(--white-dim);
  margin-bottom:4px; width:100%;
}
.narr-synergy-list{ display:flex; flex-direction:column; gap:6px; width:100%; }
.narr-synergy-row{
  background:#fff;
  border:2px solid var(--ink);
  border-radius:10px; padding:8px 12px;
  box-shadow:2px 2px 0 rgba(0,0,0,.3);
  display:flex; gap:10px; align-items:flex-start;
}
.narr-synergy-icon{ font-size:15px; flex-shrink:0; margin-top:1px; }
.narr-synergy-body{ flex:1; }
.narr-synergy-label{
  font-family:var(--font);
  font-size:11px; font-weight:800; color:var(--ink);
  margin-bottom:2px;
}
.narr-synergy-desc{
  font-family:var(--font);
  font-size:9.5px; font-weight:700; color:var(--ink2); line-height:1.5;
}
.narration-btn{
  width:100%; padding:14px;
  background:var(--pink); border:2.5px solid var(--ink); border-radius:14px;
  color:#fff; font-family:var(--font); font-size:15px; font-weight:800;
  letter-spacing:.04em; cursor:pointer;
  box-shadow:3px 3px 0 rgba(0,0,0,.35), 0 0 16px rgba(255,91,143,.4);
  transition:all .15s; flex-shrink:0;
}
.narration-btn:active{ transform:scale(.97); box-shadow:1px 1px 0 rgba(0,0,0,.35); }

/* Slide transition */
.vn-char, .vn-namebox, .vn-text{
  transition:opacity .3s ease;
}
.fade-out{ opacity:0 !important; }
</style>
<script src="../data/gamedata.js"></script>
<script src="../data/gamestate.js"></script>
</head>
<body>
<div class="phone" id="phone-wrap" onclick="handleTap()">

  <div class="status-bar">
    <span id="status-time">9:41</span>
    <div style="display:flex;gap:6px;align-items:center;"><span>●●●</span><span>🔋</span></div>
  </div>

  <!-- VN STAGE -->
  <div class="vn-stage" id="vn-stage">
    <div class="vn-phase">PHASE 03 — 乾杯・自己紹介</div>

    <div class="vn-dots" id="vn-dots"></div>

    <div class="vn-char" id="vn-char">
      <!-- JS で埋める -->
    </div>

    <!-- Narration overlay after all intros done -->
    <div class="narration-screen" id="narration-screen">
      <div class="narration-text" id="narration-text"></div>
      <div id="narr-synergy-section" style="width:100%;display:none;">
        <div class="narr-synergy-title">SYNERGY — 顔見知り情報</div>
        <div class="narr-synergy-list" id="narr-synergy-list"></div>
      </div>
      <button class="narration-btn" onclick="event.stopPropagation();goNext()">合コン本番へ →</button>
    </div>
  </div>

  <!-- TEXT BOX -->
  <div class="vn-textbox" id="vn-textbox">
    <div class="vn-namebox" id="vn-namebox">　</div>
    <div class="vn-text" id="vn-text"></div>
    <div class="vn-tap-hint" id="tap-hint">TAP</div>
  </div>

</div>

<script>
// 時計
(function(){
  const n=new Date();
  const el=document.getElementById('status-time');
  if(el) el.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
})();

GameState.load();
const config      = loadConfig() || {};
const PARTY_IDS   = JSON.parse(localStorage.getItem('goukon_party')   || '[]');
const HEROINE_IDS = JSON.parse(localStorage.getItem('goukon_heroines')|| '[]');

const SELF_PARAMS  = derivePlayerParams(config.living||'home', config.circle||'none', config.part||'none');
const partyChars   = PARTY_IDS.map(id=>CHARACTERS.find(c=>c.id===id)).filter(Boolean);
const heroineChars = HEROINE_IDS.map(id=>HEROINES.find(h=>h.id===id)).filter(Boolean);

// ── 初期計算 ─────────────────────────────────────────
function calcInitialAir(){
  const allVisu=[SELF_PARAMS.visu,...partyChars.map(c=>c.params.visu)];
  const avgVisu=Math.round(allVisu.reduce((s,v)=>s+v,0)/allVisu.length);
  return Math.min(85,Math.max(20,Math.round(40+(avgVisu-60)*0.5)));
}

function calcImpression(heroine){
  const allVisu=[SELF_PARAMS.visu,...partyChars.map(c=>c.params.visu)];
  const maxVisu=Math.max(...allVisu);
  const diff=maxVisu-heroine.params.visu;
  if(maxVisu>=80||diff>=15) return 'hot';
  if(maxVisu>=60||diff>=0)  return 'warm';
  return 'cool';
}

function calcInitHeart(heroine,imp){
  const base={hot:28,warm:20,cool:14}[imp];
  return base+Math.floor(Math.random()*5);
}

// ── 自己紹介セリフ ────────────────────────────────────
const INTRO_LINES = {
  101: ['はじめまして。瀬川あおいです。読書が趣味で、静かな場所が好きです。よろしくお願いします。','……少し緊張してます。でも、楽しみにしてました。'],
  102: ['橘ゆなで〜す！合コン久々！みんなよろしく〜！超楽しみ！','えーもっと盛り上がろうよ！ほら、グラス空いてない？'],
  103: ['星野めいです……。場の空気がちょっと気になって。こういうの、不思議とドキドキする。','なんか、今夜の星の並びがちょっと特別な気がして。来て正解だったかも。'],
  104: ['長谷部ゆうきです！体育会系で酒も強いんで、飲み負けないでくださいね！','今夜楽しくやりましょう！遠慮なく話しかけてきていいですよ！'],
  105: ['木下りなです。あの……こういう場は少し苦手で。でも、ちゃんと楽しもうと思ってます。','よろしくお願いします。どんな話が好きですか？'],
  106: ['田所みほで〜す！なんか固くなってない？もっと気楽にいこうよ！','飲み物とか足りてる？気になったことがあったら何でも言ってね〜。'],
  107: ['……上原なつきです。よろしく。あ、別に怒ってないですよ。こういう顔なので。','こういう場、得意じゃないんですよね……まあ、せっかく来たし。'],
  108: ['有坂エミリです。少し前まで海外にいて……日本の合コンって、なんか新鮮なんですよね。','よろしくお願いします。何か面白い話、期待してますね。'],
  109: ['佐々木ことりです〜！よろしくお願いします♡ 楽しそうなメンツでよかった〜！','えー！みんな優しそう！なんか今夜楽しい予感しかない！'],
};

function getIntroLine(h, lineIdx){
  const lines = INTRO_LINES[h.id];
  if(lines) return lines[Math.min(lineIdx, lines.length-1)];
  // fallback by type keywords
  if(h.type.includes('陽キャ')||h.type.includes('ギャル'))
    return lineIdx===0 ? `${h.name.split(' ')[1]}で〜す！よろしく〜！` : 'みんなと仲よくなりたい！';
  if(h.type.includes('清楚')||h.type.includes('委員長'))
    return lineIdx===0 ? `${h.name.split(' ')[1]}です。よろしくお願いします。` : '……少し緊張してます。';
  return lineIdx===0 ? `${h.name.split(' ')[1]}といいます。よろしくどうぞ。` : 'よろしくお願いします。';
}

// ── ゲームステート ────────────────────────────────────
let currentHeroineIdx = 0;  // which heroine (0,1,2)
let lineIdx = 0;            // which line within current heroine
let isKanpaiShown = false;  // 乾杯ビート(自己紹介の前に1回)
const KANPAI_TEXT = '「「「かんぱーい！」」」──グラスの音が重なる。席も決まったところで、まずはお互いの自己紹介から始まった。';
const initHearts = {};
const initAir = calcInitialAir();
let tapping = false;

// ── 描画ヘルパー ──────────────────────────────────────
function buildDots(){
  const wrap = document.getElementById('vn-dots');
  wrap.innerHTML = heroineChars.map((_,i)=>
    `<div class="vn-dot${i===0?' active':''}" id="dot-${i}"></div>`
  ).join('');
}

function setHeroineDisplay(h, fadeIn){
  const charEl = document.getElementById('vn-char');
  if(fadeIn){
    charEl.classList.add('fade-out');
    setTimeout(()=>{
      _updateCharImg(h, charEl);
      charEl.classList.remove('fade-out');
    }, 300);
  } else {
    _updateCharImg(h, charEl);
  }
}

function _updateCharImg(h, charEl){
  const expr = (()=>{
    const imp = calcImpression(h);
    return imp==='hot'?'happy':imp==='warm'?'normal':'normal';
  })();
  charEl.innerHTML = `<img src="../images/h${h.id}_${expr}.png"
    onerror="this.style.display='none';this.parentNode.innerHTML='<div class=vn-char-fallback>${h.emoji||'👩'}</div>'"
    alt="${h.name}">`;
}

function setNameAndText(name, text, animate){
  const nameEl = document.getElementById('vn-namebox');
  const textEl = document.getElementById('vn-text');
  if(animate){
    nameEl.classList.add('fade-out');
    textEl.classList.add('fade-out');
    setTimeout(()=>{
      nameEl.textContent = name;
      textEl.textContent = text;
      nameEl.classList.remove('fade-out');
      textEl.classList.remove('fade-out');
    }, 200);
  } else {
    nameEl.textContent = name;
    textEl.textContent = text;
  }
}

function updateDots(idx){
  heroineChars.forEach((_,i)=>{
    const dot = document.getElementById('dot-'+i);
    if(!dot) return;
    dot.className = 'vn-dot' + (i<idx?' done': i===idx?' active':'');
  });
}

// ── TAP ハンドラ ──────────────────────────────────────
function handleTap(){
  // Narration screen visible → do nothing (button handles it)
  if(document.getElementById('narration-screen').classList.contains('show')) return;
  if(tapping) return;
  tapping = true;
  setTimeout(()=>{ tapping=false; }, 350);

  const h = heroineChars[currentHeroineIdx];
  if(!h){ showNarration(); return; }

  // 乾杯ビート → 最初の自己紹介へ
  if(!isKanpaiShown){
    isKanpaiShown = true;
    setNameAndText(h.name, getIntroLine(h, 0), true);
    return;
  }

  const maxLines = (INTRO_LINES[h.id]?.length || 2);

  if(lineIdx < maxLines - 1){
    // advance to next line for same heroine
    lineIdx++;
    setNameAndText(h.name, getIntroLine(h, lineIdx), true);
  } else {
    // done with this heroine → record heart, advance
    const imp = calcImpression(h);
    initHearts[h.id] = calcInitHeart(h, imp);

    currentHeroineIdx++;
    lineIdx = 0;

    if(currentHeroineIdx >= heroineChars.length){
      // all done
      showNarration();
    } else {
      const nextH = heroineChars[currentHeroineIdx];
      updateDots(currentHeroineIdx);
      setHeroineDisplay(nextH, true);
      setNameAndText(nextH.name, getIntroLine(nextH, 0), true);
    }
  }
}

// ── ナレーション ──────────────────────────────────────
function showNarration(){
  // fill any missing hearts
  heroineChars.forEach(h=>{
    if(!initHearts[h.id]){
      const imp = calcImpression(h);
      initHearts[h.id] = calcInitHeart(h, imp);
    }
  });

  const allV=[SELF_PARAMS.visu,...partyChars.map(c=>c.params.visu)];
  const maxV=Math.max(...allV);
  const highV=allV.filter(v=>v>=75).length;
  let text='';
  if(highV>=2)    text='こっち（男側）、見た目がいいのが揃ってる。女の子たちのテンションも高め。ただ、誰が誰を狙うかはまだ読めないな。';
  else if(maxV>=75) text='こっち（男側）にイケメンが一人いる。場が盛り上がりそうだけど、そいつに全部持っていかれるかもしれない。うまく立ち回りたい。';
  else if(initAir<35) text='正直、こっち（男側）は見た目で言うと地味めだ。第一印象は厳しそう。ここはコミュ力で巻き返すしかない。';
  else            text='こっち（男側）はごく普通のメンツ。有利でも不利でもない、あとは自分の動き次第だ。';

  document.getElementById('narration-text').textContent = text;

  // ── ヒロインシナジー情報を表示 ──
  const allMen = [
    { id:'self', name:'自分', circle: config.circle||'none', living: config.living||'home', part: config.part||'none' },
    ...partyChars.map(c => ({ id: c.id, name: c.name.split(/\s+/).pop(), circle: c.circle, living: c.living, part: c.part })),
  ];

  const synergyRows = [];
  heroineChars.forEach(h => {
    const hname = h.name.split(/\s+/).pop();
    allMen.forEach(m => {
      const sameCircle = h.circle !== 'none' && m.circle === h.circle;
      const samePart   = h.part   !== 'none' && m.part   === h.part;
      if(sameCircle){
        synergyRows.push({
          icon: '🔗',
          label: `${m.name} ↔ ${hname}：顔見知り`,
          desc: '会話が安定するが、深掘りの伸びしろは小さい。',
        });
      } else if(samePart){
        synergyRows.push({
          icon: '💼',
          label: `${m.name} ↔ ${hname}：バイト仲間`,
          desc: '話題に困らない。沈黙ペナルティなし。',
        });
      }
    });
  });

  const synergySection = document.getElementById('narr-synergy-section');
  const synergyList    = document.getElementById('narr-synergy-list');
  if(synergyRows.length > 0){
    synergyList.innerHTML = synergyRows.map(r => `
      <div class="narr-synergy-row">
        <div class="narr-synergy-icon">${r.icon}</div>
        <div class="narr-synergy-body">
          <div class="narr-synergy-label">${r.label}</div>
          <div class="narr-synergy-desc">${r.desc}</div>
        </div>
      </div>
    `).join('');
    synergySection.style.display = 'block';
  }

  // hide tap hint
  document.getElementById('tap-hint').style.display='none';

  // show narration screen
  document.getElementById('narration-screen').classList.add('show');
}

// ── 次へ ──────────────────────────────────────────────
function goNext(){
  localStorage.setItem('goukon_init_air',    JSON.stringify(initAir));
  localStorage.setItem('goukon_init_hearts', JSON.stringify(initHearts));
  location.href = 'goukon_day.html';
}

// ── 初期表示 ──────────────────────────────────────────
function init(){
  buildDots();
  const first = heroineChars[0];
  if(!first){
    goNext(); return;
  }
  setHeroineDisplay(first, false);
  setNameAndText('全員', KANPAI_TEXT, false);
}

init();
</script>
</body>
</html>
