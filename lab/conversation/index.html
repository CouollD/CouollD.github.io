<style>
  :root {
    color-scheme: light;
    --bg: #F4F4F4; --ink: #262626; --ink2: #545454; --ink3: #8C8C8C; --line: #BDBDBD;

    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1B1B1B; --ink: #ECECEC; --ink2: #B5B5B5; --ink3: #858585; --line: #444444;
      --card: #262626; --stage: #333333; --hero: #7A7A7A; --friend: #5E5E5E; --speak: #9A9A9A;
      --board: #202020; --board2: #555555; --table: #4A4A4A; --soft: #2B2B2B; --kw: #ECECEC; --kwInk: #1B1B1B;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1B1B1B; --ink: #ECECEC; --ink2: #B5B5B5; --ink3: #858585; --line: #444444;
    --card: #262626; --stage: #333333; --hero: #7A7A7A; --friend: #5E5E5E; --speak: #9A9A9A;
    --board: #202020; --board2: #555555; --table: #4A4A4A; --soft: #2B2B2B; --kw: #ECECEC; --kwInk: #1B1B1B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  button { font-family: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* 一覧 */
  .home { max-width: 520px; margin: 0 auto; padding: 18px 16px 40px; }
  .home h1 { font-size: 22px; margin: 4px 0 6px; }
  .home .lead { font-size: 13px; color: var(--ink2); line-height: 1.6; margin: 0 0 14px; }
  .mcard { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .mcard .hd { display: flex; align-items: baseline; gap: 8px; }
  .mcard .badge { font-weight: 800; font-size: 15px; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 1px 7px; }
  .mcard .nm { font-weight: 700; font-size: 16px; }
  .mcard .ref { font-size: 11px; color: var(--ink3); margin-left: auto; text-align: right; }
  .mcard dl { margin: 8px 0 10px; display: grid; grid-template-columns: 4.6em 1fr; gap: 3px 8px; font-size: 12.5px; line-height: 1.5; }
  .mcard dt { color: var(--ink3); }
  .mcard dd { margin: 0; }
  .mcard .go { display: flex; gap: 8px; }
  .mcard .go button { flex: 1; min-height: 42px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; cursor: pointer; }
  .mcard .go button.sub { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 400; }
  .mcard .go button:disabled { opacity: .4; cursor: default; }
  .mcard .go.prof { flex-direction: column; }
  .mcard .go button.pbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 8px 12px; text-align: left; font-weight: 400; }
  .mcard .go button.pbtn b { font-size: 14px; }
  .mcard .go button.pbtn span { font-size: 13px; }
  .mcard .go button.pbtn small { font-size: 11px; opacity: .75; }
  .home .foot { font-size: 11.5px; color: var(--ink3); line-height: 1.6; margin-top: 16px; }

  /* 遊ぶ画面（案6の灰色） */
  .app { max-width: 462px; height: 100%; margin: 0 auto; padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px; }
  .top { display: flex; align-items: center; gap: 8px; height: 34px; flex: none; }
  .top .back { flex: none; white-space: nowrap; height: 32px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 13px; padding: 0 10px; cursor: pointer; }
  .top .ttl { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--ink2); flex: none; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--ink2); }
  .tools { position: relative; flex: none; }
  .tools > button { width: 40px; height: 32px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 16px; cursor: pointer; }
  .menu { position: absolute; right: 0; top: 38px; z-index: 30; display: flex; flex-direction: column; gap: 4px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.18); min-width: 190px; }
  .menu button { min-height: 36px; border: none; background: transparent; border-radius: 6px; font-size: 13px; text-align: left; padding: 0 10px; cursor: pointer; }
  .menu button:hover, .menu button:focus-visible { background: var(--bg); }

  .stage { position: relative; flex: 1 1 auto; min-height: 300px; background: var(--stage); border-radius: 12px; overflow: hidden; cursor: pointer; }
  .shade { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .6s; pointer-events: none; z-index: 8; }
  .board { position: absolute; left: 30px; right: 30px; top: 16px; height: 80px; background: var(--board); border: 5px solid var(--board2); }
  .table { position: absolute; left: 0; right: 0; bottom: 150px; height: 26px; background: var(--table); }
  .fig { position: absolute; top: 86px; bottom: 150px; width: 34%; transition: filter .3s, opacity .3s; }
  .fig .head { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #FFFFFF; }
  .fig .body { position: absolute; left: 0; right: 0; top: 58px; bottom: 0; border-radius: 60px 60px 0 0;
    display: flex; flex-direction: column; align-items: center; padding-top: 30px; gap: 4px; font-size: 11px; color: #FFFFFF; }
  .fig .meter { font-size: 10.5px; opacity: .95; letter-spacing: .5px; }
  .fig.h .head, .fig.h .body { background: var(--hero); }
  .fig.f .head, .fig.f .body { background: var(--friend); }
  .fig.dim { filter: blur(2.5px); opacity: .8; }
  .fig.far { filter: blur(5px); opacity: .6; }
  .fig.speak { filter: none; opacity: 1; z-index: 3; }
  .fig.speak .head, .fig.speak .body { background: var(--speak); }
  .fig.watch { filter: none; opacity: 1; }
  #fig-101 { left: -2%; } #fig-102 { left: 33%; z-index: 2; } #fig-103 { left: 67%; }
  #fig-1 { left: -34%; top: 130px; bottom: 120px; width: 44%; z-index: 4; }
  #fig-4 { left: 90%; top: 130px; bottom: 120px; width: 44%; z-index: 4; }
  .fig.f.far { filter: blur(3.5px); opacity: .75; }
  #fig-1.speak { left: -24%; } #fig-4.speak { left: 80%; }
  .note { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); font-size: 22px; font-weight: 800; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--ink); border-radius: 14px; padding: 0 8px; z-index: 12; pointer-events: none;
    animation: rise 1.8s ease-out forwards; white-space: nowrap; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 8px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -18px); } }

  .win { position: absolute; left: 0; right: 0; bottom: 0; min-height: 138px; background: var(--card); border: 1.5px solid var(--ink);
    border-radius: 12px; padding: 24px 14px 18px; z-index: 9; }
  .win.narr { background: var(--soft); border-style: dashed; border-color: var(--ink3); }
  .plate { position: absolute; left: 12px; top: -14px; display: flex; align-items: center; gap: 6px; }
  .who { background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
  .to { background: var(--card); border: 1.5px solid var(--ink); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
  .act { background: var(--card); border: 1.5px solid var(--ink3); font-size: 11px; padding: 2px 8px; border-radius: 4px; }
  .tag { position: absolute; right: 12px; top: -11px; background: var(--card); border: 1.5px solid var(--ink3); font-size: 11px; padding: 2px 10px; border-radius: 11px; }
  .text { font-size: 15px; line-height: 1.75; }
  .win.narr .text { color: var(--ink2); font-size: 14px; }
  .next { position: absolute; right: 12px; bottom: 6px; font-size: 11px; color: var(--ink3); }
  .tbar { position: absolute; left: 12px; bottom: 6px; height: 3px; width: 0; background: var(--ink3); border-radius: 2px; }
  .kw { font: inherit; font-weight: 700; background: var(--kw); color: var(--kwInk); border: none; border-radius: 4px; padding: 0 4px; margin: 0 1px; cursor: pointer; }
  .kw.used { background: transparent; color: var(--ink3); text-decoration: line-through; cursor: default; }
  .think { display: inline-block; letter-spacing: 3px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .cmds { flex: none; min-height: 112px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; gap: 6px; }
  .cmd { min-height: 50px; border: 1.5px solid var(--ink3); background: var(--card); border-radius: 10px; font-size: 15px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 4px 8px; text-align: center; }
  .cmd small { font-size: 10px; font-weight: 400; color: var(--ink2); }
  .cmd.line { font-size: 14px; font-weight: 400; align-items: flex-start; text-align: left; padding: 8px 12px; min-height: 44px; }
  .cmd.quiet { border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 400; min-height: 42px; }
  .cmd.pill { border-radius: 24px; border-color: var(--ink); }
  .cmd.card { border-style: dashed; }
  .cmd:disabled { opacity: .35; cursor: default; }
  .hint { font-size: 11px; color: var(--ink3); text-align: center; }
  .bar { display: flex; align-items: center; gap: 10px; min-height: 60px; }
  .bar .hint { flex: 1 1 auto; text-align: left; }
  .cut { height: 52px; padding: 0 22px; border: 2px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 26px; font-size: 15px; font-weight: 700; cursor: pointer; flex: none; }
  .panelcmd { display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 1.5px solid var(--ink); border-radius: 14px; padding: 8px 10px 10px; }
  .panelcmd .top2 { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink2); }
  .panelcmd .top2 button { border: none; background: transparent; font-size: 11px; color: var(--ink2); cursor: pointer; }
  .clock { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .clock > i { display: block; height: 100%; background: var(--ink); width: 100%; }
  .mbar { position: relative; display: inline-block; width: 74px; height: 9px; border: 1px solid var(--ink3); border-radius: 5px; overflow: hidden;
    background: linear-gradient(to right, var(--line) 0 15%, transparent 15% 70%, var(--line) 70% 100%); }
  .mbar > i { display: block; height: 100%; background: var(--ink2); transition: width .4s; }
  .cue { position: absolute; width: max-content; top: 64px; transform: translateX(-50%); z-index: 11; border: 1.5px dashed var(--ink); background: var(--card); color: var(--ink);
    border-radius: 14px; font-size: 12px; font-weight: 700; padding: 5px 12px; cursor: pointer; animation: pulse 1.1s ease-in-out infinite; }
  .cue.table { top: auto; bottom: 156px; }
  .cue.done { border-style: solid; animation: none; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.08); } }
  .kwq { background: var(--kw); color: var(--kwInk); border-radius: 4px; padding: 0 3px; font-weight: 700; }
  .votes { display: grid; gap: 3px; font-size: 13px; }
  .vrow { display: grid; grid-template-columns: 4.5em 1.2em 1fr; align-items: center; animation: vin .3s ease-out; }
  @keyframes vin { from { opacity: 0; transform: translateY(4px); } }

  #sheet-log { z-index: 25; }
  .tip { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 13; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.55; animation: vin .3s ease-out; cursor: pointer; }
  .tip.whisper { background: var(--card); color: var(--ink); border: 1.5px dashed var(--ink3); }
  .tip.whisper b { border-color: var(--ink3); }
  .fig.gone { opacity: 0 !important; filter: none !important; pointer-events: none; transition: opacity .6s; }
  /* 場所：背景と左上の札（店の外・カラオケは夜の色にする） */
  .stage { transition: background .8s; }
  .stage[data-scene="out"], .stage[data-scene="station"] { background: linear-gradient(180deg, #1F2740 0%, #36405E 70%, #4A4F63 100%); }
  .stage[data-scene="karaoke"] { background: radial-gradient(circle at 18% 22%, rgba(255, 110, 190, .35), transparent 38%), radial-gradient(circle at 82% 28%, rgba(110, 170, 255, .35), transparent 40%), #2F2540; }
  .stage[data-place]:not([data-place=""])::after { content: attr(data-place); position: absolute; left: 10px; top: 10px; z-index: 5; font-size: 12px; padding: 2px 10px; border-radius: 10px; background: var(--card); color: var(--ink); border: 1.5px solid var(--ink3); pointer-events: none; }
  .lc-st { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); font-size: 12px; font-weight: 700; padding: 2px 4px; }
  .tip b { display: inline-block; font-size: 10.5px; border: 1px solid var(--bg); border-radius: 8px; padding: 0 6px; margin-right: 6px; }
  .phone { position: absolute; inset: 8px; z-index: 12; background: var(--card); border: 1.5px solid var(--ink); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; cursor: default; }
  .ph-top { padding: 10px 12px; font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--line); background: var(--bg); }
  .ph-body { flex: 1; overflow: auto; padding: 8px 10px; }
  /* ログ：3案 */
  .panel.log { padding-top: 0; }
  .loghead { position: sticky; top: 0; z-index: 2; background: var(--card); display: flex; align-items: center; gap: 8px; padding: 14px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .loghead h2 { margin: 0; font-size: 17px; }
  .logtabs { display: flex; gap: 4px; margin-left: 4px; }
  .ltab { border: 1px solid var(--line); background: transparent; border-radius: 14px; font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .ltab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .lclose { margin-left: auto; border: none; background: transparent; font-size: 12px; color: var(--ink2); cursor: pointer; }
  /* 複合 */
  .lm-card { border: 1px solid var(--line); border-radius: 12px; margin: 0 0 8px; overflow: hidden; }
  .lm-card > summary { list-style: none; cursor: pointer; padding: 9px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--bg); }
  .lm-card > summary::-webkit-details-marker { display: none; }
  .lm-card > summary::after { content: '▸ 開く'; font-size: 10.5px; color: var(--ink3); }
  .lm-card[open] > summary::after { content: '▾ 閉じる'; }
  .lm-h { font-weight: 700; font-size: 14px; }
  .lm-k { font-size: 11.5px; color: var(--ink2); }
  .lm-body { padding: 4px 10px 10px; }
  .logtabs { flex-wrap: wrap; }
  /* A チャット */
  .lc-h { text-align: center; margin: 14px 0 8px; } .lc-h span { font-size: 11px; color: var(--ink2); background: var(--bg); border-radius: 10px; padding: 2px 10px; }
  .lc-row { display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; }
  .lc-row.me { justify-content: flex-end; }
  .lc-av { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--hero); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .lc-col { max-width: 78%; }
  .lc-row.me .lc-col { display: flex; flex-direction: column; align-items: flex-end; }
  .lc-name { font-size: 10.5px; color: var(--ink2); margin: 0 0 2px 2px; } .lc-name i { font-style: normal; color: var(--ink3); }
  .lc-b { font-size: 13.5px; line-height: 1.5; background: var(--bg); border-radius: 4px 12px 12px 12px; padding: 6px 10px; }
  .lc-row.me .lc-b { background: var(--ink); color: var(--bg); border-radius: 12px 4px 12px 12px; }
  .lc-act { font-size: 10px; color: var(--ink3); margin-top: 2px; }
  .lc-n { text-align: center; font-size: 11.5px; color: var(--ink3); margin: 6px 12px; }
  .lc-fx { text-align: center; font-size: 10.5px; color: var(--ink2); margin: 2px 0 8px; }
  /* B 台本 */
  .ls-h { position: sticky; top: 52px; background: var(--card); font-size: 12px; font-weight: 700; color: var(--ink2); padding: 8px 0 4px; border-bottom: 1px dashed var(--line); margin: 6px 0; }
  .ls-row { display: grid; grid-template-columns: 4.6em 1fr; gap: 8px; padding: 4px 4px; font-size: 13.5px; line-height: 1.55; }
  .ls-row.me { background: var(--bg); border-radius: 6px; }
  .ls-name { font-weight: 700; text-align: right; font-size: 12px; padding-top: 1px; }
  .ls-name small { display: block; font-weight: 400; font-size: 10px; color: var(--ink3); }
  .ls-n { font-size: 12px; color: var(--ink3); padding: 3px 4px 3px 5.4em; }
  .ls-fx { font-size: 10.5px; color: var(--ink2); padding: 0 4px 4px 5.4em; }
  /* C 振り返り */
  .lr-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; }
  .lr-h { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .lr-k { font-size: 12px; color: var(--ink2); margin: 2px 0; }
  .lr-acts { margin: 6px 0; padding-left: 18px; font-size: 13px; line-height: 1.5; } .lr-acts li { margin: 4px 0; } .lr-acts span { color: var(--ink2); font-size: 12px; }
  .lr-card details { margin-top: 6px; font-size: 12.5px; } .lr-card summary { cursor: pointer; color: var(--ink2); font-size: 12px; }
  .lr-card details p { margin: 4px 0; } .lr-card details p.n { color: var(--ink3); }
  .acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .panel { width: 100%; max-width: 440px; max-height: 84%; overflow: auto; background: var(--card); border-radius: 16px 16px 0 0; padding: 18px 16px 24px; }
  .panel h2 { margin: 0 0 8px; font-size: 20px; }
  .panel h3 { margin: 14px 0 4px; font-size: 13px; color: var(--ink2); }
  .panel p { margin: 6px 0; line-height: 1.6; font-size: 14px; }
  .panel .small { font-size: 12px; color: var(--ink2); }
  .hearts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .hearts div { border: 1px solid var(--line); border-radius: 8px; padding: 6px; text-align: center; font-size: 12px; }
  .hearts b { display: block; font-size: 16px; }
  .log p { margin: 0 0 8px; font-size: 13px; line-height: 1.55; }
  .log .r { color: var(--ink3); font-size: 11px; margin-top: 12px; }
  .log .n { color: var(--ink3); }
  .dbg { position: absolute; left: 8px; top: 8px; z-index: 10; background: var(--card); opacity: .94; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; font-size: 10.5px; line-height: 1.5; font-variant-numeric: tabular-nums; }
</style>

<div class="home" id="home">
  <h1>会話の方式くらべ</h1>
  <p class="lead">同じ合コン（乾杯のあと、約5分）を、いろいろな方式で遊べます。人・話題・事情はどれも同じです。台詞と数値はすべて仮のものです。</p>
  <div id="mlist"></div>
  <p class="foot">どの方式も、最後に結果と「この方式で1夜ぶんに要る台詞の量」が出ます。Bは、遊ぶ人の Claude の利用枠を使います（はじめの1回だけ許可を聞かれます）。</p>
</div>

<div class="app" id="play" hidden>
  <div class="top">
    <button type="button" class="back" id="btn-back">‹ 一覧</button>
    <div class="ttl" id="ttl"></div>
    <div class="dots" id="dots"></div>
    <div class="tools">
      <button type="button" id="btn-menu" aria-label="メニュー" aria-expanded="false">…</button>
      <div class="menu" id="menu" hidden></div>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="board"></div>
    <div class="table"></div>
    <div class="fig h dim" id="fig-101"><div class="head">あ</div><div class="body"><span data-expr>真顔</span><span class="meter" data-meter></span></div></div>

// ═══════════════════════════════════════════════════════════════
// js/v0/night-engine.js — 遊べる版（v0）の1夜の進行（2026-09-28）
// 依存: HEROINES（data/gamedata.js）, CardTopics（js/core/card-topics.js）。DOM は触らない
//
// ルールは docs/rules-v0.md。数値は tools/sim_round.js と同じ（2000夜で 読んで掘る54%・読まずに掘る23%）。
// 画面は「出来事（events）」を順に読み、「決めること（decision）」が来たら選択肢を出す。
//
//   const night = NightEngine.create({ HEROINES, CardTopics }).newNight(seed);
//   night.advance();                  // 次の決めることまで進む
//   night.events                      // 起きたことの列（画面はここを読む）
//   night.decision                    // { kind:'start'|'react'|'rescue'|'end', options, speaker }
//   night.choose({ cmd:'open', topic }) / ({ cmd:'go'|'dig'|'tease'|'wait' })
// ═══════════════════════════════════════════════════════════════
const NightEngine = (() => {
  'use strict';

  const V0_HEROINES = [101, 102, 103];
  const V0_FRIENDS = [1, 4];            // けんた・けいた
  // 話題は「持ち主」がいる（card-topics.js の require）。あるある話題は、その事情の人しか出さない（9/30）
  //   自分  = 塾バイト・実家・文化系サークル → 入り口3つ＋自分のあるある3つ
  //   けんた = 居酒屋・一人暮らし（仕送りあり）・体育会 ／ けいた = カフェ・一人暮らし（仕送りなし）・文化系
  const INTROS = ['baito_intro', 'sumai_intro', 'jimoto_intro'];
  const PLAYER_TOPICS = ['baito_intro', 'sumai_intro', 'jimoto_intro', 'juku_tantou', 'jikka_juku', 'culture_nushi'];
  const FRIEND_TOPICS = { 1: ['sports_asaren', 'send_shiokuri', 'izakaya_kinyou'], 4: ['cafe_latte', 'nosend_denki'] };
  const V0_TOPICS = PLAYER_TOPICS.concat(FRIEND_TOPICS[1], FRIEND_TOPICS[4]);

  const CFG = {
    H0: 10, HSTEP: 20, MW: 0.03, APPEAL: [-2, -1, 0, 1], NOISE: 0.2,
    DIG: [0, 5, 9, 14],                  // 9/30 話題に持ち主と順番を付けたので、伸びを sim_depth.js の値に戻した
    GO_HEART: 2, GO_SPILL: 0.5, GO_AIR: 3,
    FAIL_HEART: 6, FAIL_AIR: 10,
    DEEP_DRAIN: [0, 0, 3, 6], TEASE_AIR: 12, OPEN_HEART: [0, 0, 1, 3], AIR_DECAY: 2,
    FRIEND_DIG_AIR: 5, FRIEND_GO: 0.5,
    ROUNDS: 8, HOME: 55, CONTACT_AVG: 45, AIR0: 60,
    self: { head: 50, air: 50, mental: 50 },
  };

  function rng(seed) {                    // 種を混ぜてから使う（連番の種だと最初の値が偏るため）
    let s = (seed ^ 0x9E3779B9) >>> 0;
    s = Math.imul(s ^ (s >>> 16), 0x85EBCA6B) >>> 0; s = Math.imul(s ^ (s >>> 13), 0xC2B2AE35) >>> 0; s = (s ^ (s >>> 16)) >>> 0 || 1;
    return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  }
  function gauss(r) { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const isH = s => V0_HEROINES.includes(s);
  const isF = s => V0_FRIENDS.includes(s);

  function create(deps) {
    const { HEROINES, CardTopics } = deps;
    const TOPICS = CardTopics.TOPICS;
    const H = id => HEROINES.find(h => h.id === id);
    const ap = (tid, hid) => CardTopics.score(TOPICS[tid], H(hid));
    const MAXD = {};
    for (const id of Object.keys(TOPICS)) {
      const reach = HEROINES.filter(h => CardTopics.score(TOPICS[id], h) >= 2).length;
      MAXD[id] = reach >= 4 ? 2 : 3;
    }

    function newNight(seed, overrides) {
      const cfg = Object.assign({}, CFG, overrides || {});
      const r = rng(seed == null ? (Date.now() >>> 0) : seed);
      const hearts = {}, noise = {};
      V0_HEROINES.forEach(id => { hearts[id] = 15 + Math.floor(r() * 21); noise[id] = gauss(r) * cfg.NOISE; });

      const n = {
        cfg, seed, heroines: V0_HEROINES.slice(), friends: V0_FRIENDS.slice(),
        hearts, noise, air: cfg.AIR0, friendAff: { 1: 50, 4: 50 },
        hand: PLAYER_TOPICS.slice(), friendPool: { 1: FRIEND_TOPICS[1].slice(), 4: FRIEND_TOPICS[4].slice() },
        opened: new Set(), topic: null,
        round: 0, phase: 'roundStart', acted: false, chain: [], ci: 0,
        events: [], decision: null, result: null, over: false,
        expr: {}, stats: { acts: 0, digs: 0, digOk: 0, fails: 0, maxDepth: 0 },
      };
      V0_HEROINES.forEach(h => n.expr[h] = '真顔');
      // 出来事には、その瞬間の場の様子を写しておく（画面は出来事を1つずつ再生するので、今の値を見ると先走る）
      const emit = e => {
        e.round = n.round; e.air = n.air; e.exprs = Object.assign({}, n.expr);
        e.topicNow = n.topic ? { id: n.topic.id, depth: n.topic.depth, max: n.topic.max, partner: n.topic.partner } : null;
        n.events.push(e); return e;
      };

      // ── 判定 ────────────────────────────────────────────────
      function tolerance(hid, tid) {
        const c = n.cfg;
        return (n.hearts[hid] - c.H0) / c.HSTEP + (H(hid).params.mental - 60) * c.MW + c.APPEAL[ap(tid, hid)] + n.noise[hid];
      }
      const gainMult = () => (0.6 + n.air / 150) * (0.8 + n.cfg.self.head / 250);
      const honmei = () => V0_HEROINES.slice().sort((a, b) => n.hearts[b] - n.hearts[a])[0];
      function canDig(hid) {
        const t = n.topic;
        return !!t && !t.strained && t.depth < t.max && t.depth + 1 <= tolerance(hid, t.id);
      }
      // 表情（サイン）: 空気読みの精度で、掘れるかどうかを匂わせる
      function signalExpr(hid) {
        const t = n.topic;
        if (t.strained) return '困り顔';
        if (ap(t.id, hid) === 0) return 'つまらない';
        const truth = canDig(hid);
        const shown = n.r() < 0.55 + n.cfg.self.air / 200 ? truth : !truth;
        return shown ? 'はにかみ' : '真顔';
      }
      function settleOthers(except) {
        const t = n.topic;
        V0_HEROINES.forEach(h => {
          if (h === except) return;
          if (!t) { n.expr[h] = '真顔'; return; }
          if (t.depth >= 2 && t.partner && t.partner !== h) n.expr[h] = 'つまらない';
          else if (ap(t.id, h) === 0) n.expr[h] = 'つまらない';
          else if (n.expr[h] === '困り顔') n.expr[h] = '真顔';
        });
      }

      // ── 話題 ────────────────────────────────────────────────
      // あるある話題は、入り口でその事情が出てから（バイト→「バイト何してる」、住まい→「実家？一人暮らし？」）
      function unlocked(tid) {
        const req = TOPICS[tid].require || {};
        if (req.part && !n.opened.has('baito_intro')) return false;
        if (req.living && !n.opened.has('sumai_intro')) return false;
        return true;
      }
      function openTopic(tid, by) {
        const known = PLAYER_TOPICS.includes(tid);              // 自分の話題か、誰でも知っている入り口なら分かる
        n.hand = n.hand.filter(x => x !== tid);
        V0_FRIENDS.forEach(f => { n.friendPool[f] = n.friendPool[f].filter(x => x !== tid); });
        n.opened.add(tid);
        // 話すこと＝食いつきの強さ。入り口の話題はみんなに聞いているので、全員がひとことは答える
        const left = {}; V0_HEROINES.forEach(h => left[h] = INTROS.includes(tid) ? Math.max(ap(tid, h), 1) : ap(tid, h));
        n.topic = { id: tid, by, openedRound: n.round, depth: 0, max: MAXD[tid], strained: false, wall: null, known, partner: null,
                    reached: {}, left, part: new Set(), lost: 0, said: {}, friendSaid: false, talk: {}, friendAnswered: false };
        V0_HEROINES.forEach(h => { n.hearts[h] = Math.min(100, n.hearts[h] + n.cfg.OPEN_HEART[ap(tid, h)]); });
        emit({ t: 'open', by, topic: tid, known });
        settleOthers(null);
        if (!known) emit({ t: 'narr', key: 'unknown', topic: tid });
      }
      function alive() {
        const t = n.topic; if (!t) return false;
        if (t.depth >= 2 && t.partner) return t.left[t.partner] > 0;
        return V0_HEROINES.some(h => t.left[h] > 0 && (ap(t.id, h) >= 2 || h === t.partner));
      }
      // 友達が話題を出す: 自分のあるある（事情が出たあと）か、まだ出ていない入り口
      function npcOpen() {
        const pool = [];
        V0_FRIENDS.forEach(f => n.friendPool[f].filter(unlocked).forEach(tid => pool.push([tid, f])));
        n.hand.filter(tid => INTROS.includes(tid)).forEach(tid => pool.push([tid, V0_FRIENDS[Math.floor(n.r() * V0_FRIENDS.length)]]));
        if (!pool.length) { emit({ t: 'narr', key: 'stall' }); n.topic = null; return false; }
        const [tid, fid] = pool[Math.floor(n.r() * pool.length)];
        openTopic(tid, fid);
        return true;
      }
      function buildChain() {
        const t = n.topic; if (!t) return [];
        if (t.depth >= 2 && t.partner) { t.leadNext = null; return t.left[t.partner] > 0 ? [t.partner] : []; }
        // 通じていない子（食いつき1以下）が口を挟むのは、話題が出たラウンドだけ
        const hs = V0_HEROINES.filter(h => t.left[h] > 0 && (ap(t.id, h) >= 2 || h === t.partner || t.openedRound === n.round))
          .sort((a, b) => (t.left[b] - t.left[a]) || (n.hearts[b] - n.hearts[a]));
        const out = hs.slice();
        if (t.leadNext && out.includes(t.leadNext)) { out.splice(out.indexOf(t.leadNext), 1); out.unshift(t.leadNext); }   // 掘られた子が先に答える
        t.leadNext = null;
        if (out.length && !t.friendSaid && n.r() < n.cfg.FRIEND_GO) out.splice(1, 0, V0_FRIENDS[n.r() < 0.5 ? 0 : 1]);   // 友達が割り込むのは1つの話題で1回まで
        return out;
      }
      function utter(s) {
        const t = n.topic;
        if (isH(s)) {
          t.left[s]--; t.part.add(s);
          const ld = (t.depth === 0 || t.partner === s) ? t.depth : 0;   // 掘られていない子は、深い話をしない（台詞の深さ）
          const key = ld + ':' + s; t.said[key] = (t.said[key] || 0) + 1;
          n.expr[s] = signalExpr(s); settleOthers(s);
          // 話す相手: 自分が一度でも反応した子は、以降こっちに話す。そうでなければ話題を出した人に
          const to = (t.partner === s || t.talk[s]) ? 'P' : t.by;
          emit({ t: 'say', who: s, to, topic: t.id, depth: ld, topicDepth: t.depth, count: t.said[key], appeal: ap(t.id, s),
                 strained: t.strained, expr: n.expr[s], lead: n.ci === 1, dugBy: t.partner === s ? 'P' : null });
          // 友達に聞き返したら、友達が答える（1つの話題で1回）
          if (ld === 0 && t.said[key] === 2 && isF(to) && !t.friendAnswered) { t.friendAnswered = true; emit({ t: 'friend', who: to, mode: 'answer', topic: t.id, to: s }); }
        } else {
          emit({ t: 'friend', who: s, mode: 'go', topic: t.id, playerOpened: t.by === 'P', first: !t.friendSaid });
          t.friendSaid = true;
        }
      }

      // ── 自分の手 ────────────────────────────────────────────
      function legal(s) {
        const t = n.topic, a = ['tease'];
        if (!t || !t.known) return a;
        a.unshift('go');
        if (isF(s) || (t.depth < t.max && !t.strained)) a.splice(1, 0, 'dig');
        return a;
      }
      function tease(s, free) {
        const c = n.cfg, t = n.topic;
        emit({ t: 'player', cmd: free ? 'rescue' : 'tease', to: s, topic: t.id, depth: t.depth });
        if (t.depth === 0 && !t.strained) { n.air -= 3; emit({ t: 'narr', key: 'slip' }); return; }
        if (t.strained && t.lost && isH(s)) { n.hearts[s] += t.lost * (c.self.mental / 100); t.lost = 0; }
        t.depth = Math.max(0, t.depth - 1); t.strained = false; n.air += c.TEASE_AIR;
        if (isH(s)) { n.expr[s] = '笑'; emit({ t: 'react', who: s, kind: free ? 'rescue' : 'tease', expr: '笑' }); }
        else emit({ t: 'friend', who: s, mode: 'teased', topic: t.id });
        settleOthers(s);
      }
      // 戻り値: 外れたら true
      function act(s, cmd) {
        const c = n.cfg, t = n.topic, gm = gainMult();
        n.stats.acts++;
        if (cmd === 'tease') { tease(s, false); return false; }
        emit({ t: 'player', cmd, to: s, topic: t.id, depth: t.depth });
        if (isH(s)) t.talk[s] = 'P';
        if (isF(s)) {
          if (cmd === 'go') { t.part.forEach(h => n.hearts[h] += c.GO_SPILL * gm); n.air += c.GO_AIR; n.friendAff[s] += 2;
                              emit({ t: 'friend', who: s, mode: 'backed', topic: t.id }); }
          else { n.air += c.FRIEND_DIG_AIR; n.friendAff[s] += 5; emit({ t: 'friend', who: s, mode: 'dug', topic: t.id });
                 emit({ t: 'friend', who: s, mode: 'story', topic: t.id }); }
          return false;
        }
        if (cmd === 'go') {
          n.hearts[s] += (ap(t.id, s) >= 2 ? c.GO_HEART : c.GO_HEART / 2) * gm;
          t.part.forEach(h => { if (h !== s) n.hearts[h] += c.GO_SPILL * gm; });
          n.air += c.GO_AIR;
          n.expr[s] = '笑';
          emit({ t: 'react', who: s, kind: 'go', expr: '笑' });
          return false;
        }
        // 掘る
        n.stats.digs++;
        const want = t.depth + 1;
        if (canDig(s)) {
          n.stats.digOk++; t.depth = want; t.partner = s; t.left[s] += 1;
          if (want > (t.reached[s] || 0)) { n.hearts[s] += c.DIG[want] * gm; t.reached[s] = want; }
          n.stats.maxDepth = Math.max(n.stats.maxDepth, want);
          // 答えは次のラウンドの頭で話す（その場では、少し考える間だけ）。自分はその答えに反応できる
          t.leadNext = s;
          n.expr[s] = 'はにかみ'; settleOthers(s);
          emit({ t: 'react', who: s, kind: 'ok', expr: 'はにかみ' });
          if (want === 2 && !t.twoWorldShown) { t.twoWorldShown = true; emit({ t: 'narr', key: 'twoWorld' }); }
          return false;
        }
        n.stats.fails++; t.strained = true; t.wall = want; t.lost = c.FAIL_HEART;
        n.hearts[s] -= c.FAIL_HEART; n.air -= c.FAIL_AIR;
        n.expr[s] = '困り顔';
        emit({ t: 'react', who: s, kind: 'fail', expr: '困り顔' });
        return true;
      }

      // ── 進行 ────────────────────────────────────────────────
      function startRound() {
        n.round++; n.acted = false; n.chain = []; n.ci = 0;
        emit({ t: 'round', n: n.round, of: n.cfg.ROUNDS });
        if (n.topic && n.topic.leadNext) {                 // 相手が答えている途中は、話題を変えられない
          n.decision = null; n.chain = buildChain(); n.ci = 0; n.phase = 'chain';
          runChain(); return;
        }
        const opts = n.hand.filter(unlocked).map(tid => ({ cmd: 'open', topic: tid, known: true }));
        opts.push({ cmd: 'wait' });
        n.decision = { kind: 'start', options: opts };
        n.phase = 'start';
      }
      function endRound() {
        n.air -= n.cfg.AIR_DECAY + (n.topic ? n.cfg.DEEP_DRAIN[n.topic.depth] : 0);
        V0_HEROINES.forEach(h => n.hearts[h] = clamp(n.hearts[h], 0, 100));
        n.air = clamp(n.air, 0, 100);
        emit({ t: 'roundEnd', air: n.air, acted: n.acted });
        if (n.air <= 0) { n.over = true; emit({ t: 'narr', key: 'cold' }); }
        if (n.over || n.round >= n.cfg.ROUNDS) {
          if (!n.over && n.topic && n.topic.leadNext) { const s = n.topic.leadNext; n.topic.leadNext = null; n.ci = 1; utter(s); }   // 最後に掘った答えは、お開きの前に聞ける
          finish();
        } else n.phase = 'roundStart';
      }
      function finish() {
        const F = honmei(), hF = n.hearts[F];
        n.result = n.over ? 'none' : hF >= n.cfg.HOME ? 'home' : ((n.air + hF) / 2 >= n.cfg.CONTACT_AVG ? 'contact' : 'none');
        emit({ t: 'end', result: n.result, honmei: F, reachedDepth3: n.stats.maxDepth >= 3 });
        n.decision = { kind: 'end', result: n.result, honmei: F };
        n.phase = 'end';
      }
      function runChain() {
        while (n.ci < n.chain.length) {
          const s = n.chain[n.ci++];
          utter(s);
          if (!n.acted) {
            const opts = legal(s).map(cmd => ({ cmd })); opts.push({ cmd: 'wait' });
            n.decision = { kind: 'react', speaker: s, options: opts, last: n.ci >= n.chain.length };
            n.phase = 'react';
            return;
          }
        }
        endRound();
      }
      function advance() {
        if (n.phase === 'roundStart') startRound();
        else if (n.phase === 'chain') runChain();
        return n.decision;
      }
      function choose(ch) {
        const d = n.decision; if (!d) return;
        if (n.phase === 'start') {
          n.decision = null;
          if (ch.cmd === 'open' && n.hand.includes(ch.topic) && unlocked(ch.topic)) {
            emit({ t: 'player', cmd: 'open', topic: ch.topic });
            openTopic(ch.topic, 'P'); n.acted = true; n.stats.acts++;
          } else if (!alive()) npcOpen();
          n.chain = buildChain(); n.ci = 0;
          n.phase = 'chain';
          if (!n.chain.length && n.topic) emit({ t: 'narr', key: 'stall' });
          runChain();
        } else if (n.phase === 'react') {
          const s = d.speaker; n.decision = null;
          if (ch.cmd === 'wait') {
            if (n.topic && !n.topic.known) { n.topic.known = true; emit({ t: 'narr', key: 'learned', topic: n.topic.id }); }
            n.phase = 'chain'; runChain(); return;
          }
          if (!legal(s).includes(ch.cmd)) { n.decision = d; return; }
          const failed = act(s, ch.cmd);
          n.acted = true;
          if (failed) { n.decision = { kind: 'rescue', speaker: s, options: [{ cmd: 'tease' }, { cmd: 'wait' }] }; n.phase = 'rescue'; return; }
          n.ci = n.chain.length; endRound();
        } else if (n.phase === 'rescue') {
          const s = d.speaker; n.decision = null;
          if (ch.cmd === 'tease') tease(s, true);          // 外した直後の茶化すは数えない
          else emit({ t: 'narr', key: 'let' });
          n.ci = n.chain.length; endRound();
        }
      }

      n.r = r;
      n.advance = advance; n.choose = choose; n.legal = legal; n.honmei = honmei;
      n.appeal = ap; n.maxDepth = id => MAXD[id]; n.canDig = canDig;   // 画面のデバッグ表示と試験用
      n.tolerance = tolerance; n.unlocked = unlocked; n.alive = alive;
      return n;
    }
    return { newNight, CFG, V0_HEROINES, V0_FRIENDS, V0_TOPICS, PLAYER_TOPICS, FRIEND_TOPICS, INTROS };
  }

  return { create, CFG, V0_HEROINES, V0_FRIENDS, V0_TOPICS, PLAYER_TOPICS, FRIEND_TOPICS, INTROS };
})();

if (typeof module !== 'undefined') module.exports = NightEngine;

      dig:   ['「てか、なんでそれ気になったの」', '「そっちは？ そういうのある？」'],

    friend: {
      go:    ['「いや、それはほんとにそう」', '「それな。俺も横で見てたし」'],

    },
    rescue:  ['「ごめん、今のなし。忘れて」', '「あ、ごめん。変なこと聞いた」'],
  };
  const FRIEND = {
    back:   { 1: ['「それな！ わかるわー」', '「うわ、あるある！」'], 4: ['「あー、あるある」', '「それ、ちょっと分かる」'] },

              4: ['「……前に店で、お客さんに店長と間違われたことある」', '「……こいつが寝てる間に、俺が全部片付けたこともある」'] },

  };
  // あるある話題を出す人は、先に自分の事情を言う（唐突にならないように）
  const BRIDGE = {
    juku_tantou:    '「俺も塾で教えてるんだけど。担当の子が受かったときって、あれヤバくない」',
    culture_nushi:  '「俺、文化系のサークルなんだけど。部室にさ、なんか住んでる先輩っていない？」',
    sports_asaren:  '「俺サッカー部なんだけどさ。朝練って、起きた瞬間がいちばんきついよな」',

  // 女子が友達に聞き返したら、友達が答える（話題 → 友達）

    sumai_intro:    { 1: '「一人暮らし！ 部屋は寝るだけ」', 4: '「……一人暮らし。仕送りなしで、わりとギリ」' },
    jimoto_intro:   { 1: '「地方！ 田んぼしかない」', 4: '「……関東。ここから一時間くらい」' },
    sports_asaren:  { 1: '「ない！ 気合い！ ……嘘、目覚まし五個」' },

  const FRIEND_STORY = {

    sumai_intro:    { 1: '「一人暮らし初日、カーテンなくて朝四時に起きた」', 4: '「……仕送りなしだと、冬は毛布三枚」' },

  // 自分の話題で聞き返されたときの、自分の答え（話題 → 手）
  const PLAYER_ANS = {

                     dig: ['「塾で二年。……そっちは、なんでそこにしたの」'], tease: ['「秘密。……塾だけど。言っちゃった」'] },
    sumai_intro:   { go: ['「実家。楽だけど、帰る時間は毎回聞かれる」', '「実家。飯は出るけど、門限みたいな空気がある」'],

    jimoto_intro:  { go: ['「大学がこっちだっただけ。……ってことにしてる」', '「地元、店が全部夜九時に閉まるから」'],

                     dig: ['「覚えてる。……そっちも、忘れられない子いる？」'], tease: ['「それ聞く？ 今日いちばん重いやつ」'] },
    jikka_juku:    { go: ['「ソファで寝落ちして、毎回遅刻しかける」', '「冷蔵庫あけて、閉めて、また開けてる」'],

  };
  const NARR = {
    unknown:  '（知らない話だ。少し聞いてみる）',
    learned:  '（だいたい分かってきた）',
    twoWorld: '（まわりの声が、少し遠くなった）',
    stall:    '（しばらく、グラスの音だけが続いた）',
    slip:     '（……ちょっと、滑った）',
    let:      '（そのまま、流した）',
    cold:     '（場が、すっかり冷えてしまった）',
  };
  const ACT = { open: '話題を出した', go: '乗った', dig: '掘った', tease: '茶化した', rescue: '笑ってごまかした' };

  function create(CardTopics) {
    const T = CardTopics.TOPICS;
    const turn = new Map();                              // 配列ごとに順番に回す
    const pick = arr => { const i = turn.get(arr) || 0; turn.set(arr, i + 1); return arr[i % arr.length]; };
    const lastType = {};                                 // 相手ごとの、直前の台詞の型
    const opener = {};                                   // 話題 → 出した人
    const talkTo = {};                                   // 話題:ヒロイン → 自分が一度でも反応したら、以降は自分に向けて話す
    const ok = x => x && !x.includes('俺');              // 男の口調の行はヒロインに言わせない
    const politeOk = (h, x) => ok(x) && (POLITE[h] || !/(です|ます)/.test(x));
    const once = new Set();                              // 1つの話題で1回だけ使う行
    const first = key => (once.has(key) ? false : (once.add(key), true));

    // → { text, type, act }
    function heroineSay(e) {
      const t = T[e.topic], h = e.who;
      if (e.strained) return { text: STRAINED[h], type: 'stmt', act: '黙った' };
      if (e.depth === 0) {
        if (e.count === 1) {
          if (t.bite && t.bite[h]) return { text: t.bite[h], type: 'stmt', act: e.appeal >= 2 ? '食いついた' : '返した' };
          if (e.appeal >= 2) {
            const x = ok(t.biteDefault) && t.biteDefault;
            if (x) return { text: x, type: 'stmt', act: '食いついた' };
          } else {
            const x = (politeOk(h, t.miss) && t.miss) || (politeOk(h, t.biteDefault) && t.biteDefault) || MISS_OWN[h];
            if (x) return { text: x, type: 'miss', act: '返した' };
          }
        }
        if (e.count === 2 && e.appeal >= 2) {
          if (t.more && t.more[h]) return { text: t.more[h], type: 'ask', act: '聞き返した' };
          if (politeOk(h, t.moreDefault) && first(e.topic + ':moreDefault')) return { text: t.moreDefault, type: 'ask', act: '聞き返した' };
          if (first(e.topic + ':askback:' + h)) return { text: pick(ASKBACK[h]), type: 'ask', act: '聞き返した' };
        }
      } else {
        const rows = DEEP[e.topic] && DEEP[e.topic][h] && DEEP[e.topic][h][e.depth];
        if (rows && rows[e.count - 1]) return { text: rows[e.count - 1], type: 'deep', act: '打ち明けた' };
        if (e.count === 1) return { text: GENERIC_DEEP[h][e.depth], type: 'deep', act: '打ち明けた' };
        if (first(e.topic + ':reopen:' + h)) return { text: REOPEN[h], type: 'deep', act: '話を続けた' };
      }
      if (e.lead && first(e.topic + ':askback:' + h)) return { text: pick(ASKBACK[h]), type: 'ask', act: '聞き返した' };
      return { text: pick(BACK[h]), type: 'stmt', act: 'うなずいた' };
    }

    function line(e) {
      switch (e.t) {
        case 'open': {
          opener[e.topic] = e.by;
          if (e.by === 'P') return null;           // 自分が出したときは player 出来事で出す
          return { speaker: e.by, to: 'all', act: ACT.open, text: BRIDGE[e.topic] || T[e.topic].open };
        }
        case 'player': {
          if (e.cmd === 'open') return { speaker: 'P', to: 'all', act: ACT.open, text: BRIDGE[e.topic] || T[e.topic].open };
          if (e.cmd === 'rescue') return { speaker: 'P', to: e.to, act: ACT.rescue, text: pick(PLAYER.rescue) };
          const toF = e.to === 1 || e.to === 4;
          const type = toF ? 'friend' : (lastType[e.to] || 'stmt');
          if (!toF) talkTo[e.topic + ':' + e.to] = 'P';
          let rows = (type === 'miss' && e.cmd === 'go' && opener[e.topic] !== 'P') ? PLAYER.miss.goF : PLAYER[type][e.cmd];
          const mine = opener[e.topic] === 'P' || ['baito_intro', 'sumai_intro', 'jimoto_intro'].includes(e.topic);
          if (type === 'ask' && mine && PLAYER_ANS[e.topic]) rows = PLAYER_ANS[e.topic][e.cmd];
          if (!Array.isArray(rows)) rows = rows[Math.min(Math.max(e.depth, 1), 2)];
          return { speaker: 'P', to: e.to, act: ACT[e.cmd], text: pick(rows) };
        }
        case 'say': {
          const r = heroineSay(e);
          lastType[e.who] = r.type;
          const to = e.to;
          return { speaker: e.who, to, act: r.act, text: r.text };
        }
        case 'react': {
          if (e.kind === 'ok') return { narr: true, text: THINK[e.who] };
          const act = { go: '笑った', fail: '引いた', tease: '笑った', rescue: '許した' }[e.kind];
          const text = e.kind === 'go' ? (REACT.go[lastType[e.who]] || REACT.go.stmt)[e.who] : REACT[e.kind][e.who];
          if (e.kind !== 'go') lastType[e.who] = 'stmt';
          return { speaker: e.who, to: 'P', act, text };
        }
        case 'friend': {
          const f = e.who, t = T[e.topic];
          if (e.mode === 'go') {
            const own = e.first && e.playerOpened && t.friend;          // 「こいつ〜からな」は女子に向けて言う
            return { speaker: f, to: own ? 'all' : (e.playerOpened ? 'P' : 'all'), act: '乗った', text: own ? t.friend : pick(FRIEND.back[f]) };
          }
          if (e.mode === 'story') return { speaker: f, to: 'all', act: '話し出した', text: (FRIEND_STORY[e.topic] && FRIEND_STORY[e.topic][f]) || pick(FRIEND.story[f]) };
          if (e.mode === 'answer') {
            lastType[e.to] = 'askedF';
            const x = (FRIEND_ANSWER[e.topic] && FRIEND_ANSWER[e.topic][f]) || pick(FRIEND.back[f]);
            return { speaker: f, to: e.to, act: '答えた', text: x };
          }
          return { speaker: f, to: 'P', act: { dug: '乗せられた', backed: '乗った', teased: 'つっこんだ' }[e.mode], text: FRIEND[e.mode][f] };
        }
        case 'narr': return NARR[e.key] ? { narr: true, text: NARR[e.key] } : null;
        default: return null;
      }
    }
    return { line, NAME };
  }
  // 台詞の一覧（tools/lines_review.js が docs/lines-v0.md に書き出す）
  const DATA = { DEEP, GENERIC_DEEP, ASKBACK, BACK, REACT, PLAYER, PLAYER_ANS, BRIDGE, FRIEND, FRIEND_ANSWER, FRIEND_STORY, NARR };
  return { create, NAME, NARR, DATA };
})();

if (typeof module !== 'undefined') module.exports = NightLines;

<script>
// 共通の舞台（案6の灰色）。どの方式もここに描く
const Stage = (() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const NAME = { 101: 'あおい', 102: 'ゆな', 103: 'めい', 1: 'けんた', 4: 'けいた', P: 'あなた' };
  const HS = [101, 102, 103], ALL = [101, 102, 103, 1, 4];
  let gen = 0, tapFn = null, alwaysTap = null, log = [], softFocus = false;
  const timers = new Set();

  // 方式を始めるたびに世代を進める。古い世代の待ちは、以後ずっと解決しない（止まる）
  function begin(title) {
    gen++; tapFn = null; alwaysTap = null; log = []; softFocus = false;
    timers.forEach(t => clearTimeout(t)); timers.clear();
    $('home').hidden = true; $('play').hidden = false;
    $('sheet-end').hidden = true; $('sheet-log').hidden = true; $('dbg').hidden = true;
    $('ttl').textContent = title; $('dots').innerHTML = '';
    HS.forEach(h => { expr(h, '真顔'); meter(h, ''); });
    document.querySelectorAll('.note').forEach(x => x.remove());
    focus(null); tag(null); air(60); narr('', true); clear(); bar(0);
    document.querySelectorAll('.fig.gone').forEach(f => f.classList.remove('gone')); scene('');
    return gen;
  }
  const live = g => g === gen;
  function home() { gen++; tapFn = null; alwaysTap = null; timers.forEach(t => clearTimeout(t)); timers.clear();
    $('play').hidden = true; $('home').hidden = false; $('sheet-end').hidden = true; $('sheet-log').hidden = true; }
  function later(fn, ms, g) { const t = setTimeout(() => { timers.delete(t); if (live(g)) fn(); }, ms); timers.add(t); return t; }
  function cancel(t) { clearTimeout(t); timers.delete(t); }
  const sleep = (ms, g) => new Promise(res => later(res, ms, g));

  // タップ待ち
  function waitTap(g, hintText) {
    $('next').hidden = false;
    if (hintText !== undefined) hint(hintText);
    return new Promise(res => { tapFn = v => { if (!live(g)) return; tapFn = null; $('next').hidden = true; res(v || 'tap'); }; });
  }
  // タップか時間切れの早い方。下に細い残り時間の線を出す
  function waitTapOr(ms, g) {
    bar(ms);
    return new Promise(res => {
      let done = false;
      const fin = how => { if (done || !live(g)) return; done = true; tapFn = null; cancel(t); bar(0); res(how); };
      const t = later(() => fin('time'), ms, g);
      tapFn = v => fin(v || 'tap');
    });
  }
  function onTap(fn) { alwaysTap = fn; }
  function tapNow() { if (tapFn) tapFn(); else if (alwaysTap) alwaysTap(); }
  function fire(v) { if (tapFn) tapFn(v); }        // 待っている所に、タップ以外の値を渡す（言葉を撃つ・行動する など）
  function bar(ms) {
    const b = $('tbar'); b.style.transition = 'none'; b.style.width = '0';
    if (!ms) return;
    void b.offsetWidth; b.style.transition = `width ${ms}ms linear`; b.style.width = 'calc(100% - 24px)';
  }

  // 台詞・地の文
  function say(sp, to, act, text, o = {}) {
    $('win').classList.remove('narr');
    const toTxt = to == null ? '' : to === 'all' ? 'みんな' : NAME[to];
    $('plate').innerHTML = `<span class="who">${NAME[sp]}</span>` + (toTxt ? `<span>→</span><span class="to">${toTxt}</span>` : '')
      + (act ? `<span class="act">${act}</span>` : '');
    if (o.html != null) $('text').innerHTML = o.html; else $('text').textContent = text;
    if (o.expr) Object.entries(o.expr).forEach(([h, x]) => expr(+h, x));
    focus(typeof sp === 'number' ? sp : null, o.far);
    if (!o.nolog) log.push({ sp, who: NAME[sp], to: toTxt, act, text: o.logText || text });
  }
  function setText(t) { $('text').textContent = t; }
  function narr(text, nolog) {
    $('win').classList.add('narr'); $('plate').innerHTML = ''; $('text').textContent = text;
    if (!nolog && text) log.push({ narr: text });
  }
  function thinking(on, msg) {
    if (!on) return;
    $('win').classList.add('narr'); $('plate').innerHTML = '';
    $('text').innerHTML = `<span class="think">……</span> <span style="font-size:12px">${msg || ''}</span>`;
  }
  function expr(h, x) { const b = document.querySelector('#fig-' + h + ' [data-expr]'); if (b) b.textContent = x; }
  function meter(h, t) { const b = document.querySelector('#fig-' + h + ' [data-meter]'); if (b) b.textContent = t; }
  function focus(sp, far) {
    far = far || [];
    ALL.forEach(id => {
      const f = $('fig-' + id); f.classList.remove('speak', 'dim', 'far', 'watch');
      if (id === sp) f.classList.add('speak');
      else if (id === 1 || id === 4 || far.includes(id)) f.classList.add('far');
      else f.classList.add(softFocus ? 'watch' : 'dim');
    });
  }
  // 場所が変わる（店の外・カラオケ・駅まで）／場を離れた人を消す
  function scene(name, place) { const s = $('stage'); s.dataset.scene = name || ''; s.dataset.place = place || ''; }
  function leave(h) { const f = $('fig-' + h); if (f) f.classList.add('gone'); }
  function soft(on) { softFocus = !!on; }
  function watchAll() { HS.forEach(h => { const f = $('fig-' + h); f.classList.remove('dim', 'far', 'speak'); f.classList.add('watch'); }); }
  function tag(t) { const e = $('tag'); if (t) { e.hidden = false; e.textContent = t; } else e.hidden = true; }
  function air(v) { $('shade').style.opacity = String(Math.max(0, Math.min(0.45, (60 - v) / 100))); }
  function note(h, mark) {
    const f = $('fig-' + h); if (!f) return;
    const n = document.createElement('div'); n.className = 'note'; n.textContent = mark; f.appendChild(n);
    setTimeout(() => n.remove(), 1900);
  }
  function dots(n, of) {
    const d = $('dots'); d.innerHTML = '';
    for (let i = 1; i <= of; i++) { const s = document.createElement('span'); s.className = 'dot' + (i > n ? ' on' : ''); d.appendChild(s); }
  }
  function dotsText(t) { $('dots').textContent = t; }

  // 手の欄
  function clear() { $('cmds').innerHTML = ''; }
  function hint(t) { $('cmds').innerHTML = ''; if (t) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = t; $('cmds').appendChild(h); } }
  function put(...nodes) { const c = $('cmds'); c.innerHTML = ''; nodes.forEach(n => n && c.appendChild(n)); }
  function btn(label, sub, cls, fn) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'cmd ' + (cls || '');
    b.innerHTML = label + (sub ? `<small>${sub}</small>` : '');
    b.addEventListener('click', ev => { ev.stopPropagation(); fn(); });
    return b;
  }
  function row(nodes, cols) {
    const r = document.createElement('div'); r.className = 'row';
    r.style.gridTemplateColumns = `repeat(${cols || nodes.length || 1}, minmax(0, 1fr))`;
    nodes.forEach(n => r.appendChild(n)); return r;
  }
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  // メニュー
  let menuItems = [];
  function menu(items) { menuItems = items; }
  function renderMenu() {
    const m = $('menu'); m.innerHTML = '';
    [{ label: 'ログ', fn: openLog }].concat(menuItems).forEach(it => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = typeof it.label === 'function' ? it.label() : it.label;
      b.addEventListener('click', ev => { ev.stopPropagation(); closeMenu(); it.fn(); }); m.appendChild(b);
    });
  }
  const closeMenu = () => { $('menu').hidden = true; $('btn-menu').setAttribute('aria-expanded', 'false'); };

  // ログ・結果
  function logRound(n) { log.push({ r: n }); }
  // ログ：3つの見せ方（チャット／台本／振り返り）。どれも同じ記録から描く
  let logStyle = 'mix';
  try { logStyle = localStorage.getItem('cmp_logStyle2') || 'mix'; } catch (e) {}
  const INI = { 101: 'あ', 102: 'ゆ', 103: 'め', 1: 'け', 4: 'い', S: '店', P: '自' };
  const KINDJ = { dig: '聞く', go: '乗る', tease: 'ツッコむ', card: '手札', furu: '話しかける', topic: '話題を出す', silence: '黙る', cue: '気づき', listen: '聞き届けた', cut: '遮った' };
  function sections() {
    const out = []; let cur = { h: null, items: [] };
    log.forEach(x => { if (x.r) { if (cur.items.length || cur.h) out.push(cur); cur = { h: x.r, items: [] }; } else cur.items.push(x); });
    if (cur.items.length || cur.h) out.push(cur);

  }
  const fxText = d => Object.entries(d).map(([h, v]) => `${NAME[h]} ${v > 0 ? '+' : ''}${Math.round(v)}`).join('　');
  function chatItem(x) {
    if (x.sp != null) {

        + (me ? '' : `<div class="lc-name">${x.who}${x.to && x.to !== 'あなた' ? ` <i>→ ${x.to}</i>` : ''}</div>`)

  }
  function renderChat() {
    return sections().map(sec => (sec.h ? `<div class="lc-h"><span>${esc(sec.h)}</span></div>` : '') + sec.items.map(chatItem).join('')).join('');
  }
  function secSummary(sec) {
    const kinds = {}, sum = {};
    sec.items.forEach(x => { if (x.pick) kinds[x.kind] = (kinds[x.kind] || 0) + 1; if (x.fx) Object.entries(x.fx).forEach(([h, v]) => { sum[h] = (sum[h] || 0) + v; }); });
    return { kindLine: Object.entries(kinds).map(([k, n]) => `${KINDJ[k] || k} ${n}`).join('・'), sumLine: Object.keys(sum).length ? fxText(sum) : '変化なし' };
  }
  // 複合：話題ごとのカード（振り返りの要約）を開くと、中はチャット
  function renderMix() {
    const secs = sections().filter(sec => sec.h || sec.items.some(x => x.sp != null));
    return secs.map((sec, si) => {
      const { kindLine, sumLine } = secSummary(sec);
      return `<details class="lm-card" ${si === secs.length - 1 ? 'open' : ''}><summary><span class="lm-h">${esc(sec.h || 'はじめ')}</span>`
        + `<span class="lm-k">${kindLine ? kindLine + '　' : ''}<b>${sumLine}</b></span></summary>`
        + `<div class="lm-body">${sec.items.map(chatItem).join('')}</div></details>`;
    }).join('');
  }
  function renderScript() {
    return sections().map(sec => (sec.h ? `<div class="ls-h">${esc(sec.h)}</div>` : '') + sec.items.map(x => {
      if (x.sp != null) return `<div class="ls-row ${x.sp === 'P' ? 'me' : ''}"><div class="ls-name">${x.who}${x.act ? `<small>${x.act}</small>` : ''}</div><div class="ls-text">${esc(x.text)}</div></div>`;
      if (x.narr) return `<div class="ls-n">${esc(x.narr)}</div>`;
      if (x.fx) return `<div class="ls-fx">${fxText(x.fx)}</div>`;
      if (x.pick && (x.kind === 'silence' || x.kind === 'listen')) return `<div class="ls-n">（${esc(x.pick)}）</div>`;
      if (x.vote) return `<div class="ls-row"><div class="ls-name">${x.vote[0]}</div><div class="ls-text">→ ${x.vote[1]}</div></div>`;
      return '';
    }).join('')).join('');
  }
  function renderRecap() {
    const secs = sections();
    return secs.map((sec, si) => {
      const kinds = {}, sum = {}, acts = [];
      sec.items.forEach((x, i) => {
        if (x.pick) kinds[x.kind] = (kinds[x.kind] || 0) + 1;
        if (x.fx) Object.entries(x.fx).forEach(([h, v]) => { sum[h] = (sum[h] || 0) + v; });
        if (x.sp === 'P') {
          const reply = sec.items.slice(i + 1).find(y => y.sp != null && y.sp !== 'P');
          acts.push(`<li><b>${x.act || '話した'}</b> ${esc(x.text)}${reply ? `<br><span>→ ${reply.who} ${esc(reply.text)}</span>` : ''}</li>`);
        }
      });
      const kindLine = Object.entries(kinds).map(([k, n]) => `${KINDJ[k] || k} ${n}`).join('・');
      const sumLine = Object.keys(sum).length ? fxText(sum) : '変化なし';
      const all = sec.items.filter(x => x.sp != null || x.narr).map(x => x.sp != null ? `<p><b>${x.who}</b> ${esc(x.text)}</p>` : `<p class="n">${esc(x.narr)}</p>`).join('');
      return `<div class="lr-card"><div class="lr-h">${esc(sec.h || 'はじめ')}</div>`
        + (kindLine ? `<div class="lr-k">あなたの手：${kindLine}</div>` : '')
        + `<div class="lr-k">反応：${sumLine}</div>`
        + (acts.length ? `<ul class="lr-acts">${acts.join('')}</ul>` : '<div class="lr-k">（自分からは何も言わなかった）</div>')
        + `<details ${si === secs.length - 1 ? 'open' : ''}><summary>この区切りの会話をぜんぶ見る</summary>${all}</details></div>`;
    }).join('');
  }
  function openLog() {
    const box = $('log'); box.innerHTML = '';
    const head = el('div', 'loghead', '<h2>ログ</h2>');
    const tabs = el('div', 'logtabs');
    [['mix', '複合'], ['chat', 'チャット'], ['script', '台本'], ['recap', '振り返り']].forEach(([k, l]) => {
      const b = el('button', 'ltab' + (k === logStyle ? ' on' : ''), l); b.type = 'button';
      b.addEventListener('click', ev => { ev.stopPropagation(); logStyle = k; try { localStorage.setItem('cmp_logStyle2', k); } catch (e) {} openLog(); });
      tabs.appendChild(b);
    });
    const close = el('button', 'lclose', '閉じる'); close.type = 'button';
    close.addEventListener('click', ev => { ev.stopPropagation(); $('sheet-log').hidden = true; });
    head.appendChild(tabs); head.appendChild(close); box.appendChild(head);
    const body = el('div', 'logbody ' + logStyle);
    body.innerHTML = log.length ? (logStyle === 'mix' ? renderMix() : logStyle === 'chat' ? renderChat() : logStyle === 'script' ? renderScript() : renderRecap()) : '<p class="small">まだ何もない</p>';
    box.appendChild(body);
    $('sheet-log').hidden = false;
    if (logStyle === 'chat' || logStyle === 'script') requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
  }
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const RESULT = {
    home: { title: '一緒に帰る', lead: '駅まで、二人で歩いた。' },
    contact: { title: '連絡先を交換', lead: '帰りぎわに、連絡先を交換した。' },
    none: { title: '今夜は、なし', lead: 'そのまま、解散になった。' },
  };
  // hearts: {101:数}, base: {101:数}
  function end(o) {
    const R = RESULT[o.result] || { title: o.title, lead: o.lead };
    let h = `<h2>${R.title}</h2><p>${o.lead || R.lead}</p>`;
    if (o.said) h += `<p>${o.said}</p>`;
    if (o.hearts) {
      h += '<h3>好感度（本番では見せない）</h3><div class="hearts">' + HS.map(id => {
        const v = Math.round(o.hearts[id]), d = o.base ? v - Math.round(o.base[id]) : null;
        return `<div>${NAME[id]}<b>${v}</b>${d == null ? '' : (d >= 0 ? '+' : '') + d}</div>`;
      }).join('') + '</div>';
    }
    (o.sections || []).forEach(s => { h += `<h3>${s.h}</h3>` + s.p.map(p => `<p class="small">${p}</p>`).join(''); });
    h += '<div class="row" style="grid-template-columns:1fr 1fr 1fr;margin-top:14px"></div>';
    $('end').innerHTML = h;
    const r = $('end').querySelector('.row');
    r.appendChild(btn('ログ', null, 'quiet', openLog));
    r.appendChild(btn('一覧へ', null, 'quiet', () => { $('sheet-end').hidden = true; if (o.back) o.back(); }));
    r.appendChild(btn('もう一回', null, '', () => { $('sheet-end').hidden = true; o.again(); }));
    $('sheet-end').hidden = false; clear();
  }
  function dbg(html) { const d = $('dbg'); if (html == null) { d.hidden = true; return; } d.hidden = false; d.innerHTML = html; }
  const dbgOn = () => !$('dbg').hidden;

  // つなぎ
  $('stage').addEventListener('click', tapNow);
  $('cmds').addEventListener('click', e => { if (e.target === $('cmds') || e.target.classList.contains('hint')) tapNow(); });
  $('btn-menu').addEventListener('click', ev => { ev.stopPropagation(); const m = $('menu'); if (m.hidden) renderMenu(); m.hidden = !m.hidden; $('btn-menu').setAttribute('aria-expanded', String(!m.hidden)); });
  document.addEventListener('click', closeMenu);
  $('sheet-log').addEventListener('click', e => { if (e.target === $('sheet-log')) $('sheet-log').hidden = true; });

  return { NAME, HS, fire, begin, home, live, later, cancel, sleep, waitTap, waitTapOr, onTap, bar, say, setText, narr, thinking, expr, meter,
           focus, soft, watchAll, scene, leave, tag, air, note, dots, dotsText, clear, hint, put, btn, row, el, menu, logRound, openLog, end, dbg, dbgOn, esc,
           get log() { return log; } };
})();

<script>
// 案A（グノーシア＝今の遊べる版）と 案B（同じ夜を、AIが台詞を書く）
// 進行は js/v0/night-engine.js をそのまま使う。Bは台詞の文字だけを差し替える
const EngineMode = (() => {
  'use strict';
  const NAME = Stage.NAME;
  const CMD = { go: '乗る', dig: '掘る', tease: '茶化す' };
  const INTRO = '（乾杯。向かいに あおい・ゆな・めい。両隣には、連れてきた けんた と けいた）';

  let E, L, night, seen, queue, hist, aiText, ai, g, pending, busy, opened, stepping, back;
  let samplePromise = null, tier = 'quick', aiCalls = 0, aiMs = 0, aiNote = null;
  let lastSeed = null;

  // ── AI（案B）────────────────────────────────────────────
  const PEOPLE = [
    'あなた（プレイヤー・男・大学2年）: 塾で小学生を教えるバイト、実家暮らし、文化系サークル。一人称「俺」。',
    'けんた（連れてきた友達）: 居酒屋バイト、一人暮らし（仕送りあり）、運動部。場を仕切りたがり、あなたをいじる。',
    'けいた（連れてきた友達）: カフェバイト、一人暮らし（仕送りなし）、写真サークル。落ち着いていて、少し皮肉っぽい。',
    'あおい: 清楚、図書委員タイプ。関西出身だがふだんは標準語。実家暮らしで門限11時。塾で小学5年に国語を教えている。文芸部。丁寧語、「……」で間をとる。自分の話は控えめで、本音は小さく言う。',
    'ゆな: ギャル、陽気。一人暮らし（仕送りあり。親に内緒でバイトを増やしている）。カフェでバイト（ラテアートのハートが歪む）。テニス部で朝練が苦手。一人称「うち」、タメ口、テンション高め。',
    'めい: 不思議ちゃん。地方出身、一人暮らし（仕送りなし。電気代が気になる）。バイトはしていない（「いらっしゃいませ」が苦手）。天文サークル。短く言う、間が多い、ずれた角度から本音を言う。',
  ].join('\n');
  const RULES = [
    '- 直前の発言を受けてつなぐ。ただし「その◯◯、」のように要約して受けない。相手を評価しない（いいね・すごい・偉い は使わない）。',
    '- 共感は「自分も同じ側にいる」で出す。質問は具体的に、2つ重ねてもよい。',
    '- 1行は10〜30字くらい。口語。全部の行をきれいに閉じない（言いかけ、語尾の脱落）。文末に「w」は使わない。',
    '- 好感度・空気・深さなどのゲームの言葉は書かない。地の文は書かない。各行は「」で囲む。',
    '- 指定された話し手・相手・行為・深さ・表情を守る。「参考」は仮の台詞。事実（誰が何をしているか）は守り、言い回しは前後の流れに合わせて書き直す。',
    '- 深さ: 0=表面の話 / 1=少し本音 / 2=二人だけの話（まわりには聞こえていない） / 3=誰にもしていない話。',
    '- あなたの行為: 乗った=自分も同じだと差し出す / 掘った=一歩踏み込んで具体を聞く / 茶化した=笑いにして軽くする / 笑ってごまかした=踏み込みすぎたのを笑いで戻す。',
    '- ヒロインの行為: 引いた=踏み込まれすぎて困っている / 許した=笑って流してくれた / 返した=話題にあまり通じていない / 打ち明けた=深さに合った本音。',
  ].join('\n');

  function ctxText() {
    return Stage.log.slice(-28).map(x => x.r ? `── ${x.r}` : x.narr ? x.narr : `${x.who}${x.to ? '→' + x.to : ''}［${x.act}］${x.text}`).join('\n') || '（まだ何も話していない）';
  }
  function slotText(s, j) {
    const e = s.e, l = s.l, T = CardTopics.TOPICS;
    const tid = e.topic || (e.topicNow && e.topicNow.id);
    const to = l.to === 'all' ? 'みんな' : NAME[l.to];
    const a = [`[${j}] ${NAME[l.speaker]}→${to}／行為:${l.act}`];
    if (tid) a.push(`話題:${T[tid].label}`);
    if (e.t === 'say') a.push(`深さ:${e.depth}`);
    if (e.expr) a.push(`表情:${e.expr}`);
    a.push(`参考:${l.text}`);
    return a.join('／');
  }
  function buildPrompt(slots) {
    let j = 0;
    const body = slots.map(s => s.l.narr ? `（地の文）${s.l.text}` : slotText(s, j++)).join('\n');
    return `合コンを舞台にしたノベルゲームの台詞を書いてください。場面は居酒屋、大学生の合コン、乾杯のあと。\n\n【人物】\n${PEOPLE}\n\n【書き方】\n${RULES}\n\n【ここまでの会話】\n${ctxText()}\n\n【これから書く行】（この順に続けて起きる。地の文はそのまま入る）\n${body}\n\n【返し方】JSONだけを返す。{"lines":["「…」", …]} 要素は ${j} 個で、[0]〜[${j - 1}] の順。`;
  }
  const toD = n => { let k = 0; while (!n.decision && n.phase !== 'end' && k++ < 80) n.advance(); return n.decision; };
  // 今の状態から「黙って聞き続けたら起きること」を、別の夜で先読みする（同じ種・同じ選択なら同じ出来事になる）
  function lookahead(from) {
    const c = E.newNight(night.seed), L2 = NightLines.create(CardTopics);
    for (const h of hist) { toD(c); c.choose(h); }
    let d = toD(c), k = 0;
    while (d && d.kind === 'react' && k++ < 40) { c.choose({ cmd: 'wait' }); d = toD(c); }
    const out = [];
    c.events.forEach((e, i) => {
      if (e.t === 'round' || e.t === 'roundEnd' || e.t === 'end') return;
      const l = L2.line(e); if (!l || i < from) return;
      out.push({ i, e, l });
    });
    return out;
  }
  async function aiFill(from) {
    const sample = await samplePromise;
    if (!sample) throw { code: 'unavailable' };
    const slots = lookahead(from);
    const speak = slots.filter(s => !s.l.narr);
    if (!speak.length) return;
    const t0 = Date.now(); aiCalls++;
    const r = await sample.json(buildPrompt(slots), { modelTier: tier });
    aiMs += Date.now() - t0;
    const arr = r && Array.isArray(r.lines) ? r.lines : [];
    speak.forEach((s, j) => {
      let x = typeof arr[j] === 'string' ? arr[j].trim() : '';
      if (x && !x.startsWith('「')) x = '「' + x.replace(/^『|』$/g, '') + '」';
      aiText[s.i] = x || false;
    });
  }

  // ── 進行（screens/night_v0.html と同じ手順）───────────────
  function start(o) {
    ai = !!o.ai; back = o.back;
    g = Stage.begin(ai ? 'B AI' : 'A グノーシア');
    E = NightEngine.create({ HEROINES, CardTopics }); L = NightLines.create(CardTopics);
    night = E.newNight(o.seed == null ? Math.floor(Math.random() * 1e9) : o.seed); lastSeed = night.seed;
    seen = 0; queue = []; hist = []; aiText = {}; pending = 'first'; busy = false; opened = false; stepping = false;
    aiCalls = 0; aiMs = 0; aiNote = null;
    if (ai && !samplePromise) samplePromise = (window.claude && claude.use) ? claude.use('sample').catch(() => null) : Promise.resolve(null);
    Stage.dots(0, night.cfg.ROUNDS);
    Stage.narr(INTRO);
    Stage.hint(ai ? 'タップで始める（台詞は1ラウンドごとにAIが書く。数秒待つ）' : 'タップで始める');
    Stage.onTap(tap);
    const items = [{ label: () => '数値：' + (Stage.dbgOn() ? '隠す' : '見る'), fn: () => { if (Stage.dbgOn()) Stage.dbg(null); else renderDbg(true); } },
                   { label: 'この夜をもう一回', fn: () => start({ ai, seed: night.seed, back }) }];
    if (ai) items.push({ label: () => 'AI：' + (tier === 'quick' ? '速い（いま）→ 丁寧にする' : '丁寧（いま）→ 速くする'), fn: () => { tier = tier === 'quick' ? 'default' : 'quick'; } });
    Stage.menu(items);
  }
  function pump() {
    if (night.phase !== 'end') night.advance();
    for (; seen < night.events.length; seen++) {
      const e = night.events[seen];
      if (e.t === 'round') { queue.push({ round: e }); continue; }
      if (e.t === 'roundEnd' || e.t === 'end') { queue.push({ scene: e }); continue; }
      const l = L.line(e); if (!l) continue;
      queue.push({ line: l, e, i: seen });
    }
  }
  async function step() {
    if (busy || !Stage.live(g)) return;
    if (pending === 'first') { pending = null; pump(); }
    while (queue.length) {
      const q = queue[0];
      if (q.round) { queue.shift(); Stage.dots(q.round.n, night.cfg.ROUNDS); Stage.logRound('ラウンド ' + q.round.n); continue; }
      if (q.scene) { queue.shift(); scene(q.scene); continue; }
      if (ai && !q.line.narr && aiText[q.i] === undefined) {
        busy = true; Stage.clear(); Stage.thinking(true, 'AIが台詞を書いています');
        const my = g;
        try { await aiFill(q.i); if (aiText[q.i] === undefined) aiText[q.i] = false; }
        catch (err) {
          ai = false;
          aiNote = err && err.code === 'unavailable' ? 'この画面ではAIが使えませんでした' : err && err.code === 'not_granted' ? 'AIの利用が許可されませんでした' : 'AIの呼び出しに失敗しました（' + ((err && err.code) || '不明') + '）';
          queue.unshift({ line: { narr: true, text: '（' + aiNote + '。この先はテンプレの台詞で続けます）' }, e: q.e, i: -1 });
        }
        if (!Stage.live(my)) return;
        busy = false;
        continue;
      }
      queue.shift();
      const l = Object.assign({}, q.line);
      if (ai && !l.narr && aiText[q.i]) l.text = aiText[q.i];
      show(l, q.e);
      stepping = true; renderCmds(true);
      return;
    }
    stepping = false;
    if (night.decision) {
      if (night.decision.kind === 'end') { showEnd(); return; }
      renderCmds(false);
    } else { pump(); step(); }
  }
  function scene(e) {
    if (e.exprs) Object.entries(e.exprs).forEach(([h, x]) => Stage.expr(+h, x));
    Stage.air(e.air == null ? 60 : e.air);
    const t = e.topicNow;
    Stage.tag(t ? '#' + CardTopics.TOPICS[t.id].label + '　' + '●'.repeat(t.depth) + '○'.repeat(t.max - t.depth) : null);
    renderDbg();
  }
  function show(l, e) {
    scene(e);
    if (l.narr) { Stage.narr(l.text); return; }
    const t = e.topicNow;
    const far = (t && t.depth >= 2 && t.partner) ? Stage.HS.filter(h => h !== t.partner) : [];
    Stage.say(l.speaker, l.to, l.act, l.text, { far });
  }
  function tap() {
    if (busy) return;
    if (pending === 'first' || stepping) { step(); return; }
    const d = night && night.decision;
    if (!opened && d && (d.kind === 'start' || d.kind === 'react')) choose({ cmd: 'wait' });
  }
  function renderCmds(isStepping) {
    if (isStepping) { Stage.hint('タップで続き'); return; }
    const d = night.decision;
    if (!opened && d.kind !== 'rescue') {
      const bar = Stage.el('div', 'bar');
      const hint = Stage.el('div', 'hint', d.kind === 'start'
        ? (night.topic ? 'タップで様子を見る（続きを聞く） ▸' : 'タップで様子を見る（誰かが話し出す） ▸')
        : (night.topic && !night.topic.known ? '知らない話。タップで様子を見る ▸' : 'タップで様子を見る ▸'));
      const cut = Stage.el('button', 'cut', d.kind === 'start' ? '話題を出す' : '割って入る'); cut.type = 'button';
      cut.addEventListener('click', ev => { ev.stopPropagation(); opened = true; renderCmds(false); });
      bar.appendChild(hint); bar.appendChild(cut); Stage.put(bar);
      return;
    }
    const holder = Stage.el('div', 'panelcmd');
    const top = Stage.el('div', 'top2', `<span>${d.kind === 'start' ? 'どの話題を出す？' : NAME[d.speaker] + ' に'}</span>`);
    if (d.kind !== 'rescue') {
      const x = Stage.el('button', null, '✕ やめる'); x.type = 'button';
      x.addEventListener('click', ev => { ev.stopPropagation(); opened = false; renderCmds(false); }); top.appendChild(x);
    }
    holder.appendChild(top);
    if (d.kind === 'start') {
      holder.appendChild(Stage.row(d.options.filter(o => o.cmd === 'open').map(o =>
        Stage.btn('#' + CardTopics.TOPICS[o.topic].label, null, 'topic', () => choose(o))), 2));
    } else {
      const opts = d.options.filter(o => o.cmd !== 'wait');
      holder.appendChild(Stage.row(opts.map(o => Stage.btn(CMD[o.cmd], d.kind === 'rescue' ? '笑ってごまかす' : (o.cmd === 'tease' && !night.topic.known ? '知らない話' : null), '', () => choose(o)))));
      if (d.kind === 'rescue') holder.appendChild(Stage.btn('流す', null, 'quiet', () => choose({ cmd: 'wait' })));
    }
    Stage.put(holder);
  }
  function choose(o) {
    if (busy) return;
    const d = night.decision;
    if (o.cmd === 'wait') Stage.log.push({ narr: d && d.kind === 'start' ? '▶ 様子を見る' : '▷ 様子を見る' });
    const base = night.events.length;
    if (!(d && d.kind === 'react' && o.cmd === 'wait')) Object.keys(aiText).forEach(k => { if (+k >= base) delete aiText[k]; });
    hist.push(o); opened = false;
    night.choose(o); pump(); step();
  }
  function renderDbg(force) {
    if (!force && !Stage.dbgOn()) return;
    const t = night.topic;
    const rows = Stage.HS.map(h => `${NAME[h]} 好感度${night.hearts[h].toFixed(0)}${t ? ` 許容${night.tolerance(h, t.id).toFixed(1)} 残り${t.left[h]}` : ''}`);
    Stage.dbg(`空気 ${night.air.toFixed(0)}　seed ${night.seed}<br>${rows.join('<br>')}${t ? `<br>深さ ${t.depth}/${t.max}${t.known ? '' : '（知らない話）'}` : ''}`);
  }
  function countStrings(o) {
    if (typeof o === 'string') return 1;
    if (Array.isArray(o)) return o.reduce((a, x) => a + countStrings(x), 0);
    if (o && typeof o === 'object') return Object.values(o).reduce((a, x) => a + countStrings(x), 0);
    return 0;
  }
  function templateCount() {
    let n = countStrings(NightLines.DATA);
    const T = CardTopics.TOPICS;
    Object.keys(T).forEach(id => ['open', 'bite', 'miss', 'more', 'moreDefault', 'friend', 'biteDefault'].forEach(k => { n += countStrings(T[id][k]); }));

  }
  function showEnd() {
    const d = night.decision, h = HEROINES.find(x => x.id === d.honmei);

    const sections = [];
    if (ai || aiCalls) sections.push({ h: 'AIの手ごたえ', p: [`AIを呼んだ回数 ${aiCalls}回、待ち時間 合計 約${Math.round(aiMs / 1000)}秒（1回 平均 約${aiCalls ? (aiMs / aiCalls / 1000).toFixed(1) : '-'}秒）。`, aiNote ? aiNote + '。' : '一覧のAで「さっきの夜で」を押すと、同じ夜をテンプレの台詞で見比べられます。'] });

    Stage.end({ result: d.result, said: `${NAME[d.honmei]}：${said}`, hearts: night.hearts, sections,
      again: () => start({ ai, back }), back });
  }

  return { start, get lastSeed() { return lastSeed; } };
})();

        const v = await S.waitTapOr(ms, g);
        if (!v || !v.kw) continue;
        // 言葉を撃った: 手札を選ぶ
        const card = await new Promise(res => {
          const p = S.el('div', 'panelcmd');
          const top = S.el('div', 'top2', `<span>「${v.w}」に、どの話題を重ねる？</span>`);
          const xb = S.el('button', null, '✕ やめる'); xb.type = 'button'; xb.addEventListener('click', ev => { ev.stopPropagation(); res(null); });
          top.appendChild(xb); p.appendChild(top);
          p.appendChild(S.row(C_CARDS.map(c => { const b = S.btn('#' + c.label, used.has(c.id) ? '使った' : null, 'card', () => res(c)); b.disabled = used.has(c.id); return b; })));
          S.put(p);
        });
        if (!card) { i--; continue; }
        used.add(card.id); shot.add(v.kw);
        const h = C_HOOK_OWNER[v.kw];
        const H = C_HITS[v.kw] && C_HITS[v.kw][card.id];
        if (H) {
          fx(st, H.fx); st.picks.push(`「${v.w}」×${card.label} つながった`);
          await play(H.lines, g, st); hit = true;
        } else {
          fx(st, { [h]: -3, air: -5 }); st.picks.push(`「${v.w}」×${card.label} ずれた`);
          await play([['P', h, C_MISS_SAY[card.id], 'ずれた'], [h, 'P', C_MISS_BACK[h], null, { [h]: '困り顔' }], ['n', '（話が、噛み合わなかった）']], g, st);
          S.expr(h, '真顔');
        }
      }
      if (!hit) { S.narr('（話は、そのまま流れていった）'); await S.waitTap(g, 'タップで続き'); }
    }
    S.narr('（お開きになった）'); await S.waitTap(g, 'タップで結果');
    finish(mode, st, g);
  }
  function handHint(used) {
    const left = C_CARDS.filter(c => !used.has(c.id)).map(c => '#' + c.label).join('　') || '（手札なし）';
    S.put(S.el('div', 'hint', `手札：${left}<br>光った言葉をタップ ／ 画面タップで次の発言`));
  }

  // 1行を1文字ずつ出す。cut() で遮れる
  function typeLine(x, g, cps) {
    const full = x[2];
    S.say(x[0], x[1], x[3] || null, '', { expr: x[4], nolog: true });
    let i = 0, t = null, finished = false, resolve;
    const done = new Promise(r => { resolve = r; });
    const tick = () => { i++; S.setText(full.slice(0, i)); if (i >= full.length) { finished = true; S.log.push({ sp: x[0], who: NAME[x[0]], to: x[1] === 'all' ? 'みんな' : NAME[x[1]], act: x[3] || '', text: full }); resolve('done'); } else t = S.later(tick, cps, g); };
    tick();
    return {
      done, get finished() { return finished; },
      cut() { if (finished) return; S.cancel(t); finished = true; const s = full.slice(0, Math.max(1, i)) + '——'; S.setText(s); S.log.push({ sp: x[0], who: NAME[x[0]], to: '', act: '遮られた', text: s }); resolve('cut'); },
      skip() { if (finished) return; S.cancel(t); i = full.length - 1; tick(); },
    };
  }
  let slowHint = null;   // 流れている間の下の一行（I は手札を出す）
  async function saySlow(x, g, hold) {
    if (x[0] === 'n') { S.narr(x[1]); await S.sleep(1500, g); return; }
    const ty = typeLine(x, g, 60);
    S.hint(slowHint ? slowHint() : '（会話は勝手に進む）');
    const skip = () => ty.skip();
    S.onTap(skip);
    await ty.done; S.onTap(null);
    await S.sleep(hold == null ? 1000 : hold, g);
  }
  function bubbles(b, g, ms) {
    return new Promise(res => {
      const p = S.el('div', 'panelcmd');
      p.appendChild(S.el('div', 'top2', '<span>口を挟む？（黙っていれば話は進む）</span>'));
      const clock = S.el('div', 'clock', '<i></i>'); p.appendChild(clock);
      let done = false;
      const fin = v => { if (done) return; done = true; S.cancel(t); res(v); };
      p.appendChild(S.row(b.opts.map(o => S.btn(o.label, null, 'pill', () => fin(o)))));
      S.put(p);
      const i = clock.firstChild; i.style.transition = 'none'; i.style.width = '100%'; void i.offsetWidth;
      i.style.transition = `width ${ms}ms linear`; i.style.width = '0%';
      const t = S.later(() => fin(null), ms, g);
    });
  }
  async function runE(mode, g) {
    slowHint = null;
    const st = newState(); let silent = 0;
    show(INTRO); await S.waitTap(g, 'タップで続き');
    show(['n', '（この方式では、会話は勝手に進む。吹き出しが出ている間だけ口を挟める。話している最中に押すと、遮る）']);
    await S.waitTap(g, 'タップで始める');
    for (const node of E) {
      if (Array.isArray(node)) {
        if (node[0] === 'n') { show(node); await S.sleep(1600, g); } else await saySlow(node, g);
        continue;
      }
      const b = node.bubble;
      let o = null, cut = false;
      if (b.at === 'start') {
        const ty = typeLine(node.line, g, 75);
        const total = node.line[2].length * 75 + b.extra;
        o = await bubbles(b, g, total);
        if (o && !ty.finished) { ty.cut(); cut = true; } else await ty.done;
      } else {
        await saySlow(node.line, g, 250);
        o = await bubbles(b, g, b.ms);
      }
      S.clear();
      if (!o) { silent++; fx(st, b.silence.fx); st.picks.push('黙った'); for (const x of b.silence.lines) await saySlow(x, g); continue; }
      st.picks.push(o.label + (cut ? '（遮った）' : ''));
      await saySlow(['P', o.to, o.say, cut ? '割り込んだ' : '口を挟んだ'], g, 600);
      fx(st, cut ? o.cutFx : o.fx);
      for (const x of (cut ? o.cutLines : o.lines)) await saySlow(x, g);
    }
    if (silent >= 4) { fx(st, { air: -8 }); await saySlow([1, 'P', '「おい、さっきから静かだな」'], g); }
    show(['n', '（けんたが、カラオケの話をしはじめた）']);
    await S.waitTap(g, 'タップで結果');
    finish(mode, st, g, { sections: [{ h: 'この夜の口の挟み方', p: [st.picks.join(' ／ ')] }] });
  }
