    const tip = k => { const T = TIPS[k], key = T.k || k; if (!iTips || tipped.has(key)) return; tipped.add(key); showTip(T, g); };
    let m = 25, maxM = 25, lowN = 0, lowFired = false, chatty = false, tooChatty = false, quiet = false, quietBroken = false, seen = 0, missedUnseen = 0, storyHeard = false;
    const pending = [];
    S.soft(true); S.focus(null); S.scene('izakaya', '居酒屋');
    S.menu([{ label: () => `ヒント：${iTips ? 'オン' : 'オフ'}`, fn: () => { iTips = !iTips; } },
            { label: () => `空気読み：${iYomi}（変えて最初から）`, fn: () => { iYomi = iYomi === 50 ? 70 : iYomi === 70 ? 30 : 50; mode.start(mode.back); } },
            { label: '最初から', fn: () => mode.start(mode.back) }]);
    const drawM = () => { maxM = Math.max(maxM, m); if (m >= 55) tip('gaugeHi'); else if (m <= 8) tip('gaugeLo'); document.getElementById('dots').innerHTML = `<span>目立ち</span><span class="mbar"><i style="width:${m}%"></i></span>`; };
    drawM();
    const notice = () => iYomi + (50 - m) * 0.5;
    const handText = () => '手札：' + ([...hand].map(k => I_CARDS[k]).join('　') || 'なし');
    slowHint = () => `（会話は勝手に進む）　${handText()}`;
    const idle = () => S.hint(slowHint());
    const ffx = d => Object.entries(d || {}).forEach(([h, o]) => Object.entries(o).forEach(([k, v]) => { f[h][k] += v; }));
    const hl = t => S.esc(t).replace(/\[\[(.+?)\]\]/g, '<b class="kwq">$1</b>');
    const plain = t => t.replace(/\[\[(.+?)\]\]/g, '$1');
    const pick = (label, kind) => { st.picks.push(label); S.log.push({ pick: label, kind }); };
    const memories = [];
    let lastSp = null, inLull = false, bridgeN = 0;                     // 翌朝のLINEで触れられる話（届いた返しだけ）

    // ── 気づきの札 ──
    function showCue(id, life) {
      const c = I_CUE[id];
      if (notice() < c.need) { live[id] = { el: null, life, taken: false, unseen: true }; return; }   // 気づけなかった（札は出ない）
      seen++; tip('cue');
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'cue' + (c.at === 'table' ? ' table' : ''); b.textContent = c.label; b.style.left = I_POS[c.at];
      b.addEventListener('click', ev => { ev.stopPropagation(); const L = live[id]; if (L && !L.taken) { L.taken = true; L.inQuiet = quiet; b.classList.add('done'); b.textContent = '✓'; pending.push(id); } });
      document.getElementById('stage').appendChild(b);
      live[id] = { el: b, life, taken: false };
    }
    async function tickCues() {
      for (const id of Object.keys(live)) {
        const L = live[id]; if (!L || L.taken) continue;
        if (--L.life <= 0) {
          if (L.el) L.el.remove(); delete live[id];
          const c = I_CUE[id];
          if (L.unseen) missedUnseen++;
          if (c.missFx) fx(st, c.missFx, false);
          if (c.missFfx) ffx(c.missFfx);
          if (id === 'chaser103') S.expr(103, '真顔');
          if (c.miss) for (const x of c.miss) { if (Array.isArray(x)) await saySlow(x, g, 700); else await bubbleNode(x); }
        }
      }
    }
    async function flush() {
      while (pending.length) {
        const id = pending.shift(), c = I_CUE[id], L = live[id];
        if (L) { L.el && L.el.remove(); delete live[id]; }
        if (L && L.inQuiet && quiet) {          // あおいの話の途中で動いた
          quietBroken = true; quiet = false;
          fx(st, { 101: -6, air: -6 }); pick(`${c.label}（あおいの話の途中）`, 'cut');
          await saySlow(['P', 'all', c.quietSay || '「あ、ちょっといい？」', '割って入った'], g, 500);
          await saySlow([101, 'P', '「……あ、すみません。大丈夫です」', null, { 101: '困り顔' }], g);
          if (id === 'order') { fx(st, { 102: 2, air: 3 }); await saySlow([102, 'P', '「うちレモンサワー！」'], g, 600); }
          await saySlow(['n', '（あおいの話は、そこで終わった）'], g);
          continue;
        }
        m = Math.min(100, m + c.m); drawM();
        fx(st, c.fx); pick(`${c.label}に気づいた`, 'cue'); if (c.mem) memories.push(c.mem);
        for (const x of c.lines) await saySlow(x, g, 800);
        // 気配りで会話が一度切れたら、だれかが話を戻す（10/2 の感想：元の会話にそのまま戻るのが不自然）
        if (!c.noBridge && !inLull && lastSp != null) { const b = BRIDGE[lastSp]; await saySlow([lastSp, 'all', b[bridgeN++ % b.length]], g, 700); }
      }
    }
    async function afterSpeak() {
      if (m >= 90 && !tooChatty) { tooChatty = true; fx(st, { 101: -4, 102: -4, 103: -4, air: -6 }); await saySlow([1, 'P', '「お前、今日しゃべりすぎな」'], g); }
      else if (m >= 70 && !chatty) { chatty = true; fx(st, { air: -5 }, false); await saySlow([102, 'P', '「てか、めっちゃ喋るじゃん」', null, { 102: '笑' }], g); }
    }
    async function silentTick() {
      if (quiet) return;
      m = Math.max(0, m - 4); drawM();
      if (m === 0 && !lowFired) {
        lowFired = true; lowN++;
        fx(st, { 101: -2, 102: -2, 103: -2 });
        await saySlow([1, 'P', '「おい、お前も何か言えよ」'], g);
        m = 15; drawM();
      }
    }
    const half = d => { const o = {}; Object.entries(d || {}).forEach(([k, v]) => { o[k] = v > 0 && k !== 'air' ? Math.round(v / 2) : v; }); return o; };
    const KIND = { dig: '聞く', go: '乗る', tease: 'ツッコむ', furu: '話しかける', topic: '話題を出す' };
    // 吹き出し（時間で消える）。opts: [{label, sub, ...}]
    function bubble(opts, ms, title, quietLabel) {
      return new Promise(res => {
        let done = false;
        const fin = v => { if (done) return; done = true; S.cancel(t); res(v); };
        const p = S.el('div', 'panelcmd');
        p.appendChild(S.el('div', 'top2', `<span>${title || '口を挟む？（黙っていれば話は進む）'}</span>`));
        const clock = S.el('div', 'clock', '<i></i>'); p.appendChild(clock);
        p.appendChild(S.row(opts.map(o => S.btn(o.label, o.sub, 'pill', () => fin(o)))));
        const q = quietLabel || ['黙って聞く', '口を挟まない'];
        p.appendChild(S.row([S.btn(q[0], q[1], 'quiet', () => fin(null))]));
        S.put(p);
        const i = clock.firstChild; i.style.transition = 'none'; i.style.width = '100%'; void i.offsetWidth;
        requestAnimationFrame(() => { i.style.transition = `width ${ms}ms linear`; i.style.width = '0%'; });
        const t = S.later(() => fin(null), ms, g);
      });
    }
    async function line(x) {
      if (x[0] === 'n') { idle(); S.narr(x[1]); await S.sleep(1500, g); }
      else { idle(); await saySlow(x, g); if (typeof x[0] === 'number') lastSp = x[0]; }
      await flush(); await tickCues(); await silentTick();
    }
    // 吹き出しつきの1行
    async function bubbleNode(node) {
      const b = node.b, sp = node.line[0], isHer = HS.includes(sp);
      if (typeof sp === 'number') lastSp = sp;
      const L0 = [node.line[0], node.line[1], plain(node.line[2]), node.line[3], node.line[4]];
      b.opts.forEach(o => { if (o.k === 'dig' && o.need > 0 && isHer) S.expr(sp, st.h[sp] >= o.need ? 'はにかみ' : '真顔'); });
      const opts = b.opts.filter(o => o.k !== 'card' || hand.has(o.card)).map(o => Object.assign({ sub: o.k === 'card' ? I_CARDS[o.card] : KIND[o.k] }, o));
      if (!opts.length) { await line([node.line[0], node.line[1], plain(node.line[2]), node.line[3], node.line[4]]); return; }   // 手札が無い設定では、ふつうの行
      if (opts.some(o => o.k === 'card')) tip('card'); else if (opts.some(o => o.k === 'dig' && o.need > 0) && isHer) tip('sign'); else tip('bubble');
      let v = null, cut = false;
      if (b.at === 'start') {
        const ty = typeLine(L0, g, 75);
        v = await bubble(opts, L0[2].length * 75 + b.extra);
        if (v && !ty.finished) { ty.cut(); cut = true; } else { await ty.done; S.say(L0[0], L0[1], null, L0[2], { html: hl(node.line[2]), nolog: true, expr: L0[4] }); }
      } else {
        idle();
        await saySlow(L0, g, 250);
        S.say(L0[0], L0[1], null, L0[2], { html: hl(node.line[2]), nolog: true, expr: L0[4] });
        v = await bubble(opts, b.ms);
      }
      S.clear();
      if (!v) {
        pick('黙った', 'silence');
        if (b.silence.fx) fx(st, b.silence.fx);
        ffx(b.silence.ffx);
        for (const x of b.silence.lines) await saySlow(x, g);
        await flush(); await tickCues(); await silentTick();
        return;
      }
      let res;
      if (v.k === 'dig') res = cut && v.cut ? v.cut : (st.h[sp] == null || st.h[sp] >= v.need) ? v.ok : (v.ng || v.ok);
      else res = cut && v.cut ? v.cut : v;
      if (v.k === 'card') hand.delete(v.card);
      if (v.mem && (v.k !== 'dig' || res === v.ok)) memories.push(v.mem);
      const high = m >= 70;
      m = Math.min(100, m + 15 + (cut && isHer ? 8 : 0)); drawM();
      pick(v.label + (v.k === 'card' ? `（${I_CARDS[v.card]}）` : '') + (cut ? '（遮った）' : ''), v.k);
      const to = v.k === 'furu' ? 102 : sp;
      await saySlow(['P', to, v.say, cut ? '割り込んだ' : KIND[v.k] || '自分の話'], g, 600);
      let eff = res.fx;
      if (cut && isHer && !v.cut) { eff = Object.assign({}, eff); eff[sp] = (eff[sp] || 0) - 3; await saySlow([sp, 'P', '「……あ、はい」', null, { [sp]: '困り顔' }], g, 600); }
      if (high) eff = half(eff);
      fx(st, eff);
      if (v.k === 'furu') S.expr(102, '笑');
      for (const x of res.lines) await saySlow(x, g);
      await afterSpeak();
      await flush(); await tickCues();
    }
    // 会話が途切れた：話題を出すか、待つか
    async function lull(node) {
      await flush(); inLull = true; tip('lull');
      S.narr('（会話が、ふっと途切れた）');
      const rest = Object.keys(I_TOPICS).filter(k => !opened.has(k));
      // 出せる話題は3つまで（夜ごとに入れ替わる）。ボタンを増やさない
      const offer = rest.slice().sort(() => Math.random() - 0.5).slice(0, 3);
      const opts = offer.map(k => ({ k: 'topic', topic: k, label: I_TOPICS[k].label, sub: I_TOPICS[k].openTo ? 'ゆなに振る' : '話題を出す' }));
      const waitText = node.wait === 'aoi' ? '待てば、だれかが話し出す' : '待てば、友達が話題を出す';
      const v = await bubble(opts, 6000, `話題を出す？（${waitText}）`, ['待つ', waitText]);
      S.clear(); await flush(); inLull = false; lastSp = null;
      if (!v) {
        pick('待った', 'silence');
        await silentTick();
        if (node.wait === 'aoi') { storyHeard = true; await play2(I_STORY); if (quietBroken) storyHeard = 'cut'; return; }
        const k = rest.includes('sumai') ? 'sumai' : rest[0];
        const T = I_TOPICS[k]; opened.add(k);
        S.logRound('話題：' + T.label);
        const fid = T.openF[0];
        HS.forEach(h => { if (T.fans[h]) f[h][fid] += 4; });
        await line(T.openF);
        await play2(T.nodes);
        return;
      }
      const T = I_TOPICS[v.topic]; opened.add(v.topic);
      S.logRound('話題：' + T.label);
      const high = m >= 70;
      m = Math.min(100, m + 12); drawM();
      pick(`${T.label}を出した`, 'topic');
      await saySlow(['P', T.openTo || 'all', T.openP, '話題を出した'], g, 600);
      fx(st, high ? half(T.fans) : T.fans);
      await afterSpeak();
      await play2(T.nodes);
      if (node.wait === 'aoi') await play2(I_LAST);      // あおいの番は来なかった
    }
    async function play2(nodes) {
      for (const node of nodes) {
        if (Array.isArray(node)) { await line(node); continue; }
        if (node.heading) { S.logRound(node.heading); continue; }
        if (node.block) { lowFired = false; continue; }
        if (node.ffx) { ffx(node.ffx); continue; }
        if (node.expr && !node.cue) { Object.entries(node.expr).forEach(([h, x]) => S.expr(+h, x)); continue; }
        if (node.cue) { if (node.expr) Object.entries(node.expr).forEach(([h, x]) => S.expr(+h, x)); showCue(node.cue, node.life); continue; }
        if (node.lull) { lowFired = false; await lull(node); continue; }
        if (node.story) {
          for (const x of node.story) {
            if (quietBroken) break;
            if (!Array.isArray(x)) { showCue(x.cue, x.life); continue; }
            idle(); await saySlow(x, g); await flush(); await tickCues();
          }
          continue;
        }
        if (node.quiet === true) { quiet = true; quietBroken = false; continue; }
        if (node.quiet === false) {
          const was = quiet; quiet = false;
          if (was && !quietBroken) { fx(st, node.ok.fx); pick('あおいの話を黙って聞いた', 'listen'); memories.push({ h: 101, send: '「昨日、話してくれてありがとう」', echo: '「……聞いてくれて、ありがとうございました」' }); for (const x of node.ok.lines) await saySlow(x, g); }
          await flush();
          continue;
        }
        if (node.ifCue) { if (live[node.ifCue] && !live[node.ifCue].taken) await line(node.line); continue; }

      }
    }

    S.narr(prof.intro); await S.sleep(1800, g);
    if (iTips) await saySlow([1, 'P', '「今日のネタ、使いどころな。同じ話、二回すんなよ」'], g, 900);
    S.narr('手札（自分の経験）は ' + prof.cards.map(k => I_CARDS[k]).join('・') + '。1枚1回。会話は勝手に進む。口を挟めるときは、下に吹き出しが出る'); await S.waitTap(g, 'タップで始める');
    await play2(I_FLOW);
    Object.keys(live).forEach(id => { if (!live[id].taken) live[id].life = 1; }); await tickCues();
    Object.keys(live).forEach(id => { if (live[id].el) live[id].el.remove(); delete live[id]; });
    slowHint = null;
    await closing(st, f, g, { maxM, lowN, seen, missedUnseen, storyHeard, mode, memories });
  }

  // ── 終わり方（10/2 調べた流れ）：締め → 会計 → 全員と交換 → 二次会か帰るか（駅まで送る）→ 翌朝のお礼LINE＝結果発表 ──
  const LINE_A = { 101: '「……今度、駅前の本屋さん、付き合ってもらえますか」', 102: '「てか今度、店来てよ。ハート描いてあげる」', 103: '「……今度、星の見えるとこ、行こ」' };

  // スマホの画面（LINE）。舞台の上にかぶせる

  async function closing(st, f, g, info) {

    if (go === 'go') {

      const meiGo = st.h[103] >= 38;
      await say(['P', 'all', '「行く行く」', '二次会']);
      if (meiGo) { await say(['n', '（あおいは、駅のほうへ帰っていった）']); S.leave(101); }
      else { await say(['n', '（めいは、あおいと一緒に駅のほうへ歩いていった）']); S.leave(101); S.leave(103); }
      if (!yunaGo) { await say(['n', '（ゆなも、手を振って帰っていった）']); S.leave(102); }
      S.scene('karaoke', 'カラオケ');
      await say(['n', '（駅前のカラオケに移った）']);
      if (yunaGo) {
        if (f[102][4] > st.h[102]) { await say(['n', '（ゆなは、けいたとデュエットしていた）']); lines.push('二次会で、ゆなはけいたと盛り上がっていた'); }
        else { fx(st, { 102: 4 }); await say([102, 'P', '「一緒に歌お！ これ知ってる？」', null, { 102: '笑' }]); lines.push('二次会で、ゆなと歌った'); }
      }
      if (meiGo) { fx(st, { 103: 4 }); await say(['n', '（めいは、ずっと聞く側だった）']); await say([103, 'P', '「……君の、もう一回聞きたい」', null, { 103: 'はにかみ' }]); lines.push('めいも二次会に来て、ずっと聞く側だった'); }
    } else {
      st.picks.push('帰った');
      const goers = [101, 103].concat(yunaGo ? [] : [102]);
      await say(['P', 'all', '「俺は今日は帰るわ」', '帰る']);
      await say(['n', yunaGo ? '（けんたたちは、カラオケのほうへ歩いていった）' : '（けんたとけいたは、カラオケのほうへ歩いていった）']);
      S.leave(1); S.leave(4); if (yunaGo) S.leave(102);
      S.scene('station', '駅まで');
      const who = await choose('駅まで送る？', goers.map(h => ({ label: NAME[h], sub: '駅まで送るよ', v: h })).concat([{ label: 'ひとりで帰る', v: null, cls: 'quiet' }]));
      if (who != null) {
        await say(['P', who, '「駅まで送るよ」', '声をかけた']);
        if (st.h[who] >= 40) { walked = who; fx(st, { [who]: 5 }); await say([who, 'P', SEND_ACC[who], null, { [who]: 'はにかみ' }]); await say(['n', `（${NAME[who]}と、駅まで並んで歩いた）`]); lines.push(`${NAME[who]}と、駅まで一緒に帰った`); }
        else { await say([who, 'P', SEND_NO[who], null, { [who]: '真顔' }]); lines.push(`${NAME[who]}には、やんわり断られた`); }
      } else lines.push('ひとりで帰った');
    }

    // 翌朝：お礼LINE（結果発表）
    S.logRound('翌朝'); S.scene('', '翌朝');
    S.clear(); S.narr('（翌朝。スマホを見る）');
    const ph = openPhone('LINE　昨日の飲み会（6）');
    await S.sleep(500, g);
    ph.msg(1, '「昨日おつかれー！」'); await S.sleep(700, g);
    if (!cold) { ph.msg(102, '「楽しかった〜！ また飲も」'); await S.sleep(700, g); }
    ph.msg(4, '「おつ」'); await S.sleep(500, g);
    const gr = await choose('グループに、なにか送る？', [{ label: '楽しかった！ ありがとう', v: 'thanks' }, { label: 'スタンプだけ', v: 'stamp' }, { label: '送らない', v: null, cls: 'quiet' }]);
    if (gr === 'thanks') { ph.msg('P', '「楽しかった！ ありがとう」'); fx(st, { 101: 1, 102: 1, 103: 1 }, false); await S.sleep(800, g); ph.msg(102, '「こちらこそ〜！」'); await S.sleep(600, g); ph.msg(101, '「ありがとうございました」'); st.picks.push('グループにお礼'); }
    else if (gr === 'stamp') {
      const k = await choose('どのスタンプ？', STAMPS.map((x, i) => ({ label: x.t, v: i })));
      ph.stamp('P', STAMPS[k]); st.picks.push('グループにスタンプ（' + STAMPS[k].t + '）');
      if (!cold) { await S.sleep(800, g); ph.stamp(102, { t: 'うける', f: 'laugh' }); }
    }
    await S.sleep(500, g);
    const to = await choose('だれかに、個別にLINEする？', HS.map(h => ({ label: NAME[h], v: h })).concat([{ label: '送らない', v: null, cls: 'quiet' }]));
    let tier = null, usedMem = null;
    if (to != null) {
      const seenTxt = new Set();
      const mems = info.memories.filter(mm => mm.h === to && !seenTxt.has(mm.send) && seenTxt.add(mm.send)).slice(0, 2);
      const msgOpts = mems.map(mm => ({ label: mm.send.replace(/^「|」$/g, ''), sub: '昨日の話に触れる', v: mm, cls: 'line' }))
        .concat([{ label: '昨日はありがとう！ 楽しかった', sub: 'ふつうのお礼', v: 'plain', cls: 'line' }]);
      const msg = await choose(`${NAME[to]}に、なんて送る？`, msgOpts);
      ph.title(`LINE　${NAME[to]}`); ph.clear();
      usedMem = msg === 'plain' ? null : msg;
      ph.msg('P', usedMem ? usedMem.send : '「昨日はありがとう！ 楽しかった」');
      st.picks.push(`${NAME[to]}にLINE（${usedMem ? '昨日の話に触れた' : 'ふつうのお礼'}）`);
      const score = st.h[to] + (usedMem ? 8 : 0) + (walked === to ? 6 : 0);
      tier = score >= 56 ? 'A' : score >= 42 ? 'B' : score >= 32 ? 'C' : 'D';
      await S.sleep(900, g);
      if (tier === 'D') { ph.sys('既読'); await S.sleep(1200, g); ph.sys('（返事は来なかった）'); }
      else {
        ph.sys(tier === 'C' ? '既読 ……（夕方）' : '既読');
        await S.sleep(tier === 'A' ? 700 : 1300, g);
        if (usedMem && tier !== 'C') { ph.msg(to, usedMem.echo); await S.sleep(800, g); }
        ph.msg(to, tier === 'A' ? LINE_A[to] : tier === 'B' ? LINE_B[to] : LINE_C[to]);
      }
      lines.push(`${NAME[to]}に「${usedMem ? '昨日の話' : 'お礼'}」を送った → ` + { A: '次の約束', B: 'やりとりが続いた', C: '社交辞令の返事', D: '既読のまま' }[tier]);
    }
    // むこうから来る
    const inbound = HS.filter(h => h !== to && st.h[h] >= 50);
    for (const h of inbound) { await S.sleep(900, g); ph.title(`LINE　${NAME[h]}`); ph.clear(); ph.msg(h, LINE_IN[h]); lines.push(`${NAME[h]}のほうから、LINEが来た`); }
    S.put(S.el('div', 'hint', 'タップで結果 ▸'));
    await S.waitTap(g);
    ph.close();
    slowHint = null;

    const titles = { A: '次の約束', B: 'LINEが続いた', C: '社交辞令で終わった', D: '既読のまま' };
    const title = tier ? titles[tier] : inbound.length ? 'むこうから来た' : '何も起きなかった';
    const lead = tier === 'A' ? DATE_TXT[to] : walked ? `${NAME[walked]}と、駅まで一緒に帰った夜だった。` : '全員と連絡先は交換してある。';
    const imp = info.maxM >= 90 ? '「よく喋る人」だと思われたかもしれない。' : info.lowN ? '途中、影が薄くなっていた時間があった。' : '喋る量は、ちょうどよかった。';
    S.end({ title, lead, hearts: st.h, base: { 101: BASE, 102: BASE, 103: BASE },
      sections: [
        { h: '終わり方', p: lines.length ? lines : ['（特になし）'] },
        { h: 'LINEで触れられた話', p: [info.memories.length ? `${info.memories.length}つ（${[...new Set(info.memories.map(mm => NAME[mm.h]))].join('・')}）。会話で届いた返しが、翌朝の話題になる。` : 'なし。会話で届いた返しがないと、ふつうのお礼しか送れない。'] },
        { h: 'この夜の手', p: [st.picks.join(' ／ ') || '（何もしなかった）'] },
        { h: '目立ちと気づき', p: [`目立ちは いちばん高いとき ${info.maxM}。${imp}`, `気づけた札 ${info.seen}枚。気づけなかったもの ${info.missedUnseen}つ（空気読み ${iYomi}）。`, info.storyHeard === 'cut' ? '最後の沈黙で待ったので あおいが話し出したが、途中で止めてしまった。' : info.storyHeard ? '最後の沈黙で待ったので、あおいの話が聞けた。' : '最後の沈黙で話題を出したので、あおいの番は来なかった。'] },
        { h: 'この方式の台詞', p: [`このデモで書いた台詞 ${info.mode.count}行（地の文を除く）。` + info.mode.costNote] }],
      again: () => info.mode.start(info.mode.back), back: info.mode.back });
  }
  // ── 方式の登録 ────────────────────────────────────────────
  function make(def, run, data) {
    const m = Object.assign({ count: countLines(data) }, def);
    m.start = back => { m.back = back; const g = S.begin(m.title); S.menu([{ label: '最初から', fn: () => m.start(back) }]); S.onTap(null); run(m, g); };
    return m;
  }
  const MODES = {
    C: make({ title: 'C 論破', costNote: '1夜ごとに台本1本。光る言葉と手札の当たり外れを足していく。周回すると覚えゲーになる。' }, runC, [C_SEGS, C_HITS, C_MISS_SAY, C_MISS_BACK]),
    D: make({ title: 'D 3択', costNote: '台本＋要所3択。分岐はすぐ本筋に戻すので、増え方はゆるい。' }, runD, D),
    E: make({ title: 'E 割り込み', costNote: '台本＋口を挟んだ／黙った／遮ったの3通り。タイミングの調整に手間がかかる。' }, runE, E),
    G: make({ title: 'G ミックス・流れる', costNote: '話題ごとの小さな台本（5〜10行）＋光る言葉ごとに 掘る／乗る の2通り。書く単位が「1行」から「話題」になる。' }, (m, g) => runGH(m, g, true), [GH, GH_HOOK]),
    H: make({ title: 'H ミックス・止まる', costNote: '中身はGと同じ。違うのは、時間で流れるかタップで進むかだけ。' }, (m, g) => runGH(m, g, false), [GH, GH_HOOK]),
    I: make({ title: 'I 流れる会話（設定A）', profile: 'A', costNote: '話題ごとの台本（出す順は自由）＋吹き出しごとに自然な返し2〜3通り（手札は合う所にだけ出る）。気づきは1つ2〜3行。' }, runI, [I_FLOW, I_TOPICS, I_STORY, I_CUE, I_HOOKS, LINE_A, LINE_B, LINE_C, LINE_IN, SEND_ACC, SEND_NO]),
    IB: make({ title: 'I 流れる会話（設定B）', profile: 'B', costNote: '話題ごとの台本（出す順は自由）＋吹き出しごとに自然な返し2〜3通り（手札は合う所にだけ出る）。気づきは1つ2〜3行。' }, runI, [I_FLOW, I_TOPICS, I_STORY, I_CUE, I_HOOKS, LINE_A, LINE_B, LINE_C, LINE_IN, SEND_ACC, SEND_NO]),
    IC: make({ title: 'I 流れる会話（設定C）', profile: 'C', costNote: '話題ごとの台本（出す順は自由）＋吹き出しごとに自然な返し2〜3通り（手札は合う所にだけ出る）。気づきは1つ2〜3行。' }, runI, [I_FLOW, I_TOPICS, I_STORY, I_CUE, I_HOOKS, LINE_A, LINE_B, LINE_C, LINE_IN, SEND_ACC, SEND_NO]),
    F: make({ title: 'F 気配り', costNote: '台本＋行動への反応。行動の種類は増やさず、合図（グラス・手・スマホ）を台本に置いていく。' }, runF, [F, F_OK, F_PLAIN, F_CUT]),
  };
  return MODES;
})();

</script>
<script>
// 一覧と切り替え
(() => {
  'use strict';
  const list = document.getElementById('mlist');
  const back = () => { Stage.home(); render(); };
  const DEFS = [
    { id: 'I', name: '流れる会話＋気づき', ref: 'C ＋ E ＋ グノーシアの「疑い」と「嘘に気づく」',
      what: '会話は勝手に流れる。吹き出しには、自然につながる返しだけが出る（聞く／乗る／手札）。会話が途切れたら、話題を出すか待つか。喋りすぎると目立ち、黙りすぎると影が薄い。黙っている間ほど気づける。お開きのあとは二次会か帰るか、翌朝のお礼LINEが結果発表',
      lines: () => `台本＋吹き出しの分岐（このデモ ${Scripted.I.count}行）`, play: () => Scripted.I.start(back), latest: true,
      profiles: [['A', '塾バイト・文化系・実家', 'あおいと話が合う'], ['B', '居酒屋バイト・フットサル・一人暮らし', 'ゆなと話が合う'], ['C', 'パン屋の朝番・軽音・学生寮', 'めいと話が合う']] },
    { id: 'A', name: 'グノーシア（今の版）', ref: 'グノーシア',
      what: '話題を出す。誰かが話した直後に 乗る・掘る・茶化す。ふだんは隠れていて「割って入る」で出す',
      lines: '部品を組み立てる。話題・子・深さ・手の掛け算で増える',
      play: seed => EngineMode.start({ ai: false, seed, back }), seedBtn: true },
    { id: 'B', name: 'AIが台詞を書く', ref: 'Façade・AI Dungeon',
      what: 'Aと同じ遊び方・同じ計算。台詞だけ、AIが前後を読んで書く',
      lines: 'キャラ設定だけ。1ラウンドごとに数秒待つ。遊ぶ人の利用枠を使う',
      play: seed => EngineMode.start({ ai: true, seed, back }), seedBtn: true },
    { id: 'C', name: '論破', ref: 'ダンガンロンパ・逆転裁判',
      what: '会話は勝手に流れる。光った言葉をタップして、手札の話題（塾バイト・実家・部室の主）を重ねる',
      lines: () => `台本1本（このデモ ${Scripted.C.count}行）`, play: () => Scripted.C.start(back) },
    { id: 'D', name: '3択', ref: 'ペルソナ・ときメモ',
      what: '台本を読み進め、要所で自分の返しを3つから選ぶ。合うと ♪',
      lines: () => `台本＋選択肢（このデモ ${Scripted.D.count}行）`, play: () => Scripted.D.start(back) },
    { id: 'E', name: '割り込み', ref: 'Oxenfree・Night in the Woods',
      what: '会話は勝手に進む。吹き出しが出ている間だけ口を挟める。黙るのも、遮るのも手',
      lines: () => `台本＋分岐（このデモ ${Scripted.E.count}行）`, play: () => Scripted.E.start(back) },
    { id: 'F', name: '気配り', ref: 'VA-11 Hall-A・Coffee Talk',
      what: '会話には口を出さない。グラス・皿・話に入れていない子を見て動く（場の手が主役）',
      lines: () => `台本＋行動への反応（このデモ ${Scripted.F.count}行）`, play: () => Scripted.F.start(back) },
    { id: 'G', name: 'ミックス（流れる）', ref: 'B・D ＋ C ＋ E ＋ F',
      what: '話題ごとの小さな台本が、時間で流れる。光った言葉に 掘る／乗る（1つの話題で1回）。はにかみ＝聞いてほしい。場の手は いつでも（取り分ける＝みんな、注文・話を振る＝1人）',
      lines: () => `話題ごとの台本＋掘る／乗るの分岐（このデモ ${Scripted.G.count}行）`, play: () => Scripted.G.start(back), mix: true },
    { id: 'H', name: 'ミックス（止まる）', ref: 'B・D ＋ C ＋ F',
      what: 'Gと同じ中身を、タップで進める。急かされずに、光った言葉を選べる',
      lines: () => `Gと同じ（このデモ ${Scripted.H.count}行）`, play: () => Scripted.H.start(back), mix: true },
  ];
  function render() {
    list.innerHTML = '';
    // 静的公開版（claude.ai の外）では、AIが台詞を書く B は動かないので出さない
    DEFS.filter(d => !(window.__STATIC__ && d.id === 'B')).forEach(d => {
      if (d.latest) { const hd = document.createElement('p'); hd.className = 'lead'; hd.style.margin = '0 0 8px'; hd.innerHTML = '<b>いちばん新しい案（10/3 更新）</b>自分の設定を3通りから選べる。手札（自分の経験）が変わるので、口を挟める所と話が合う子が変わる。話題を2つ足した（朝型・夜型／カメラロール）'; list.appendChild(hd); }
      if (d.id === 'A') { const hd = document.createElement('p'); hd.className = 'lead'; hd.style.margin = '18px 0 8px'; hd.innerHTML = '<b>これまでの案</b>'; list.appendChild(hd); }
      if (d.mix && !list.querySelector('.mixhd')) { const hd = document.createElement('p'); hd.className = 'lead mixhd'; hd.style.margin = '18px 0 8px'; hd.innerHTML = '<b>ここから ミックス案</b>（10/1 の感想から：つながる＝B・D、会話っぽい＝C・E、場の手＝F）'; list.appendChild(hd); }
      const c = document.createElement('div'); c.className = 'mcard';
      c.innerHTML = `<div class="hd"><span class="badge">${d.id}</span><span class="nm">${d.name}</span><span class="ref">元ネタ：${d.ref}</span></div>`
        + `<dl><dt>やること</dt><dd>${d.what}</dd><dt>台詞</dt><dd>${typeof d.lines === 'function' ? d.lines() : d.lines}</dd></dl>`;
      const go = document.createElement('div'); go.className = 'go';
      if (d.profiles) {
        go.classList.add('prof');
        d.profiles.forEach(([k, nm, who]) => {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'pbtn';
          b.innerHTML = `<b>設定${k}</b><span>${nm}</span><small>${who}</small>`;
          b.addEventListener('click', () => Scripted[k === 'A' ? 'I' : 'I' + k].start(back));
          go.appendChild(b);
        });
      } else {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = '遊ぶ'; b.addEventListener('click', () => d.play());
        go.appendChild(b);
      }
      if (d.seedBtn) {
        const s = document.createElement('button'); s.type = 'button'; s.className = 'sub';
        const seed = EngineMode.lastSeed;
        s.textContent = 'さっきの夜で'; s.title = 'AかBで遊んだ直前の夜を、もう一度';
        s.disabled = seed == null;
        s.addEventListener('click', () => d.play(EngineMode.lastSeed));
        go.appendChild(s);
      }
      c.appendChild(go); list.appendChild(c);
    });
  }
  document.getElementById('btn-back').addEventListener('click', back);
  render();
})();

</script>
